<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eraser Analogy</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a;
  --paint:#f6caa9; --edge:#de8550; --pt:#1f2328; --eraser:#1f2328;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c;
  --paint:#7a4e33; --edge:#f0a46f; --pt:#e6e8eb; --eraser:#e6e8eb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;align-items:center;justify-content:center;padding:8px}
/* all layers share one box with the plot's aspect ratio */
.stage{position:relative;width:100%;max-height:100%;aspect-ratio:600/440}
.stage > *{position:absolute;inset:0;width:100%;height:100%}
#paint{transition:opacity .9s ease}
#shape{opacity:0;transition:opacity .9s ease}
svg{overflow:visible;user-select:none}

.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.pt{fill:var(--pt)}
.eraser circle{fill:none;stroke:var(--eraser);stroke-width:2}
.eraser line{stroke:var(--eraser);stroke-width:1.5}
.eraser text{fill:var(--eraser);font-size:16px;font-weight:800;font-style:italic}
.eraser{transition:opacity .4s}
.label{fill:var(--muted);font-size:var(--lfs,17px);font-weight:700;font-style:italic;opacity:0;transition:opacity .8s}
.label.on{opacity:1}
.tag{fill:var(--edge);font-size:var(--lfs,17px);font-weight:800;opacity:0;transition:opacity .8s}
.tag.on{opacity:1}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="paint"></canvas>
  <canvas id="shape"></canvas>
  <svg id="ov" viewBox="0 0 600 440" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script>
(function(){
"use strict";
/* ============================================================
   Eraser analogy for the α-shape (proposal Fig. 2a).
   Play: a disc of radius α sweeps the trait space, erasing the shading
   everywhere it fits without touching a species; then the curved leftover
   (the α-hull) is replaced by the straight-edged α-shape.

   Options
     alpha=20      eraser radius in trait units (works for ~12–32)
     speed=1       animation speed
     channel=...   shared with controls.html (default "eraser")
     labels=0      hide the "void" / "gap" / "α-shape" labels
     afs / lfs     axis-label / label font size (px)
     theme, bg=transparent, autoplay=1
   ============================================================ */
const P = new URLSearchParams(location.search);
const SPEED = Math.max(.25, Math.min(4, parseFloat(P.get("speed")) || 1));
const SHOW_LABELS = P.get("labels") !== "0";
const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "lfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");
const css = n => getComputedStyle(root).getPropertyValue(n).trim();

/* ==================== geometry ==================== */
const W = 600, H = 440, M = {l:50, r:16, t:16, b:50};
const X0 = M.l, X1 = W - M.r, Y0 = H - M.b, Y1 = M.t;   // plot area (y0 = bottom)

/* ==================== points: the alpha-shape dataset (same as probabilistic-limit.html) ==================== */
// Raw trait coordinates; screen y grows with raw y, matching that page (flipped so up = larger trait value).
const RAW = [
[77.57,51.45],[66.06,40.17],[83.12,70.97],[86.51,31.58],[81.34,12.37],[97.35,68.04],
[109.56,59.99],[104.43,68.39],[95.65,36.33],[121.6,43.45],[76.72,47.4],[96.39,59.3],
[84.5,39.11],[86.01,59.28],[85.98,57.92],[117.13,36.55],[100.4,49.42],[89.16,59.64],
[96.49,81.73],[102.05,40.2],[74.23,52.48],[70.7,52.43],[91.1,38.83],[106.35,50.72],
[97.46,27.04],[95.57,56.33],[86.65,35.78],[76.05,60.13],[99.49,60.12],[102.05,50.19],
[86.87,63.81],[91.45,41.97],[112.86,52.19],[86.75,73.86],[112.57,68.7],[101.8,51.31],
[293.76,48.3],[300.92,52.15],[298.18,42.9],[299.92,46.33],[312.12,46.7],[323.99,74.09],
[313.58,43.55],[319.14,47.2],[326.93,62.93],[304.16,36.29],[312.2,37.88],[307.7,58.95],
[319.45,69.58],[303.26,64.6],[304.39,59.67],[302.2,66.91],[303.35,51.72],[320.86,38.21],
[341.25,53.21],[312.84,50.76],[306.31,79.67],[290.96,52.1],[311.92,43.22],[296.01,39.53],
[301.63,66.97],[308.34,41.02],[298.81,81.02],[333.81,75.65],[293.12,67.17],[288.59,48.48],
[321.53,55],[313.4,59.81],[316.53,79.19],[307.52,49.31],[323.83,26.4],[305.92,47.35],
[244.17,186.03],[171,125.72],[131.14,181.78],[204.94,124.69],[243.43,159.2],[234.01,148.7],
[249.12,188.11],[187.94,131.01],[256.01,223.75],[154.19,165.06],[231.82,227.71],[238.1,211.28],
[254.1,160.14],[151.18,203.66],[151.01,169.51],[235.25,215.92],[131.23,164.79],[222.01,131.88],
[235.87,221.99],[260.84,180.48],[209.31,150.99],[216.15,262.38],[137.46,161.85],[197.98,266.71],
[224.38,262.24],[150.74,206.78],[243.23,188.83],[133.75,226.83],[151.8,259],[261.45,227.44],
[163.76,176.6],[146.08,169.13],[170.91,230.19],[120.41,214.34],[200.07,143.73],[135.86,202.39],
[172.63,144.61],[277.16,190.36],[238.21,226.3],[213.39,136.97],[195.7,268.7],[200.84,246.26],
[217.3,147.17],[157.17,175.06],[170.29,260.23],[258.02,225.77],[144.96,245.92],[179.49,137.31],
[276.39,201.37],[162.87,197.27],[227.38,148.46],[174.94,170.02],[146.84,232.23],[187.34,264.58],
[173.56,152.28],[125.12,193.52],[123.25,194.99],[199.84,277.3],[151.84,238.19],[143.56,191.47],
[162.11,138.94],[157.23,155.46],[223.93,248.25],[225.1,218.4],[245,247.98],[165.58,245.06],
[174.43,237.71],[175.98,160.49],[227.68,252.56],[257.41,244.28],[174.88,146.47],[241.03,173.71],
[160.61,239.32],[155.19,171.76],[251.96,203.22],[228.09,223.13],[253.15,198.95],[159.36,172.79],
[240.3,189.36],[249.33,159.43],[142.65,223.57],[159.92,235.21],[216.44,240.17],[199.41,274.84],
[220.3,173.94],[232.46,185.46],[223.31,129.83],[252.43,225.44],[247.99,209.29],[274,175.28],
[171.76,167.59],[227.13,175.04],[163.01,222.39],[147.03,156.78],[185.92,141.56],[245.92,135.66],
[151.65,237.78],[256.24,157.59],[217.28,146.74],[234.8,187.12],[198.42,255.87],[250.03,209.6],
[167.74,251.25],[192.54,122.77],[173.27,271.82],[220.79,253.65],[258.23,161.33],[248.94,217.48],
[199.2,244.32],[242.94,145.41],[246.38,216.44],[162.68,167.36],[157.08,157.32],[261.54,237.23],
[218.79,162.67],[144.7,188.88],[142.75,187.29],[251.25,200.05],[237.85,170.69],[156.54,174.5],
[141.21,204.77],[244.59,250.44],[207.03,141.55],[125.84,207.4],[277.83,190.85],[254.02,227.94],
[189.95,244.36],[237.5,152.11],[240.86,221.79],[187.07,125.91],[151.33,194.74],[273.11,199.77],
[143.16,180.39],[179.87,162.2],[217.29,238.76],[194.64,120.36],[178.82,128.12],[197.54,249.53],
[231.22,143.21],[217.37,245.6],[235.71,205.6],[229.41,270.61],[257.32,150.66],[193.59,251.77],
[255.66,225.92],[157.87,187.45],[146.6,237.45],[203.29,140.53],[249.63,169.7],[239.73,174.32],
[161.87,249.19],[169.14,233.04],[167.93,238.7],[223.26,142.39],[217.17,236.75],[138.19,167.1],
[182.44,155.56],[229.36,260.53],[139.17,181.65],[256.79,189.35],[213.54,274.3],[247.86,142.36],
[169.27,257.76],[215.86,248.45],[149.1,162.03],[243.32,221.66],[187.21,238.45],[121.17,216.42],
[259.78,234.84],[186.67,132.61],[225.19,240.09],[243.68,188.18],[244.54,238.89],[140.01,152.97],
[175.38,160.96],[148.49,253.16],[210.41,127.96],[129.45,193.68],[167.79,153.16],[142.73,196.92],
[233.48,251.95],[220.95,248.34],[237.94,248.13],[142.64,221.19],[254.5,263.48],[146.56,186.63],
[139.4,227.28],[205.17,125.28],[228.73,259.86],[133.43,183.3],[225.87,263.81],[267.1,245.76],
[245.61,190.49],[128.17,186.23],[214.22,162.86],[173.17,124.73],[219.9,160.94],[234.1,239.18],
[183.01,237.58],[205.96,136.5],[201.78,163.17],[228.52,185.07],[230.03,248.77],[265.83,153.17],
[267.46,175.27],[189.79,122.23],[186.76,261.25],[146.52,151.06],[169.05,152.06],[175.8,238.33],
[239.34,181.45],[156.4,182.79],[162.8,164.64],[243.69,218.56],[170.18,148.96],[238.82,243.21],
[141.19,231.95],[191.3,132.04],[207.72,131.19],[169.65,163.17],[254.48,232.32],[225.45,157.46],
[247.84,219.87],[224.51,132.86],[159.95,164.62],[131.75,209.83],[151.69,146.88],[249.3,180.51],
[166.74,253.02],[222.52,255.3],[131.14,237.95],[128.67,196.96],[127.36,186.45],[158.24,233.04],
[264.54,217.12],[170.19,225.11],[269.45,221.28],[237.49,274.14],[207.27,273.29],[272.03,173.2]
];
// fit the data into the plot area with equal x/y scaling, centred
const PAD = 22;
const rx0 = Math.min(...RAW.map(p => p[0])) - PAD, rx1 = Math.max(...RAW.map(p => p[0])) + PAD;
const ry0 = Math.min(...RAW.map(p => p[1])) - PAD, ry1 = Math.max(...RAW.map(p => p[1])) + PAD;
const S = Math.min((X1 - X0) / (rx1 - rx0), (Y0 - Y1) / (ry1 - ry0));
const OX = X0 + ((X1 - X0) - (rx1 - rx0) * S) / 2, OY = Y1 + ((Y0 - Y1) - (ry1 - ry0) * S) / 2;
const toScreen = (x, y) => [OX + (x - rx0) * S, OY + (y - ry0) * S];
const PTS = RAW.map(p => toScreen(p[0], p[1]));
// eraser radius: given in trait units (?alpha=), default 20 — any value ~12–32 keeps the three
// groups intact while still fitting inside the ring's void (largest empty circle ≈ 33 units)
const ALPHA = (parseFloat(P.get("alpha")) || 20) * S;
const VOID_C = toScreen(196, 202);                  // centre of the ring's void
const GAP_C  = toScreen(200, 48);                   // between the two small clusters
const SHAPE_TAG = toScreen(108, 262);               // label position, beside the ring
// distance from (x,y) to the nearest species
function nearest(x, y){
  let m = Infinity;
  for (const p of PTS){ const d = (p[0]-x)**2 + (p[1]-y)**2; if (d < m) m = d; }
  return Math.sqrt(m);
}
const fits = (x, y) => nearest(x, y) >= ALPHA;      // the eraser fits here without touching a species

/* ==================== Delaunay (Bowyer–Watson) → α-shape ==================== */
function circum(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
  const a2 = a[0]*a[0]+a[1]*a[1], b2 = b[0]*b[0]+b[1]*b[1], c2 = c[0]*c[0]+c[1]*c[1];
  const ux = (a2*(b[1]-c[1]) + b2*(c[1]-a[1]) + c2*(a[1]-b[1])) / d;
  const uy = (a2*(c[0]-b[0]) + b2*(a[0]-c[0]) + c2*(b[0]-a[0])) / d;
  return {x:ux, y:uy, r:Math.hypot(a[0]-ux, a[1]-uy)};
}
function delaunay(pts){
  const S = 1e4, all = pts.concat([[-S, -S], [S*2, -S], [-S, S*2]]);
  const n = pts.length;
  let tris = [{v:[n, n+1, n+2]}];
  tris[0].c = circum(all[n], all[n+1], all[n+2]);
  for (let i = 0; i < n; i++){
    const p = all[i], bad = [], keep = [];
    for (const t of tris) ((p[0]-t.c.x)**2 + (p[1]-t.c.y)**2 < t.c.r**2 ? bad : keep).push(t);
    const edges = new Map();
    for (const t of bad) for (let k = 0; k < 3; k++){
      const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;
      edges.set(key, edges.has(key) ? null : [a, b]);
    }
    tris = keep;
    for (const e of edges.values()) if (e){
      const t = {v:[e[0], e[1], i]}; t.c = circum(all[e[0]], all[e[1]], p); tris.push(t);
    }
  }
  return tris.filter(t => t.v.every(v => v < n));
}
const TRIS = delaunay(PTS);
const KEPT = TRIS.filter(t => t.c.r <= ALPHA);      // α-shape = union of triangles with circumradius ≤ α
// boundary edges = edges used by exactly one kept triangle
const edgeCount = new Map();
for (const t of KEPT) for (let k = 0; k < 3; k++){
  const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;
  edgeCount.set(key, (edgeCount.get(key) || 0) + 1);
}
const BOUNDARY = [...edgeCount].filter(([, c]) => c === 1).map(([k]) => k.split(",").map(Number));

/* ==================== canvases ==================== */
const paint = document.getElementById("paint"), shape = document.getElementById("shape");
const SCALE = Math.min(3, (window.devicePixelRatio || 1) * 2);
for (const c of [paint, shape]){ c.width = W*SCALE; c.height = H*SCALE; }
const pctx = paint.getContext("2d"), sctx = shape.getContext("2d");
pctx.scale(SCALE, SCALE); sctx.scale(SCALE, SCALE);

function fillPaper(){                               // the whole trait space shaded in
  pctx.globalCompositeOperation = "source-over";
  pctx.clearRect(0, 0, W, H);
  pctx.fillStyle = css("--paint");
  pctx.fillRect(X0, Y1, X1 - X0, Y0 - Y1);
  pctx.globalCompositeOperation = "destination-out";
}
function erase(x, y){ pctx.beginPath(); pctx.arc(x, y, ALPHA, 0, 2*Math.PI); pctx.fill(); }
function drawShape(){                               // final straight-edged α-shape
  sctx.clearRect(0, 0, W, H);
  sctx.fillStyle = css("--paint"); sctx.strokeStyle = css("--paint"); sctx.lineWidth = .8;
  for (const t of KEPT){
    const [a, b, c] = t.v.map(i => PTS[i]);
    sctx.beginPath(); sctx.moveTo(a[0], a[1]); sctx.lineTo(b[0], b[1]); sctx.lineTo(c[0], c[1]); sctx.closePath();
    sctx.fill(); sctx.stroke();
  }
  sctx.strokeStyle = css("--edge"); sctx.lineWidth = 2.2; sctx.lineJoin = "round";
  sctx.beginPath();
  for (const [i, j] of BOUNDARY){ sctx.moveTo(PTS[i][0], PTS[i][1]); sctx.lineTo(PTS[j][0], PTS[j][1]); }
  sctx.stroke();
}

/* ==================== overlay: axes, labels, points, eraser ==================== */
const NS = "http://www.w3.org/2000/svg";
const ov = document.getElementById("ov");
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
{
  const g = el("g", {}, ov);
  el("path", {d:`M${X0},${Y1-6}V${Y0}H${X1+6}`, class:"axis"}, g);
  el("path", {d:`M${X1+12},${Y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${X0},${Y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(X0+X1)/2, y:H-12, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${X0-18},${(Y0+Y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
const labels = [];
if (SHOW_LABELS){
  const mk = (pos, txt, cls, anchor) => { const t = el("text", {x:pos[0], y:pos[1], "text-anchor":anchor || "middle", class:cls}, ov); t.textContent = txt; labels.push(t); };
  mk([VOID_C[0], VOID_C[1] + 6], "void", "label");
  mk([GAP_C[0], GAP_C[1] + 6], "gap", "label");
  mk(SHAPE_TAG, "α-shape", "tag", "end");
}
{
  const g = el("g", {}, ov);
  PTS.forEach(p => el("circle", {cx:p[0].toFixed(1), cy:p[1].toFixed(1), r:2.6, class:"pt"}, g));
}
const eraser = el("g", {class:"eraser", opacity:0}, ov);
el("circle", {cx:0, cy:0, r:ALPHA}, eraser);
el("line", {x1:0, y1:0, x2:ALPHA*Math.cos(-.6), y2:ALPHA*Math.sin(-.6)}, eraser);
el("text", {x:ALPHA*Math.cos(-.6)*.45 - 2, y:ALPHA*Math.sin(-.6)*.45 - 5}, eraser).textContent = "α";
const moveEraser = (x, y) => eraser.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);

/* ==================== sweep path ==================== */
// Visible sweep: back-and-forth rows; the eraser only stops where it fits (it hops over species).
const SWEEP = [];
{
  const rowGap = ALPHA * .9, step = 4;
  let dir = 1;
  for (let y = Y1 - ALPHA*.4; y <= Y0 + ALPHA*.4; y += rowGap){
    const xs = [];
    for (let x = X0 - ALPHA*.4; x <= X1 + ALPHA*.4; x += step) xs.push(x);
    if (dir < 0) xs.reverse();
    for (const x of xs) if (fits(x, y)) SWEEP.push([x, y]);
    dir = -dir;
  }
}
// Clean-up: every remaining spot the eraser could reach (fine grid), so the leftover is exactly the α-hull.
const CLEAN = [];
for (let y = Y1 - ALPHA; y <= Y0 + ALPHA; y += 2)
  for (let x = X0 - ALPHA; x <= X1 + ALPHA; x += 2)
    if (fits(x, y)) CLEAN.push([x, y]);

/* ==================== animation ==================== */
let idx = 0, playing = false, done = false, runId = 0, raf = 0;
const PER_FRAME = 9;                                 // sweep positions per frame (× speed)

function resetAll(){
  runId++; playing = false; done = false; idx = 0; cancelAnimationFrame(raf);
  fillPaper(); paint.style.opacity = 1; shape.style.opacity = 0;
  eraser.setAttribute("opacity", 0);
  labels.forEach(l => l.classList.remove("on"));
  postStatus();
}
function showFinal(){
  for (const [x, y] of CLEAN) erase(x, y);           // finish the α-hull exactly
  eraser.setAttribute("opacity", 0);
  drawShape();
  paint.style.opacity = 0; shape.style.opacity = 1;  // curved α-hull → straight-edged α-shape
  labels.forEach(l => l.classList.add("on"));
  done = true; playing = false; postStatus();
}
function frame(){
  if (!playing) return;
  const n = Math.max(1, Math.round(PER_FRAME * SPEED));
  for (let k = 0; k < n && idx < SWEEP.length; k++, idx++) erase(SWEEP[idx][0], SWEEP[idx][1]);
  if (idx < SWEEP.length){
    moveEraser(SWEEP[idx][0], SWEEP[idx][1]);
    raf = requestAnimationFrame(frame);
  } else {
    // sweep finished: clean up, park the eraser in the void for a beat, then show the α-shape
    for (const [x, y] of CLEAN) erase(x, y);
    moveEraser(VOID_C[0], VOID_C[1]);
    const my = runId;
    setTimeout(() => { if (my === runId && playing) showFinal(); }, 1100 / SPEED);
  }
}
function setPlay(want){
  if (want){
    if (done) resetAll();
    if (!playing){ playing = true; eraser.setAttribute("opacity", 1); raf = requestAnimationFrame(frame); }
  } else if (playing){ playing = false; cancelAnimationFrame(raf); }
  postStatus();
}

/* ==================== controls.html link (own channel) ==================== */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "eraser") : null;
function postStatus(){ if (bc) bc.postMessage({cmd:"status", arg:{playing, placed: done ? 1 : 0, N:1}}); }
const ACTIONS = { setPlay, reset: resetAll, all: () => { playing = true; showFinal(); }, ping: postStatus };
if (bc) bc.onmessage = e => { const f = e.data && ACTIONS[e.data.cmd]; if (f) f(e.data.arg); };

/* ==================== init ==================== */
resetAll();
if (P.get("autoplay") === "1") setTimeout(() => setPlay(true), 600);
})();
</script>
