<title>Eraser Outlier</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a;
  --paper:#fbe6d6; --paint:#f6caa9; --edge:#de8550; --pt:#1f2328; --eraser:#1f2328; --hull:#9aa3ad;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c;
  --paper:#4a3426; --paint:#7a4e33; --edge:#f0a46f; --pt:#e6e8eb; --eraser:#e6e8eb; --hull:#5b636d;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;align-items:center;justify-content:center;padding:8px}
/* every layer shares one box with the plot's aspect ratio */
.stage{position:relative;width:100%;max-height:100%;aspect-ratio:600/440}
.stage > *{position:absolute;inset:0;width:100%;height:100%}
canvas{transition:opacity .8s ease}
svg{overflow:visible;user-select:none}

.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.hull{fill:none;stroke:var(--hull);stroke-width:1.5;stroke-dasharray:6 5}
.pt{fill:var(--pt)}
.pt.out{fill:var(--edge);stroke:var(--pt);stroke-width:1.2}
.eraser circle.disc{fill:rgba(255,255,255,.35);stroke:var(--eraser);stroke-width:2.2}
.eraser line{stroke:var(--eraser);stroke-width:1.5}
.eraser text{fill:var(--eraser);font-size:17px;font-weight:800;font-style:italic}
.eraser{transition:opacity .25s}
.label{fill:var(--muted);font-size:var(--lfs,17px);font-weight:700;font-style:italic;opacity:0;transition:opacity .8s}
.label.on{opacity:1}
.tag{fill:var(--edge);font-size:var(--lfs,17px);font-weight:800;opacity:0;transition:opacity .8s}
.tag.on{opacity:1}
</style>

     1. the convex hull is shaded — what FRic counts as occupied
     2. a disc of radius α rolls around the outside of each group, pressing
        against the outermost species and erasing as it goes
     3. it drops into the ring's void and rolls around inside it
     4. everywhere else it fits fades away → the curved α-hull
     5. the α-hull becomes the straight-edged α-shape

     alpha=20     eraser radius in trait units (~12–32 keeps the three groups intact)
     alpha=crit   use the critical α: the smallest eraser for which EVERY species sits in at

     outlier=x,y  add one distal species at raw trait coords (x,y), drawn highlighted

const EXTENT  = parseXY(P.get("extent"));                       // frame-only point, not a species
const DATA = OUTLIER ? RAW.concat([OUTLIER]) : RAW;             // the species actually analysed
const OUT_I = OUTLIER ? DATA.length - 1 : -1;
// fit into the plot area with equal x/y scaling, centred (frame includes outlier/extent)
const PAD = 26;
const FRAME = DATA.concat(EXTENT ? [EXTENT] : []);
const rx0 = Math.min(...FRAME.map(p => p[0])) - PAD, rx1 = Math.max(...FRAME.map(p => p[0])) + PAD;
const ry0 = Math.min(...FRAME.map(p => p[1])) - PAD, ry1 = Math.max(...FRAME.map(p => p[1])) + PAD;
const S = Math.min((X1 - X0) / (rx1 - rx0), (Y0 - Y1) / (ry1 - ry0));
const OX = X0 + ((X1 - X0) - (rx1 - rx0) * S) / 2, OY = Y1 + ((Y0 - Y1) - (ry1 - ry0) * S) / 2;
const toScreen = (x, y) => [OX + (x - rx0) * S, OY + (y - ry0) * S];
const PTS = DATA.map(p => toScreen(p[0], p[1]));
const VOID_C = toScreen(196, 202);                              // centre of the ring's void
const GAP_C  = toScreen(200, 48);                               // between the two small clusters

/* ==================== geometry helpers ==================== */
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
function convexHull(pts){
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const lo = [], up = [];
  for (const q of p){ while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--){ const q = p[i]; while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
const polyArea = poly => Math.abs(poly.reduce((s, p, k) => { const q = poly[(k+1) % poly.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
const pathOf = poly => "M" + poly.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
function pointInPoly(pt, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const a = poly[i], b = poly[j];
    if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < (b[0]-a[0]) * (pt[1]-a[1]) / (b[1]-a[1]) + a[0]) inside = !inside;

/* ==================== α-shape via Delaunay (Bowyer–Watson) ==================== */
function circum(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
  const a2 = a[0]*a[0]+a[1]*a[1], b2 = b[0]*b[0]+b[1]*b[1], c2 = c[0]*c[0]+c[1]*c[1];
  const ux = (a2*(b[1]-c[1]) + b2*(c[1]-a[1]) + c2*(a[1]-b[1])) / d;
  const uy = (a2*(c[0]-b[0]) + b2*(a[0]-c[0]) + c2*(b[0]-a[0])) / d;
  return {x:ux, y:uy, r:Math.hypot(a[0]-ux, a[1]-uy)};

function delaunay(pts){
  const BIG = 1e4, all = pts.concat([[-BIG, -BIG], [BIG*2, -BIG], [-BIG, BIG*2]]), n = pts.length;
  let tris = [{v:[n, n+1, n+2], c:circum(all[n], all[n+1], all[n+2])}];
  for (let i = 0; i < n; i++){
    const p = all[i], bad = [], keep = [];
    for (const t of tris) ((p[0]-t.c.x)**2 + (p[1]-t.c.y)**2 < t.c.r**2 ? bad : keep).push(t);
    const edges = new Map();
    for (const t of bad) for (let k = 0; k < 3; k++){
      const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;
      edges.set(key, edges.has(key) ? null : [a, b]);
    }
    tris = keep;
    for (const e of edges.values()) if (e) tris.push({v:[e[0], e[1], i], c:circum(all[e[0]], all[e[1]], p)});
  }
  return tris.filter(t => t.v.every(v => v < n));

// critical α: each species needs at least one triangle, so its own threshold is the smallest
// circumradius among its incident triangles; the critical α is the largest of those thresholds.
// The species that sets it (CRIT_I) is the hardest one to include — usually the most isolated.
function criticalAlpha(tris, n){
  const need = new Array(n).fill(Infinity);
  for (const t of tris) for (const v of t.v) need[v] = Math.min(need[v], t.c.r);
  let a = -Infinity, who = -1;
  need.forEach((r, i) => { if (r > a){ a = r; who = i; } });
  return {alpha: a, who};

  const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;

// nearest species: the level set nearest(x) = α. Trace it with marching squares and stitch the
// segments into closed loops — one around each group's outside, one inside the void.
const G = 2.5;

{
  const seen = new Set();
  for (const start of adj.keys()){
    if (seen.has(start)) continue;
    const loop = []; let prev = null, cur = start;
    while (cur && !seen.has(cur)){

      const nb = (adj.get(cur) || []).filter(k => k !== prev && !seen.has(k));

LOOPS.sort((a, b) => (a.isVoid - b.isVoid) || (a.len - b.len));

  for (let x = X0 - ALPHA; x <= X1 + ALPHA; x += 2)
    if (nearest(x, y) >= ALPHA) discAt(hctx, x, y);
// final α-shape layer
sctx.fillStyle = css("--paint"); sctx.strokeStyle = css("--paint"); sctx.lineWidth = .8;
for (const t of KEPT){
  const [a, b, c] = t.v.map(i => PTS[i]);
  sctx.beginPath(); sctx.moveTo(a[0], a[1]); sctx.lineTo(b[0], b[1]); sctx.lineTo(c[0], c[1]); sctx.closePath(); sctx.fill(); sctx.stroke();
}
sctx.strokeStyle = css("--edge"); sctx.lineWidth = 2.2; sctx.lineJoin = "round"; sctx.beginPath();
for (const [i, j] of BOUNDARY){ sctx.moveTo(PTS[i][0], PTS[i][1]); sctx.lineTo(PTS[j][0], PTS[j][1]); }
sctx.stroke();

/* ==================== overlay ==================== */
const NS = "http://www.w3.org/2000/svg";
const ov = document.getElementById("ov");
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
{
  const g = el("g", {}, ov);
  el("path", {d:`M${X0},${Y1-6}V${Y0}H${X1+6}`, class:"axis"}, g);
  el("path", {d:`M${X1+12},${Y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${X0},${Y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(X0+X1)/2, y:H-12, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${X0-18},${(Y0+Y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
el("path", {d:pathOf(HULL), class:"hull"}, ov);                 // convex hull outline, always shown
const labels = [];
// no on-plot text: labels and readouts are intentionally left off this page
{
  const g = el("g", {}, ov);
  PTS.forEach((p, i) => el("circle", {cx:p[0].toFixed(1), cy:p[1].toFixed(1),
    r:i === OUT_I ? 5 : 2.6, class:i === OUT_I ? "pt out" : "pt"}, g));
}
function setReadout(){}                                    // readouts removed
const eraser = el("g", {class:"eraser", opacity:0}, ov);
el("circle", {cx:0, cy:0, r:ALPHA, class:"disc"}, eraser);
el("line", {x1:0, y1:0, x2:ALPHA*Math.cos(-.7), y2:ALPHA*Math.sin(-.7)}, eraser);
el("text", {x:ALPHA*Math.cos(-.7)*.5 - 13, y:ALPHA*Math.sin(-.7)*.5 - 2}, eraser).textContent = "α";
const moveEraser = p => eraser.setAttribute("transform", `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
const showEraser = on => eraser.setAttribute("opacity", on ? 1 : 0);

/* ==================== timeline ==================== */
// A list of steps; each step's update(dt) returns true when it's finished. Paused = no updates.
const ROLL = .20;                        // eraser speed along a loop (px per ms, × speed)
function buildSteps(){
  const steps = [];
  const wait = ms => { let t = 0; return {update: dt => (t += dt) >= ms}; };
  const once = fn => ({update: () => { fn(); return true; }});
  steps.push(wait(500));
  for (const L of LOOPS){
    // place the disc at the start of the loop, then roll it all the way round
    steps.push(once(() => { moveEraser(L.pts[0]); showEraser(true); }));
    steps.push(wait(L.isVoid ? 650 : 350));
    let pos = 0;
    steps.push({update: dt => {
      const to = Math.min(L.pts.length - 1, Math.floor(pos + ROLL * dt / 1.5));
      for (let k = Math.floor(pos); k <= to; k++) discAt(pctx, L.pts[k][0], L.pts[k][1]);
      pos = to + 1; moveEraser(L.pts[Math.min(to, L.pts.length - 1)]);
      return pos >= L.pts.length;
    }});
    steps.push(wait(250));
    steps.push(once(() => showEraser(false)));
    steps.push(wait(300));
  }
  // everywhere else the disc fits → the curved α-hull
  steps.push(once(() => { paint.style.opacity = 0; hullc.style.opacity = 1; }));
  steps.push(wait(1300));
  // straighten the curved edges → the α-shape
  steps.push(once(() => { hullc.style.opacity = 0; shape.style.opacity = 1; labels.forEach(l => l.classList.add("on")); setReadout(true); }));
  steps.push(wait(900));
  return steps;
}

let steps = [], si = 0, playing = false, done = false, last = 0, raf = 0;
function frame(now){
  if (!playing) return;
  const dt = Math.min(64, now - last) * SPEED; last = now;
  while (si < steps.length && steps[si].update(dt)) si++;
  if (si >= steps.length){ playing = false; done = true; postStatus(); return; }
  raf = requestAnimationFrame(frame);
}
function resetAll(){
  playing = false; done = false; cancelAnimationFrame(raf);
  shadeHull(pctx);
  for (const c of [paint, hullc, shape]) c.style.transition = "none";
  paint.style.opacity = 1; hullc.style.opacity = 0; shape.style.opacity = 0;
  void paint.offsetWidth;
  for (const c of [paint, hullc, shape]) c.style.transition = "";
  showEraser(false); labels.forEach(l => l.classList.remove("on")); setReadout(false);
  steps = buildSteps(); si = 0;
  postStatus();
}
function setPlay(want){
  if (want){
    if (done) resetAll();
    if (!playing){ playing = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  } else if (playing){ playing = false; cancelAnimationFrame(raf); }
  postStatus();
}
function showFinal(){
  resetAll();
  paint.style.opacity = 0; shape.style.opacity = 1;
  labels.forEach(l => l.classList.add("on")); setReadout(true);
  done = true; postStatus();
}

/* ==================== controls.html link (own channel) ==================== */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "eraser-outlier") : null;
function postStatus(){ if (bc) bc.postMessage({cmd:"status", arg:{playing, placed: done ? 1 : 0, N:1}}); }
const ACTIONS = { setPlay, reset: resetAll, all: showFinal, ping: postStatus };
if (bc) bc.onmessage = e => { const f = e.data && ACTIONS[e.data.cmd]; if (f) f(e.data.arg); };

/* ==================== init ==================== */
resetAll();
if (P.get("autoplay") === "1") setTimeout(() => setPlay(true), 600);
})();
</script>
