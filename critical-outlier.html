<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distal Point Toggle</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a;
  --paint:#f6caa9; --edge:#de8550; --pt:#1f2328; --hull:#9aa3ad; --track:#d0d4d9;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c;
  --paint:#7a4e33; --edge:#f0a46f; --pt:#e6e8eb; --hull:#5b636d; --track:#3a4048;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}

/* switch: "Normal" ⟷ "With one distal point" */
.switch{display:flex;align-items:center;gap:12px;font-size:var(--tfs,17px);font-weight:700;user-select:none}
.switch .opt{color:var(--muted);cursor:pointer;transition:color .3s}
.switch .opt.on{color:var(--fg)}
.switch .opt.distal.on{color:var(--edge)}
.track{position:relative;width:52px;height:28px;border-radius:14px;background:var(--track);
  border:none;padding:0;cursor:pointer;transition:background .3s}
.track[aria-checked="true"]{background:var(--edge)}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s}
.track[aria-checked="true"] .knob{transform:translateX(24px)}
.track:focus-visible{outline:2px solid var(--edge);outline-offset:3px}

/* every plot layer shares one box with the plot's aspect ratio */
.stage{position:relative;width:100%;flex:1 1 auto;min-height:0;max-height:100%;aspect-ratio:600/440}
.stage > *{position:absolute;inset:0;width:100%;height:100%}
canvas{transition:opacity .7s ease}
svg{overflow:visible;user-select:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.hull{fill:none;stroke:var(--hull);stroke-width:1.5;stroke-dasharray:6 5;transition:opacity .7s}
.pt{fill:var(--pt)}
.distal{transition:opacity .7s}
.distal circle{fill:var(--edge);stroke:var(--pt);stroke-width:1.2}
.distal text{fill:var(--edge);font-size:var(--lfs,17px);font-weight:800}
</style>
</head>
<body>
<div class="switch">
  <span class="opt normal" id="optN">Normal</span>
  <button class="track" id="sw" role="switch" aria-checked="false" aria-label="Show the community with one distal point"><span class="knob"></span></button>
  <span class="opt distal" id="optD">With one distal point</span>
</div>
<div class="stage">
  <canvas id="cN"></canvas>   <!-- α-shape of the normal community -->
  <canvas id="cD"></canvas>   <!-- α-shape with the distal point added -->
  <svg id="ov" viewBox="0 0 600 440" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script>
(function(){
"use strict";
/* ============================================================
   Distal point vs. critical α — one switch, two states, same frame.

   Both states use the critical α: the smallest α at which EVERY species is a vertex of
   at least one Delaunay triangle with circumradius ≤ α (no species is dropped).
     Normal               → the original species only
     With one distal point → the same species + one distal species; that species alone
                            sets the critical α, so the groups merge and the void fills

   Options
     distal=330,330  raw trait coords of the distal species
     state=distal    open on the right-hand state
     theme=dark|auto, bg=transparent
     afs / lfs / tfs axis-label / "distal point" label / switch font size (px)

   Inspect from the console: window.distalToggle.state.normal / .distal
     (alpha in trait units, the species that set it, kept triangles, hull, area share)
   ============================================================ */
const P = new URLSearchParams(location.search);
const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "lfs", "tfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");
const css = n => getComputedStyle(root).getPropertyValue(n).trim();

/* ==================== layout ==================== */
const W = 600, H = 440, M = {l:50, r:16, t:16, b:50};
const X0 = M.l, X1 = W - M.r, Y0 = H - M.b, Y1 = M.t;

/* ==================== data (same species as eraser.html) ==================== */
const RAW = [

[172.63,144.61],[277.16,190.36],[238.21,226.3],[213.39,136.97],[195.7,268.7],[200.84,246.26],
[217.3,147.17],[157.17,175.06],[170.29,260.23],[258.02,225.77],[144.96,245.92],[179.49,137.31],
[276.39,201.37],[162.87,197.27],[227.38,148.46],[174.94,170.02],[146.84,232.23],[187.34,264.58],
[173.56,152.28],[125.12,193.52],[123.25,194.99],[199.84,277.3],[151.84,238.19],[143.56,191.47],

[171.76,167.59],[227.13,175.04],[163.01,222.39],[147.03,156.78],[185.92,141.56],[245.92,135.66],

[169.27,257.76],[215.86,248.45],[149.1,162.03],[243.32,221.66],[187.21,238.45],[121.17,216.42],
[259.78,234.84],[186.67,132.61],[225.19,240.09],[243.68,188.18],[244.54,238.89],[140.01,152.97],
[175.38,160.96],[148.49,253.16],[210.41,127.96],[129.45,193.68],[167.79,153.16],[142.73,196.92],

[267.46,175.27],[189.79,122.23],[186.76,261.25],[146.52,151.06],[169.05,152.06],[175.8,238.33],
[239.34,181.45],[156.4,182.79],[162.8,164.64],[243.69,218.56],[170.18,148.96],[238.82,243.21],
[141.19,231.95],[191.3,132.04],[207.72,131.19],[169.65,163.17],[254.48,232.32],[225.45,157.46],
[247.84,219.87],[224.51,132.86],[159.95,164.62],[131.75,209.83],[151.69,146.88],[249.3,180.51],
[166.74,253.02],[222.52,255.3],[131.14,237.95],[128.67,196.96],[127.36,186.45],[158.24,233.04],
[264.54,217.12],[170.19,225.11],[269.45,221.28],[237.49,274.14],[207.27,273.29],[272.03,173.2]
];
const parseXY = v => { if (!v) return null; const a = v.split(",").map(Number); return a.length === 2 && a.every(isFinite) ? a : null; };
const DISTAL = parseXY(P.get("distal")) || [330, 330];

// one frame for both states (it includes the distal point) so nothing moves when you switch
const PAD = 26, FRAME = RAW.concat([DISTAL]);
const rx0 = Math.min(...FRAME.map(p => p[0])) - PAD, rx1 = Math.max(...FRAME.map(p => p[0])) + PAD;
const ry0 = Math.min(...FRAME.map(p => p[1])) - PAD, ry1 = Math.max(...FRAME.map(p => p[1])) + PAD;
const S = Math.min((X1 - X0) / (rx1 - rx0), (Y0 - Y1) / (ry1 - ry0));
const OX = X0 + ((X1 - X0) - (rx1 - rx0) * S) / 2, OY = Y1 + ((Y0 - Y1) - (ry1 - ry0) * S) / 2;
const toScreen = (x, y) => [OX + (x - rx0) * S, OY + (y - ry0) * S];

/* ==================== geometry helpers ==================== */
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
function convexHull(pts){
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const lo = [], up = [];
  for (const q of p){ while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--){ const q = p[i]; while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
const polyArea = poly => Math.abs(poly.reduce((s, p, k) => { const q = poly[(k+1) % poly.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
const pathOf = poly => "M" + poly.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
function circum(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
  const a2 = a[0]*a[0]+a[1]*a[1], b2 = b[0]*b[0]+b[1]*b[1], c2 = c[0]*c[0]+c[1]*c[1];
  const ux = (a2*(b[1]-c[1]) + b2*(c[1]-a[1]) + c2*(a[1]-b[1])) / d;
  const uy = (a2*(c[0]-b[0]) + b2*(a[0]-c[0]) + c2*(b[0]-a[0])) / d;
  return {x:ux, y:uy, r:Math.hypot(a[0]-ux, a[1]-uy)};
}
function delaunay(pts){                                         // Bowyer–Watson
  const BIG = 1e4, all = pts.concat([[-BIG, -BIG], [BIG*2, -BIG], [-BIG, BIG*2]]), n = pts.length;
  let tris = [{v:[n, n+1, n+2], c:circum(all[n], all[n+1], all[n+2])}];
  for (let i = 0; i < n; i++){
    const p = all[i], bad = [], keep = [];
    for (const t of tris) ((p[0]-t.c.x)**2 + (p[1]-t.c.y)**2 < t.c.r**2 ? bad : keep).push(t);
    const edges = new Map();
    for (const t of bad) for (let k = 0; k < 3; k++){
      const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;
      edges.set(key, edges.has(key) ? null : [a, b]);
    }
    tris = keep;
    for (const e of edges.values()) if (e) tris.push({v:[e[0], e[1], i], c:circum(all[e[0]], all[e[1]], p)});
  }
  return tris.filter(t => t.v.every(v => v < n));
}
// critical α: each species' own threshold is its smallest incident circumradius; take the largest
function criticalAlpha(tris, n){
  const need = new Array(n).fill(Infinity);
  for (const t of tris) for (const v of t.v) need[v] = Math.min(need[v], t.c.r);
  let a = -Infinity, who = -1;
  need.forEach((r, i) => { if (r > a){ a = r; who = i; } });
  return {alpha: a, who};
}

/* ==================== one state = one community analysed end to end ==================== */
function analyse(raw){
  const pts = raw.map(p => toScreen(p[0], p[1]));
  const tris = delaunay(pts);
  const crit = criticalAlpha(tris, pts.length);
  const alpha = crit.alpha * 1.0001;
  const kept = tris.filter(t => t.c.r <= alpha);
  const count = new Map();
  for (const t of kept) for (let k = 0; k < 3; k++){
    const a = t.v[k], b = t.v[(k+1)%3], key = a < b ? a+","+b : b+","+a;
    count.set(key, (count.get(key) || 0) + 1);
  }
  const boundary = [...count].filter(([, c]) => c === 1).map(([k]) => k.split(",").map(Number));
  const hull = convexHull(pts);
  const area = kept.reduce((s, t) => s + polyArea(t.v.map(i => pts[i])), 0);
  return {pts, kept, boundary, hull, alphaTrait: alpha / S, setBy: raw[crit.who],
          shareOfHull: area / polyArea(hull)};
}
const state = {normal: analyse(RAW), distal: analyse(RAW.concat([DISTAL]))};

/* ==================== draw each state's α-shape on its own canvas ==================== */
const SCALE = Math.min(3, (window.devicePixelRatio || 1) * 2);
function drawShape(canvas, s){
  canvas.width = W*SCALE; canvas.height = H*SCALE;
  const ctx = canvas.getContext("2d"); ctx.scale(SCALE, SCALE);
  ctx.fillStyle = css("--paint"); ctx.strokeStyle = css("--paint"); ctx.lineWidth = .8;
  for (const t of s.kept){
    const [a, b, c] = t.v.map(i => s.pts[i]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = css("--edge"); ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.beginPath();
  for (const [i, j] of s.boundary){ ctx.moveTo(s.pts[i][0], s.pts[i][1]); ctx.lineTo(s.pts[j][0], s.pts[j][1]); }
  ctx.stroke();
}
const cN = document.getElementById("cN"), cD = document.getElementById("cD");
drawShape(cN, state.normal); drawShape(cD, state.distal);

/* ==================== overlay: axes, hulls, species, distal point ==================== */
const NS = "http://www.w3.org/2000/svg", ov = document.getElementById("ov");
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
{
  const g = el("g", {}, ov);
  el("path", {d:`M${X0},${Y1-6}V${Y0}H${X1+6}`, class:"axis"}, g);
  el("path", {d:`M${X1+12},${Y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${X0},${Y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(X0+X1)/2, y:H-12, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${X0-18},${(Y0+Y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
const hullN = el("path", {d:pathOf(state.normal.hull), class:"hull"}, ov);
const hullD = el("path", {d:pathOf(state.distal.hull), class:"hull"}, ov);
{
  const g = el("g", {}, ov);
  state.normal.pts.forEach(p => el("circle", {cx:p[0].toFixed(1), cy:p[1].toFixed(1), r:2.6, class:"pt"}, g));
}
const dp = toScreen(DISTAL[0], DISTAL[1]);
const distalG = el("g", {class:"distal"}, ov);
el("circle", {cx:dp[0].toFixed(1), cy:dp[1].toFixed(1), r:5.5}, distalG);
// label sits on whichever side of the point has more room
const leftRoom = dp[0] - X0 > X1 - dp[0];
el("text", {x:(dp[0] + (leftRoom ? -12 : 12)).toFixed(1), y:(dp[1] + 5).toFixed(1),
  "text-anchor": leftRoom ? "end" : "start"}, distalG).textContent = "distal point";

/* ==================== switch ==================== */
const sw = document.getElementById("sw"), optN = document.getElementById("optN"), optD = document.getElementById("optD");
let showDistal = false;
function set(d){
  showDistal = !!d;
  sw.setAttribute("aria-checked", showDistal);
  optN.classList.toggle("on", !showDistal); optD.classList.toggle("on", showDistal);
  cN.style.opacity = showDistal ? 0 : 1;     cD.style.opacity = showDistal ? 1 : 0;
  hullN.style.opacity = showDistal ? 0 : 1;  hullD.style.opacity = showDistal ? 1 : 0;
  distalG.style.opacity = showDistal ? 1 : 0;
}
sw.addEventListener("click", () => set(!showDistal));
optN.addEventListener("click", () => set(false));
optD.addEventListener("click", () => set(true));
set(P.get("state") === "distal");

window.distalToggle = {state, set, get showDistal(){ return showDistal; }};
})();
</script>
</body>
</html>
