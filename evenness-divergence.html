<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evenness and Divergence</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed;
  --pt:#1f2328; --sub:#4b5563; --hull:#2563eb; --hull-fill:rgba(37,99,235,.10); --ghost:#9aa3ad;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31;
  --pt:#e6e8eb; --sub:#b4bcc5; --hull:#60a5fa; --hull-fill:rgba(96,165,250,.14); --ghost:#5b636d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;padding:12px 16px;gap:28px}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.panel.hidden{display:none}
h2{margin:0;font-size:var(--tfs,32px);font-weight:800;letter-spacing:-.01em}
.sub{margin:4px 0 6px;font-size:var(--sfs,21px);line-height:1.25;color:var(--sub);font-weight:800;text-align:center;
  min-height:1.25em}
svg{flex:1;min-height:0;width:100%;display:block;user-select:none}

.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.pt{fill:var(--pt);stroke:var(--bg);stroke-width:1.5}
.shape{fill:var(--hull-fill);fill-rule:evenodd;stroke:var(--hull);stroke-width:2.5;stroke-linejoin:round}
.guide{stroke:var(--ghost);stroke-width:1.2;fill:none}
.centre{stroke:var(--hull);stroke-width:2.5}
.state{fill:var(--hull);font-size:var(--rfs,15px);font-weight:800;letter-spacing:.04em}
.readout{fill:var(--muted);font-size:var(--rfs,15px);font-weight:700;font-variant-numeric:tabular-nums}
.readout tspan.val{fill:var(--hull)}
</style>
</head>
<body>
  <section class="panel" id="pEve">
    <h2>Evenness</h2>
    <div class="sub">How regularly species are spaced</div>
    <svg id="svgEve" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Evenness: same alpha shape, species go from clumped to evenly spaced"></svg>
  </section>
  <section class="panel" id="pDiv">
    <h2>Divergence</h2>
    <div class="sub">How far species sit from the centre</div>
    <svg id="svgDiv" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Divergence: same alpha shape, species go from the centre to the edge"></svg>
  </section>

<script>
(function(){
"use strict";
/* ============================================================
   Companion to magnitude-variation.html (same point pattern, same look).

   Occupied space is an alpha shape, and it is the SAME shape at every moment:
     1. the species are first spread evenly (Lloyd relaxation inside the convex hull of the
        original pattern; convex-hull species stay put);
     2. the alpha shape of that layout is computed once (Delaunay triangles with circumradius <= alpha);
     3. species on the alpha shape's boundary are fixed; every other species moves, but only inside
        that shape. The drawn shape never changes, so FRic is constant; only how species fill it changes.
   Each panel loops between a LOW and a HIGH configuration:
     Evenness:   clumped into two tight groups  <->  evenly spaced (the layout from step 1)
     Divergence: packed around the centre       <->  pushed out to the shape's edge
   Readouts are computed live from the drawn points (equal abundances):
     FEve — Villéger et al. 2008, regularity of minimum-spanning-tree branch lengths
     FDiv — Villéger et al. 2008, distances to the centroid of the convex-hull vertices

   Options
     panel=evenness | divergence | both (default both)
     channel=...   shared with controls.html (default "evendiv")
     autoplay=0    start paused (drive it from controls.html instead); plays by default
     n, seed, shape, gap — same meaning as in magnitude-variation.html
     alpha=...     alpha radius in px (default: 1.5 x median nearest-neighbour distance of the even layout)
     speed         animation speed multiplier
     area=0        hide the FEve / FDiv readout
     state=0       hide the LOW / HIGH label
     guides=1      draw the minimum spanning tree (Evenness) and centre + spokes (Divergence)
     afs / tfs / sfs / rfs   axis-label / title / subtitle / readout font size (px)
     theme, bg=transparent
   ============================================================ */
const P = new URLSearchParams(location.search);
const N = Math.max(3, Math.min(100, parseInt(P.get("n")) || 20));
const SEED = parseInt(P.get("seed")) || 7;
const SHAPE = P.get("shape") || "round";
const MIN_GAP = parseFloat(P.get("gap")) || 30;
const SPEED = Math.max(.25, Math.min(4, parseFloat(P.get("speed")) || 1));
const SHOW_VAL = P.get("area") !== "0";
const SHOW_STATE = P.get("state") !== "0";
const GUIDES = P.get("guides") === "1";

const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "tfs", "rfs", "sfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");
const PANEL = (P.get("panel") || "both").toLowerCase();
if (PANEL.startsWith("eve")) document.getElementById("pDiv").classList.add("hidden");
if (PANEL.startsWith("div")) document.getElementById("pEve").classList.add("hidden");

/* ==================== geometry (identical to magnitude-variation.html) ==================== */
const W = 480, H = 400, M = {l:44, r:20, t:20, b:44};
const x0 = M.l, x1 = W - M.r, y0 = H - M.b, y1 = M.t;

function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(SEED);
const gauss = () => { const u = 1 - rnd(), v = rnd(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); };
function samplePoint(){
  let u, v;
  if (SHAPE === "square"){ u = .2 + .6*rnd(); v = .2 + .6*rnd(); }
  else if (SHAPE === "gauss"){ u = .5 + .14*gauss(); v = .5 + .14*gauss(); }
  else { const r = .34*Math.sqrt(rnd()), th = 2*Math.PI*rnd(); u = .5 + r*Math.cos(th); v = .5 + r*Math.sin(th); }
  return {u: Math.min(.95, Math.max(.05, u)), v: Math.min(.95, Math.max(.05, v))};
}
const PTS = [];
{
  let gap = MIN_GAP, tries = 0;
  while (PTS.length < N){
    const c = samplePoint();
    const ok = PTS.every(p => Math.hypot((p.u - c.u)*(x1 - x0), (p.v - c.v)*(y0 - y1)) >= gap);
    if (ok){ PTS.push(c); tries = 0; }
    else if (++tries > 2000){ gap *= .95; tries = 0; }
  }
}
const BASE = PTS.map(p => [x0 + p.u*(x1 - x0), y0 - p.v*(y0 - y1)]);

/* ==================== geometry helpers ==================== */
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
const lerp = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
const centroid = pts => pts.reduce((c, p) => [c[0] + p[0]/pts.length, c[1] + p[1]/pts.length], [0, 0]);
const f1 = v => v.toFixed(1);
function hullIdx(pts){
  const idx = pts.map((_, i) => i).sort((a, b) => pts[a][0] - pts[b][0] || pts[a][1] - pts[b][1]);
  const lower = [], upper = [];
  for (const i of idx){ while (lower.length >= 2 && cross(pts[lower[lower.length-2]], pts[lower[lower.length-1]], pts[i]) <= 0) lower.pop(); lower.push(i); }
  for (let k = idx.length - 1; k >= 0; k--){ const i = idx[k]; while (upper.length >= 2 && cross(pts[upper[upper.length-2]], pts[upper[upper.length-1]], pts[i]) <= 0) upper.pop(); upper.push(i); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
function segDist(p, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy;
  const t = L2 ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2)) : 0;
  return Math.hypot(p[0] - a[0] - t*dx, p[1] - a[1] - t*dy);
}
function inTri(p, a, b, c){
  const d1 = cross(a, b, p), d2 = cross(b, c, p), d3 = cross(c, a, p);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}
// sunflower (phyllotaxis) disk of n points with roughly `gap` px between neighbours
function sunflower(c, n, gap){
  const golden = Math.PI*(3 - Math.sqrt(5)), out = [];
  for (let k = 0; k < n; k++){
    const r = gap * .56 * Math.sqrt(k + .5), th = k*golden;
    out.push([c[0] + r*Math.cos(th), c[1] + r*Math.sin(th)]);
  }
  return out;
}
// give each mover the slot whose angle (around c) has the same rank, so paths don't cross much
function matchByAngle(movers, slots, c){
  const ang = p => Math.atan2(p[1]-c[1], p[0]-c[0]);
  const mi = movers.map((_, k) => k).sort((a, b) => ang(movers[a]) - ang(movers[b]));
  const si = slots.map((_, k) => k).sort((a, b) => ang(slots[a]) - ang(slots[b]));
  const out = new Array(movers.length);
  mi.forEach((m, r) => { out[m] = slots[si[r]]; });
  return out;
}

/* ==================== Delaunay + alpha shape ==================== */
// Bowyer-Watson triangulation; triangles as index triples
function delaunay(pts){
  const n = pts.length, big = 1e5;
  const V = pts.concat([[-big, -big], [big, -big], [0, big]]);
  let tris = [[n, n+1, n+2]];
  const circ = t => {
    const [a, b, c] = t.map(i => V[i]);
    const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
    const ux = ((a[0]**2 + a[1]**2)*(b[1]-c[1]) + (b[0]**2 + b[1]**2)*(c[1]-a[1]) + (c[0]**2 + c[1]**2)*(a[1]-b[1])) / d;
    const uy = ((a[0]**2 + a[1]**2)*(c[0]-b[0]) + (b[0]**2 + b[1]**2)*(a[0]-c[0]) + (c[0]**2 + c[1]**2)*(b[0]-a[0])) / d;
    return [ux, uy, (ux-a[0])**2 + (uy-a[1])**2];
  };
  for (let i = 0; i < n; i++){
    const p = V[i], bad = [], keep = [];
    for (const t of tris){ const c = circ(t); ((p[0]-c[0])**2 + (p[1]-c[1])**2 < c[2] ? bad : keep).push(t); }
    const cnt = new Map();
    for (const t of bad) for (const [a, b] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){
      const k = a < b ? a+","+b : b+","+a; cnt.set(k, (cnt.get(k) || 0) + 1);
    }
    tris = keep;
    cnt.forEach((c, k) => { if (c === 1){ const [a, b] = k.split(",").map(Number); tris.push([a, b, i]); } });
  }
  return tris.filter(t => t.every(i => i < n));
}
function circumR(a, b, c){
  const area2 = Math.abs(cross(a, b, c));
  return area2 > 1e-9 ? dist(b, c)*dist(a, c)*dist(a, b) / (2*area2) : Infinity;
}
// kept triangles + boundary edges (edges used by exactly one kept triangle)
function alphaShape(pts, R){
  const tris = delaunay(pts).filter(t => circumR(pts[t[0]], pts[t[1]], pts[t[2]]) <= R);
  const cnt = new Map();
  for (const t of tris) for (const [a, b] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){
    const k = a < b ? a+","+b : b+","+a; cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  const edges = []; cnt.forEach((c, k) => { if (c === 1) edges.push(k.split(",").map(Number)); });
  return {tris, edges};
}
// chain boundary edges into closed loops (one path; evenodd fill handles any holes)
function loopsPath(pts, edges){
  const adj = new Map(), used = new Set(), key = (a, b) => a < b ? a+","+b : b+","+a;
  for (const [a, b] of edges){ (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); }
  let d = "";
  for (const [a0, b0] of edges){
    if (used.has(key(a0, b0))) continue;
    used.add(key(a0, b0));
    const loop = [a0, b0];
    let prev = a0, cur = b0;
    while (cur !== a0){
      const next = (adj.get(cur) || []).find(v => v !== prev && !used.has(key(cur, v)));
      if (next === undefined) break;
      used.add(key(cur, next)); loop.push(next); prev = cur; cur = next;
    }
    d += "M" + loop.map(i => f1(pts[i][0]) + "," + f1(pts[i][1])).join("L") + "Z";
  }
  return d;
}

/* ==================== step 1: even layout inside the convex hull ==================== */
const HULL0 = hullIdx(BASE);
const HULL0_POLY = HULL0.map(i => BASE[i]);
const isHull = new Set(HULL0);
const G = centroid(HULL0_POLY);                                   // centre used by FDiv
const ORIENT = Math.sign(HULL0_POLY.reduce((acc, p, k) => { const q = HULL0_POLY[(k+1) % HULL0_POLY.length]; return acc + (p[0]*q[1] - q[0]*p[1]); }, 0));
const insideHull = p => HULL0_POLY.every((a, k) => ORIENT * cross(a, HULL0_POLY[(k+1) % HULL0_POLY.length], p) >= 0);

const EVEN = (() => {
  const sites = BASE.map(p => p.slice()), step = 4, samples = [];
  for (let x = x0; x <= x1; x += step) for (let y = y1; y <= y0; y += step) if (insideHull([x, y])) samples.push([x, y]);
  for (let it = 0; it < 80; it++){
    const sx = new Float64Array(sites.length), sy = new Float64Array(sites.length), sn = new Float64Array(sites.length);
    for (const s of samples){
      let best = 0, bd = Infinity;
      for (let j = 0; j < sites.length; j++){ const d = (s[0]-sites[j][0])**2 + (s[1]-sites[j][1])**2; if (d < bd){ bd = d; best = j; } }
      sx[best] += s[0]; sy[best] += s[1]; sn[best]++;
    }
    sites.forEach((_, i) => { if (!isHull.has(i) && sn[i]) sites[i] = [sx[i]/sn[i], sy[i]/sn[i]]; });
  }
  return sites;
})();

/* ==================== step 2: the one alpha shape ==================== */
const ALPHA = (() => {
  const a = parseFloat(P.get("alpha"));
  if (a > 0) return a;
  const nn = EVEN.map((p, i) => Math.min(...EVEN.map((q, j) => i === j ? Infinity : dist(p, q)))).sort((x, y) => x - y);
  return 1.5 * nn[Math.floor(nn.length/2)];
})();
const A = alphaShape(EVEN, ALPHA);
const A_TRIS = A.tris.map(t => t.map(i => EVEN[i]));
const A_EDGES = A.edges.map(([a, b]) => [EVEN[a], EVEN[b]]);
const A_PATH = loopsPath(EVEN, A.edges);

// species that stay put: on the shape's boundary, or not in any kept triangle
const inSomeTri = new Set([].concat(...A.tris));
const FIXED = new Set([].concat(...A.edges));
EVEN.forEach((_, i) => { if (!inSomeTri.has(i)) FIXED.add(i); });
const MOVERS = EVEN.map((_, i) => i).filter(i => !FIXED.has(i));

// how far p sits inside the alpha shape (negative = outside)
function insideA(p){
  if (!A_TRIS.some(([a, b, c]) => inTri(p, a, b, c))) return -1;
  return Math.min(...A_EDGES.map(([a, b]) => segDist(p, a, b)));
}
// centre for placing species: G if it is well inside the shape, otherwise the shape's area centroid
const C = (() => {
  if (insideA(G) >= 20) return G;
  let sx = 0, sy = 0, s = 0;
  for (const [a, b, c] of A_TRIS){ const w = Math.abs(cross(a, b, c)); sx += w*(a[0]+b[0]+c[0])/3; sy += w*(a[1]+b[1]+c[1])/3; s += w; }
  return [sx/s, sy/s];
})();
// pull each slot toward `c` until it is at least `margin` px inside the shape
const keepIn = (slots, c, margin) => slots.map(p => {
  for (let t = 0; t <= 1; t += .02){ const q = lerp(p, c, t); if (insideA(q) >= margin) return q; }
  return c;
});

/* ==================== step 3: configurations (only MOVERS change) ==================== */
const evenPos = MOVERS.map(i => EVEN[i]);

// LOW evenness: two tight groups on either side of the centre, along the shape's longest direction
const CLUMP = (() => {
  const bnd = [...FIXED].map(i => EVEN[i]);
  let a = bnd[0], b = bnd[1], best = 0;
  for (const p of bnd) for (const q of bnd){ const d = dist(p, q); if (d > best){ best = d; a = p; b = q; } }
  const cA = keepIn([lerp(C, a, .45)], C, 22)[0], cB = keepIn([lerp(C, b, .45)], C, 22)[0];
  const inA = evenPos.map(p => dist(p, cA) <= dist(p, cB));
  const movA = evenPos.filter((_, k) => inA[k]), movB = evenPos.filter((_, k) => !inA[k]);
  const resA = matchByAngle(movA, keepIn(sunflower(cA, movA.length, 13), cA, 7), cA);
  const resB = matchByAngle(movB, keepIn(sunflower(cB, movB.length, 13), cB, 7), cB);
  let ia = 0, ib = 0;
  return evenPos.map((_, k) => inA[k] ? resA[ia++] : resB[ib++]);
})();

// LOW divergence: packed around the centre
const CENTRE = matchByAngle(evenPos, keepIn(sunflower(C, evenPos.length, 15), C, 7), C);

// HIGH divergence: each species walks out from the centre along its own direction to just inside the edge
const EDGE = evenPos.map(p => {
  const dx = p[0] - C[0], dy = p[1] - C[1], L = Math.hypot(dx, dy) || 1, u = [dx/L, dy/L];
  let good = C;
  for (let s = 0; s < 600; s += 1){
    const q = [C[0] + u[0]*s, C[1] + u[1]*s];
    if (insideA(q) >= 14) good = q; else if (insideA(q) < 0) break;
  }
  return good;
});

function withMovers(posList){ const pts = EVEN.map(p => p.slice()); MOVERS.forEach((i, k) => { pts[i] = posList[k]; }); return pts; }
const EVE_KEYS = [withMovers(CLUMP), withMovers(evenPos), withMovers(CLUMP)];
const DIV_KEYS = [withMovers(CENTRE), withMovers(EDGE), withMovers(CENTRE)];

/* ==================== indices (equal abundances) ==================== */
function mstEdges(pts){
  const n = pts.length, inTree = new Array(n).fill(false), d = new Array(n).fill(Infinity), par = new Array(n).fill(-1), edges = [];
  d[0] = 0;
  for (let it = 0; it < n; it++){
    let u = -1;
    for (let v = 0; v < n; v++) if (!inTree[v] && (u < 0 || d[v] < d[u])) u = v;
    inTree[u] = true;
    if (par[u] >= 0) edges.push([par[u], u, d[u]]);
    for (let v = 0; v < n; v++) if (!inTree[v]){ const w = dist(pts[u], pts[v]); if (w < d[v]){ d[v] = w; par[v] = u; } }
  }
  return edges;
}
function fEve(pts){
  const S = pts.length, e = mstEdges(pts), tot = e.reduce((s, x) => s + x[2], 0), k = 1/(S - 1);
  return (e.reduce((s, x) => s + Math.min(x[2]/tot, k), 0) - k) / (1 - k);
}
function fDiv(pts){
  const d = pts.map(p => dist(p, G)), m = d.reduce((s, x) => s + x, 0) / d.length;
  const absDev = d.reduce((s, x) => s + Math.abs(x - m), 0) / d.length;
  return m / (absDev + m);                         // Δd = 0 with equal abundances
}

/* ==================== drawing ==================== */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawAxes(svg){
  const g = el("g", {}, svg);
  el("path", {d:`M${x0},${y1-6}V${y0}H${x1+6}`, class:"axis"}, g);
  el("path", {d:`M${x1+12},${y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${x0},${y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(x0+x1)/2, y:H-10, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${x0-16},${(y0+y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
function makePanel(svgId, kind){
  const svg = document.getElementById(svgId);
  drawAxes(svg);
  el("path", {d:A_PATH, class:"shape"}, svg);                     // the alpha shape: drawn once, never changes
  const guide = el("path", {class:"guide"}, svg);
  if (GUIDES && kind === "div"){
    const s = 7;
    el("path", {d:`M${G[0]-s},${G[1]-s}L${G[0]+s},${G[1]+s}M${G[0]-s},${G[1]+s}L${G[0]+s},${G[1]-s}`, class:"centre"}, svg);
  }
  const gPts = el("g", {}, svg);
  const dots = EVEN.map(() => el("circle", {r:5, class:"pt"}, gPts));
  let state = null, val = null;
  if (SHOW_STATE) state = el("text", {x:x1, y:y1 + 4, "text-anchor":"end", "dominant-baseline":"hanging", class:"state"}, svg);
  if (SHOW_VAL){
    const readout = el("text", {x:x1, y:y1 + 4 + (SHOW_STATE ? 20 : 0), "text-anchor":"end", "dominant-baseline":"hanging", class:"readout"}, svg);
    readout.appendChild(document.createTextNode(kind === "eve" ? "FEve " : "FDiv "));
    val = el("tspan", {class:"val"}, readout);
  }
  const word = kind === "eve" ? "EVENNESS" : "DIVERGENCE";
  return {
    render(pts, high){
      dots.forEach((d, i) => { d.setAttribute("cx", f1(pts[i][0])); d.setAttribute("cy", f1(pts[i][1])); });
      if (GUIDES){
        guide.setAttribute("d", kind === "eve"
          ? mstEdges(pts).map(([a, b]) => `M${f1(pts[a][0])},${f1(pts[a][1])}L${f1(pts[b][0])},${f1(pts[b][1])}`).join("")
          : pts.map(p => `M${f1(G[0])},${f1(G[1])}L${f1(p[0])},${f1(p[1])}`).join(""));
      }
      if (state) state.textContent = (high ? "HIGH " : "LOW ") + word;
      if (val) val.textContent = (kind === "eve" ? fEve(pts) : fDiv(pts)).toFixed(2);
    }
  };
}
const evePanel = makePanel("svgEve", "eve");
const divPanel = makePanel("svgDiv", "div");

/* ==================== timeline ==================== */
// low (hold) -> high (hold) -> low ... ; loops while playing
const MOVE = 1600, HOLD = 1600, STEP = MOVE + HOLD, NSTEP = 2, CYCLE = NSTEP * STEP;
const ease = k => k < .5 ? 2*k*k : 1 - (-2*k + 2)**2 / 2;
function poseAt(keys, t){
  const tc = ((t % CYCLE) + CYCLE) % CYCLE;
  const s = Math.floor(tc / STEP), within = tc - s*STEP;
  const k = ease(Math.min(1, within / MOVE));
  const a = keys[s], b = keys[s+1];
  const high = s === 0 ? k >= .5 : k < .5;
  return {pts: a.map((p, i) => lerp(p, b[i], k)), high};
}

let t = 0, playing = false, last = 0;
function frame(now){
  if (!playing) return;
  t += (now - last) * SPEED; last = now;
  draw();
  requestAnimationFrame(frame);
}
function draw(){
  const e = poseAt(EVE_KEYS, t), d = poseAt(DIV_KEYS, t);
  evePanel.render(e.pts, e.high);
  divPanel.render(d.pts, d.high);
}
function setPlay(want){
  if (want && !playing){ playing = true; last = performance.now(); requestAnimationFrame(frame); }
  else if (!want && playing){ playing = false; }
  postStatus();
}
function reset(){ playing = false; t = 0; draw(); postStatus(); }

/* ==================== controls.html link ==================== */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "evendiv") : null;
function postStatus(){ if (bc) bc.postMessage({cmd:"status", arg:{playing, placed:0, N:1}}); }
const ACTIONS = { setPlay, reset, ping: postStatus };
if (bc) bc.onmessage = e => { const f = e.data && ACTIONS[e.data.cmd]; if (f) f(e.data.arg); };

/* ==================== init ==================== */
draw(); postStatus();
if (P.get("autoplay") !== "0") setPlay(true);
window.evenDiv = {EVEN, ALPHA, MOVERS, FIXED, EVE_KEYS, DIV_KEYS, fEve, fDiv, alphaShape, insideA, G, draw, setPlay};
})();
</script>
