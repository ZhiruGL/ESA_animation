<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evenness and Divergence</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed;
  --pt:#1f2328; --sub:#4b5563; --hull:#2563eb; --hull-fill:rgba(37,99,235,.10); --ghost:#9aa3ad;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31;
  --pt:#e6e8eb; --sub:#b4bcc5; --hull:#60a5fa; --hull-fill:rgba(96,165,250,.14); --ghost:#5b636d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;padding:12px 16px;gap:28px}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.panel.hidden{display:none}
h2{margin:0;font-size:var(--tfs,32px);font-weight:800;letter-spacing:-.01em}
.sub{margin:4px 0 6px;font-size:var(--sfs,21px);line-height:1.25;color:var(--sub);font-weight:800;text-align:center;min-height:1.25em}
svg{flex:1;min-height:0;width:100%;display:block;user-select:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.pt{fill:var(--pt);stroke:var(--bg);stroke-width:1.5}
.shape{fill:var(--hull-fill);fill-rule:evenodd;stroke:var(--hull);stroke-width:2.5;stroke-linejoin:round}
.guide{stroke:var(--ghost);stroke-width:1.2;fill:none}
.lowghost{fill:none;stroke:var(--ghost);stroke-width:1.8;stroke-dasharray:6 5;stroke-linejoin:round}
.centre{stroke:var(--hull);stroke-width:2.5}
.state{fill:var(--hull);font-size:var(--rfs,15px);font-weight:800;letter-spacing:.04em}
.readout{fill:var(--muted);font-size:var(--rfs,15px);font-weight:700;font-variant-numeric:tabular-nums}
.readout tspan.val{fill:var(--hull)}
/* low / high toggle (same instrument as geometric-toggle-alter.html) */
.control{display:flex;align-items:center;gap:10px;margin-top:6px;user-select:none}
.control-label{font-size:var(--cfs,16px);color:var(--muted);letter-spacing:.02em;width:56px;cursor:pointer;transition:color 200ms ease}
.control-label.left{text-align:right}
.control-label.right{text-align:left}
.control-label.active{color:var(--fg);font-weight:600}
.switch{position:relative;width:54px;height:22px;background:var(--line);border-radius:11px;border:1px solid var(--ghost);cursor:pointer;flex:none}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ghost);transition:transform 260ms cubic-bezier(.4,0,.2,1)}
.switch.on .knob{transform:translateX(32px);background:var(--hull)}
.switch:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
</style>
</head>
<body>
  <section class="panel" id="pEve">
    <svg id="svgEve" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Functional evenness: low and high, with each state's alpha shape"></svg>
    <div class="control">
      <span class="control-label left active" id="loEve">Low</span>
      <div class="switch" id="swEve" role="switch" aria-checked="false" tabindex="0" aria-label="Low or high evenness"><div class="knob"></div></div>
      <span class="control-label right" id="hiEve">High</span>
    </div>
  </section>
  <section class="panel" id="pDiv">
    <svg id="svgDiv" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Functional divergence: low and high, with each state's alpha shape"></svg>
    <div class="control">
      <span class="control-label left active" id="loDiv">Low</span>
      <div class="switch" id="swDiv" role="switch" aria-checked="false" tabindex="0" aria-label="Low or high divergence"><div class="knob"></div></div>
      <span class="control-label right" id="hiDiv">High</span>
    </div>
  </section>

<script>
(function(){
"use strict";
/* ============================================================
   Functional evenness and divergence, each with a Low / High toggle (no animation).

   Points: the 20-species pattern of magnitude-variation.html. The convex-hull species never move,
   so FRic is the same in all four states. "High evenness" is the evenly spaced layout; the other three
   states were found by a constrained search that keeps the alpha shape as close to it as possible.

   Alpha shapes: computed in R with AlphaRichness, unchanged (alpha_richness(), k from find_stable_k()),
   one per state, and stored below as the kept Delaunay simplices (0-based point indices). Every state
   gives one cluster with no species left out; the shapes differ from the evenly spaced one by
   at most ~9% of its area (pixels).
     state       FEve  FDiv  k     area (px^2)
     eve_low     0.75  0.79  2.25  24931
     eve_high    0.98  0.76  2.29  23676
     div_low     0.74  0.62  2.25  24661
     div_high    0.86  0.82  2.25  24170
   FEve and FDiv (Villéger et al. 2008, equal abundances) are computed live from the drawn points;
   FDiv's centre is the centroid of the convex-hull vertices.

   Options
     panel=evenness | divergence | both (default both)
     eve=high, div=high   start a panel in its HIGH state (default low)
     area=0        hide the FEve / FDiv readout
     state=0       hide the LOW / HIGH label in the plot
     ghost=0       hide the dashed outline of the LOW state's alpha shape shown in the HIGH state
     guides=1      draw the minimum spanning tree (Evenness) and centre + spokes (Divergence)
     afs / tfs / sfs / rfs / cfs   axis-label / title / subtitle / readout / toggle-label font size (px)
     theme=dark|auto, bg=transparent
     channel=...   BroadcastChannel name (default "evendiv"); messages {cmd:"set", arg:{eve:true|false, div:true|false}}
   ============================================================ */
const DATA = {"eve_low":{"pts":[[194.6,185.37],[207.99,295.17],[173.96,168.84],[258.11,110.15],[207.46,276.81],[338.63,203.85],[129.19,199.52],[157.3,174.14],[179.14,210.08],[305.18,162.35],[331.42,170.65],[261.76,202.24],[365.99,207.98],[376.64,162.17],[273.99,256.21],[192.6,89.95],[353.08,206.66],[324.91,181.38],[327.54,232.02],[324.77,283.29]],"simp":[[7,8,6],[4,8,11],[4,14,11],[4,14,1],[18,14,11],[18,14,19],[9,3,11],[0,3,11],[0,8,11],[16,18,5],[16,18,12],[16,12,13],[10,16,13],[10,16,5],[2,3,15],[2,0,3],[2,7,8],[2,0,8],[17,10,5],[17,10,9],[17,9,11],[17,18,11],[17,18,5]],"k":2.25,"area":24930.6},"eve_high":{"pts":[[253.8,171.1],[207.99,295.17],[177.12,156.67],[258.11,110.15],[241.74,267.64],[292.15,149.89],[129.19,199.52],[218.26,133.96],[169.6,208.12],[330.99,172.14],[292.06,204.09],[197.92,243.35],[365.99,207.98],[376.64,162.17],[248.45,223.19],[192.6,89.95],[213.11,190.74],[284.66,260.57],[326,232.09],[324.77,283.29]],"simp":[[12,9,13],[8,16,11],[7,16,0],[7,3,0],[14,16,0],[14,16,11],[4,14,17],[4,11,1],[4,14,11],[18,12,9],[18,17,19],[5,3,0],[2,8,16],[2,7,16],[2,8,6],[2,7,15],[10,18,9],[10,5,0],[10,5,9],[10,14,0],[10,14,17],[10,18,17]],"k":2.29,"area":23675.8},"div_low":{"pts":[[275.01,188.59],[207.99,295.17],[176.67,156.75],[258.11,110.15],[270.2,252.76],[318.76,174.74],[129.19,199.52],[258.1,184.04],[277.35,200.79],[248.0,201.88],[262.04,210.0],[184.94,211.37],[365.99,207.98],[376.64,162.17],[289.43,184.38],[192.6,89.95],[324.77,233.34],[261.18,196.76],[261.12,169.99],[324.77,283.29]],"simp":[[4,11,1],[2,11,6],[12,5,13],[3,2,15],[9,4,11],[9,2,7],[9,2,11],[18,3,5],[18,2,7],[18,3,2],[17,9,7],[10,9,4],[10,8,4],[10,17,9],[10,17,8],[16,12,5],[16,4,19],[16,8,4],[14,18,5],[14,16,5],[14,16,8],[0,18,7],[0,14,18],[0,14,8],[0,17,7],[0,17,8]],"k":2.25,"area":24661.1},"div_high":{"pts":[[210.58,109.21],[207.99,295.17],[196.5,134.48],[258.11,110.15],[324.33,248.59],[249.09,201.02],[129.19,199.52],[185.87,121.86],[174.0,209.6],[297.59,154.95],[334.18,171.42],[198.67,247.9],[365.99,207.98],[376.64,162.17],[240.23,268.99],[192.6,89.95],[225.58,115.1],[284.52,259.74],[333.38,227.61],[324.77,283.29]],"simp":[[17,18,5],[8,11,5],[14,11,5],[14,17,5],[14,11,1],[4,17,19],[4,17,18],[9,3,5],[9,18,5],[2,8,5],[2,8,6],[10,12,18],[10,9,18],[10,12,13],[16,3,5],[16,2,5],[0,7,15],[0,2,7],[0,16,2]],"k":2.25,"area":24169.7}};

const P = new URLSearchParams(location.search);
const SHOW_VAL = P.get("area") !== "0", SHOW_STATE = P.get("state") !== "0", GUIDES = P.get("guides") === "1", GHOST = P.get("ghost") !== "0";
const root = document.documentElement, theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "tfs", "rfs", "sfs", "cfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");
const PANEL = (P.get("panel") || "both").toLowerCase();
if (PANEL.startsWith("eve")) document.getElementById("pDiv").classList.add("hidden");
if (PANEL.startsWith("div")) document.getElementById("pEve").classList.add("hidden");

/* ==================== geometry (identical to magnitude-variation.html) ==================== */
const W = 480, H = 400, M = {l:44, r:20, t:20, b:44};
const x0 = M.l, x1 = W - M.r, y0 = H - M.b, y1 = M.t;
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
const f1 = v => v.toFixed(1);
function hullIdx(pts){
  const idx = pts.map((_, i) => i).sort((a, b) => pts[a][0] - pts[b][0] || pts[a][1] - pts[b][1]);
  const lower = [], upper = [];
  for (const i of idx){ while (lower.length >= 2 && cross(pts[lower[lower.length-2]], pts[lower[lower.length-1]], pts[i]) <= 0) lower.pop(); lower.push(i); }
  for (let k = idx.length - 1; k >= 0; k--){ const i = idx[k]; while (upper.length >= 2 && cross(pts[upper[upper.length-2]], pts[upper[upper.length-1]], pts[i]) <= 0) upper.pop(); upper.push(i); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

/* ==================== alpha shape outline from the stored simplices ==================== */
function boundaryEdges(simp){
  const cnt = new Map();
  for (const t of simp) for (const [a, b] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){
    const k = a < b ? a+","+b : b+","+a; cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  const out = []; cnt.forEach((c, k) => { if (c === 1) out.push(k.split(",").map(Number)); });
  return out;
}
// chain boundary edges into closed loops (one path; evenodd fill handles any holes)
function loopsPath(pts, edges){
  const adj = new Map(), used = new Set(), key = (a, b) => a < b ? a+","+b : b+","+a;
  for (const [a, b] of edges){ (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); }
  let d = "";
  for (const [a0, b0] of edges){
    if (used.has(key(a0, b0))) continue;
    used.add(key(a0, b0));
    const loop = [a0, b0]; let prev = a0, cur = b0;
    while (cur !== a0){
      const next = (adj.get(cur) || []).find(v => v !== prev && !used.has(key(cur, v)));
      if (next === undefined) break;
      used.add(key(cur, next)); loop.push(next); prev = cur; cur = next;
    }
    d += "M" + loop.map(i => f1(pts[i][0]) + "," + f1(pts[i][1])).join("L") + "Z";
  }
  return d;
}

/* ==================== indices (equal abundances) ==================== */
function mstEdges(pts){
  const n = pts.length, inTree = new Array(n).fill(false), d = new Array(n).fill(Infinity), par = new Array(n).fill(-1), edges = [];
  d[0] = 0;
  for (let it = 0; it < n; it++){
    let u = -1;
    for (let v = 0; v < n; v++) if (!inTree[v] && (u < 0 || d[v] < d[u])) u = v;
    inTree[u] = true;
    if (par[u] >= 0) edges.push([par[u], u, d[u]]);
    for (let v = 0; v < n; v++) if (!inTree[v]){ const w = dist(pts[u], pts[v]); if (w < d[v]){ d[v] = w; par[v] = u; } }
  }
  return edges;
}
function fEve(pts){
  const S = pts.length, e = mstEdges(pts), tot = e.reduce((s, x) => s + x[2], 0), k = 1/(S - 1);
  return (e.reduce((s, x) => s + Math.min(x[2]/tot, k), 0) - k) / (1 - k);
}
function centreOf(pts){ const h = hullIdx(pts); return h.reduce((c, i) => [c[0] + pts[i][0]/h.length, c[1] + pts[i][1]/h.length], [0, 0]); }
function fDiv(pts){
  const G = centreOf(pts), d = pts.map(p => dist(p, G)), m = d.reduce((s, x) => s + x, 0) / d.length;
  return m / (d.reduce((s, x) => s + Math.abs(x - m), 0) / d.length + m);   // Δd = 0 with equal abundances
}

/* ==================== drawing ==================== */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawAxes(svg){
  const g = el("g", {}, svg);
  el("path", {d:`M${x0},${y1-6}V${y0}H${x1+6}`, class:"axis"}, g);
  el("path", {d:`M${x1+12},${y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${x0},${y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(x0+x1)/2, y:H-10, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${x0-16},${(y0+y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
function makePanel(svgId, kind){
  const svg = document.getElementById(svgId);
  drawAxes(svg);
  const lowGhost = el("path", {class:"lowghost"}, svg);          // LOW state's alpha shape, dashed, shown in HIGH (under the solid outline)
  const shape = el("path", {class:"shape"}, svg);
  const guide = el("path", {class:"guide"}, svg);
  const cross_ = el("path", {class:"centre"}, svg);
  const gPts = el("g", {}, svg);
  const n = DATA[kind + "_low"].pts.length;
  const dots = Array.from({length:n}, () => el("circle", {r:5, class:"pt"}, gPts));
  let state = null, val = null;
  if (SHOW_STATE) state = el("text", {x:x1, y:y1 + 4, "text-anchor":"end", "dominant-baseline":"hanging", class:"state"}, svg);
  if (SHOW_VAL){
    const readout = el("text", {x:x1, y:y1 + 4 + (SHOW_STATE ? 20 : 0), "text-anchor":"end", "dominant-baseline":"hanging", class:"readout"}, svg);
    readout.appendChild(document.createTextNode(kind === "eve" ? "FEve " : "FDiv "));
    val = el("tspan", {class:"val"}, readout);
  }
  const word = kind === "eve" ? "EVENNESS" : "DIVERGENCE";
  return {
    render(high){
      const st = DATA[kind + (high ? "_high" : "_low")], pts = st.pts;
      shape.setAttribute("d", loopsPath(pts, boundaryEdges(st.simp)));
      const lo = DATA[kind + "_low"];
      lowGhost.setAttribute("d", high && GHOST ? loopsPath(lo.pts, boundaryEdges(lo.simp)) : "");
      dots.forEach((d, i) => { d.setAttribute("cx", f1(pts[i][0])); d.setAttribute("cy", f1(pts[i][1])); });
      if (GUIDES){
        const G = centreOf(pts);
        guide.setAttribute("d", kind === "eve"
          ? mstEdges(pts).map(([a, b]) => `M${f1(pts[a][0])},${f1(pts[a][1])}L${f1(pts[b][0])},${f1(pts[b][1])}`).join("")
          : pts.map(p => `M${f1(G[0])},${f1(G[1])}L${f1(p[0])},${f1(p[1])}`).join(""));
        if (kind === "div"){ const s = 7; cross_.setAttribute("d", `M${G[0]-s},${G[1]-s}L${G[0]+s},${G[1]+s}M${G[0]-s},${G[1]+s}L${G[0]+s},${G[1]-s}`); }
      }
      if (state) state.textContent = (high ? "HIGH " : "LOW ") + word;
      if (val) val.textContent = (kind === "eve" ? fEve(pts) : fDiv(pts)).toFixed(2);
    }
  };
}
const PANELS = {eve: {panel: makePanel("svgEve", "eve"), tag: "Eve"}, div: {panel: makePanel("svgDiv", "div"), tag: "Div"}};

/* ==================== low / high toggles ==================== */
const STATE = {eve: P.get("eve") === "high", div: P.get("div") === "high"};
function show(kind){
  const {panel, tag} = PANELS[kind], high = STATE[kind];
  panel.render(high);
  const sw = document.getElementById("sw" + tag);
  sw.classList.toggle("on", high); sw.setAttribute("aria-checked", String(high));
  document.getElementById("lo" + tag).classList.toggle("active", !high);
  document.getElementById("hi" + tag).classList.toggle("active", high);
}
function set(kind, high){ if (kind in STATE){ STATE[kind] = !!high; show(kind); postStatus(); } }
for (const kind of ["eve", "div"]){
  const tag = PANELS[kind].tag, sw = document.getElementById("sw" + tag);
  sw.addEventListener("click", () => set(kind, !STATE[kind]));
  sw.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); set(kind, !STATE[kind]); } });
  document.getElementById("lo" + tag).addEventListener("click", () => set(kind, false));
  document.getElementById("hi" + tag).addEventListener("click", () => set(kind, true));
}

/* ==================== optional remote control ==================== */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "evendiv") : null;
function postStatus(){ if (bc) bc.postMessage({cmd:"status", arg:{...STATE}}); }
if (bc) bc.onmessage = e => {
  const m = e.data || {};
  if (m.cmd === "set" && m.arg) for (const k in m.arg) set(k, m.arg[k]);
  if (m.cmd === "ping") postStatus();
};

show("eve"); show("div"); postStatus();
window.evenDiv = {DATA, fEve, fDiv, set};
})();
</script>
</body>
</html>
