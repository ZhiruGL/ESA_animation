<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trait Table</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed;
  --skel:#eceef1; --row:#fff4d6; --hi:#f2a900; --btn:#f6f7f9;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31;
  --skel:#232830; --row:#2e2814; --hi:#f5b82e; --btn:#1a1e23;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;flex-direction:column;padding:16px;gap:12px}

.tblwrap{flex:1;min-height:0;width:100%;overflow-y:auto;scrollbar-width:thin}
/* --fs = base text size; change with ?fs=16 etc. */
:root{--fs:15px}
/* fixed layout: species column 40%, data columns split the rest equally,
   so a Trait table and a PC table line up identically */
table{border-collapse:collapse;width:100%;font-size:var(--fs);line-height:1.25;table-layout:fixed}
th:first-child{width:40%}
thead th{position:sticky;top:0;background:var(--bg);z-index:1}
html.transparent thead th{background:transparent}
th,td{padding:.2em .8em;border-bottom:1px solid var(--line);text-align:center;transition:background .3s}
th{font-weight:700;font-size:var(--fs);white-space:nowrap;color:var(--fg);border-bottom:2px solid var(--fg)}
th:first-child,td:first-child{text-align:left}
td:first-child{color:var(--fg);font-weight:800;white-space:nowrap}
td .sk{display:inline-block;width:2.4em;height:.55em;border-radius:.3em;background:var(--skel);
  vertical-align:middle;transition:background .3s}
tbody tr{cursor:pointer}
.passive tbody tr,.passive svg{cursor:default}
tr.active td{background:var(--row)}
tr.active td:first-child{color:var(--fg)}
tr.active td .sk{background:var(--hi)}
tr.done td:first-child{color:var(--fg)}

.controls{display:flex;gap:6px;align-items:center}
.controls.hidden{display:none}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--btn);border:1px solid var(--line);
  border-radius:8px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:84px}
.btn:disabled{opacity:.4;cursor:default}
.count{font-size:12px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="tblwrap" id="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="controls" id="controls">
  <button class="btn primary" id="bPlay">▶ Play</button>
  <button class="btn" id="bNext">Next ▶</button>
  <button class="btn" id="bAll">All</button>
  <button class="btn" id="bReset">Reset</button>
  <span class="count" id="count"></span>
</div>

<script>
(function(){
"use strict";
/* ==================== options (keep n / speed identical to the plot iframe) ==================== */
const P = new URLSearchParams(location.search);
const N = Math.max(3, Math.min(100, parseInt(P.get("n")) || 20));     // number of species
// column labels:  default  -> Trait 1..k
//                 ?cols=pc -> PC1..PCk
//                 ?cols=A,B,C -> custom labels (k = number given)
const COLS_P = (P.get("cols") || "").trim();
const CUSTOM = COLS_P && COLS_P.toLowerCase() !== "pc" ? COLS_P.split(",").map(s => s.trim()).filter(Boolean) : null;
const NT = CUSTOM ? CUSTOM.length : Math.max(2, Math.min(5, parseInt(P.get("traits")) || 3));
const colLabel = j => CUSTOM ? CUSTOM[j] : COLS_P.toLowerCase() === "pc" ? `PC${j+1}` : `Trait ${j+1}`;
const SPEED = Math.max(.25, Math.min(4, parseFloat(P.get("speed")) || 1));
const STEP_MS = 200;   // time between rows during Play (divided by speed)

const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.dataset.theme = "dark";
if (P.get("bg") === "transparent") document.documentElement.classList.add("transparent");
// buttons hidden by default; add ?controls=1 to show them
if (P.get("controls") !== "1") document.getElementById("controls").classList.add("hidden");
if (parseFloat(P.get("fs")) > 0) document.documentElement.style.setProperty("--fs", parseFloat(P.get("fs")) + "px");

/* ==================== state ==================== */
let placed = [];   // indices lit so far, in order
let active = -1;
let playing = false;
let runId = 0;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms / SPEED));

/* ==================== build table ==================== */
const thead = $("tbl").tHead, tbody = $("tbl").tBodies[0];
{
  const hr = thead.insertRow();
  hr.innerHTML = "<th>Species</th>" + Array.from({length:NT}, (_, j) => `<th>${colLabel(j)}</th>`).join("");
  for (let i = 0; i < N; i++){
    const tr = tbody.insertRow();
    tr.innerHTML = `<td>Bat species ${i+1}</td>` + "<td><span class='sk'></span></td>".repeat(NT);
  }
}
const rows = Array.from(tbody.rows);

/* ==================== core ==================== */
function setActive(i){
  active = i;
  rows.forEach((tr, j) => tr.classList.toggle("active", j === i));
  if (i >= 0){   // keep the lit row visible inside the scrolling table
    const wrap = $("tblwrap"), tr = rows[i], head = thead.offsetHeight;
    const top = tr.offsetTop - head, bot = tr.offsetTop + tr.offsetHeight;
    if (top < wrap.scrollTop) wrap.scrollTop = top;
    else if (bot > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = bot - wrap.clientHeight;
  }
}
function place(i){
  if (!placed.includes(i)){ placed.push(i); rows[i].classList.add("done"); }
  setActive(i); updateUI();
}
const nextIndex = () => { for (let i = 0; i < N; i++) if (!placed.includes(i)) return i; return -1; };
function next(){ stop(); const n = nextIndex(); if (n >= 0) place(n); }
function all(){
  stop();
  for (let i = 0; i < N; i++) if (!placed.includes(i)){ placed.push(i); rows[i].classList.add("done"); }
  setActive(-1); updateUI();
}
function reset(){
  stop(); placed = [];
  rows.forEach(tr => tr.classList.remove("done"));
  setActive(-1); $("tblwrap").scrollTop = 0; updateUI();
}
async function play(){
  if (playing){ stop(); return; }
  if (nextIndex() < 0) reset();
  const my = ++runId; playing = true; updateUI();
  while (my === runId){
    const n = nextIndex();
    if (n < 0) break;
    place(n);
    await sleep(STEP_MS);
  }
  if (my === runId){ playing = false; setActive(-1); updateUI(); }
}
function stop(){ runId++; if (playing){ playing = false; updateUI(); } }
function setPlay(want){ if (want && !playing) play(); else if (!want && playing) stop(); }

function updateUI(){
  $("bPlay").textContent = playing ? "❚❚ Pause" : "▶ Play";
  $("bNext").disabled = $("bAll").disabled = nextIndex() < 0;
  $("count").textContent = `${placed.length} / ${N}`;
}

/* ==================== sync with the plot iframe ==================== */
const ACTIONS = {next, all, reset, setPlay, place: i => { stop(); place(i); },
  // reply from the plot iframe to our hello: adopt its progress and keep pace with it
  state: s => {
    stop(); placed = [];
    rows.forEach(tr => tr.classList.remove("done"));
    s.placed.forEach(i => { placed.push(i); rows[i].classList.add("done"); });
    setActive(placed.length ? placed[placed.length - 1] : -1); updateUI();
    if (s.playing) setTimeout(play, STEP_MS / SPEED);
  },
  // another table iframe reports the text size it needs; every table uses the smallest
  fs: m => { if (m && m.id !== ME){ PEER_FS[m.id] = m.fs; applyFs(); } },
  // a newly loaded table says hello; tell it our size
  hello: () => shareFs()};
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "traitspace") : null;
function act(cmd, arg){ if (bc) bc.postMessage({cmd, arg}); ACTIONS[cmd](arg); }
if (bc) bc.onmessage = e => { const f = e.data && ACTIONS[e.data.cmd]; if (f) f(e.data.arg); };

/* ==================== wiring ==================== */
// Clicking and keyboard shortcuts are OFF by default, so selecting the iframe in the slides
// editor never starts the animation; only controls.html does. Add ?interactive=1 to enable them.
const INTERACTIVE = P.get("interactive") === "1";
if (!INTERACTIVE) document.body.classList.add("passive");
if (INTERACTIVE) rows.forEach((tr, i) => tr.addEventListener("click", () => act("place", i)));
$("bPlay").addEventListener("click", () => act("setPlay", !playing));
$("bNext").addEventListener("click", () => act("next"));
$("bAll").addEventListener("click", () => act("all"));
$("bReset").addEventListener("click", () => act("reset"));
if (INTERACTIVE) document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight"){ e.preventDefault(); act("next"); }
  else if (e.key === " "){ e.preventDefault(); act("setPlay", !playing); }
  else if (e.key === "r" || e.key === "R") act("reset");
  else if (e.key === "a" || e.key === "A") act("all");
});

const AVAIL_EL = () => document.getElementById("tblwrap");
/* ==================== fit table to the iframe height ==================== */
// Unless ?fs= is given, shrink the text (max 15px, min 8px) until every row fits without scrolling.
// All table iframes on the slide then share the smallest size, so a Trait table and a PC table
// always show identical text even if their iframes differ slightly in height.
const FIXED_FS = parseFloat(P.get("fs")) > 0;
const ME = Math.random().toString(36).slice(2);   // this iframe's id
const PEER_FS = {};                               // id -> size each other table needs
let MY_FS = 15;
const setFs = v => document.documentElement.style.setProperty("--fs", v + "px");
function applyFs(){
  if (FIXED_FS) return;
  setFs(Math.min(MY_FS, ...Object.values(PEER_FS)));
}
function shareFs(){ if (bc && !FIXED_FS) bc.postMessage({cmd:"fs", arg:{id:ME, fs:MY_FS}}); }
function fitTable(){
  if (FIXED_FS) return;
  const box = AVAIL_EL(), tbl = document.getElementById("tbl");
  if (!box || !box.clientHeight) return;
  let fs = 15; setFs(fs);
  const avail = box.clientHeight;
  if (tbl.offsetHeight > avail){
    fs = Math.max(8, fs * avail / tbl.offsetHeight); setFs(fs);       // first guess
    while (tbl.offsetHeight > avail && fs > 8){ fs -= .25; setFs(fs); } // then step down until it fits
  }
  MY_FS = fs;
  applyFs(); shareFs();
}
window.addEventListener("resize", fitTable);
fitTable();

updateUI();
if (bc) bc.postMessage({cmd:"hello"});   // ask a plot iframe for its state and other tables for their size
if (P.get("autoplay") === "1") setTimeout(() => act("setPlay", true), 600);
})();
</script>
</body>
</html>
