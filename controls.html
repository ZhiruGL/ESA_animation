<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trait Space Controls</title>
<style>
:root{ --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed; --btn:#f6f7f9; }
:root[data-theme="dark"]{ --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31; --btn:#1a1e23; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px}
.btn{font:inherit;font-weight:600;color:var(--fg);background:var(--btn);border:1px solid var(--line);
  border-radius:10px;padding:.45em 1.1em;cursor:pointer;min-width:6.5em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>
  <button class="btn primary" id="bPlay">▶ Play</button>
  <button class="btn" id="bReset">Reset</button>

<script>
(function(){
"use strict";
/* ============================================================
   Remote control for traits-to-traitspace.html / traits-table.html.
   It runs no animation itself: each button broadcasts a command on the
   shared channel, and the plot/table iframes on the slide carry it out.
   The plot reports back its status so the Play button can show Pause.
   ============================================================ */
const P = new URLSearchParams(location.search);
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.dataset.theme = "dark";
if (P.get("bg") === "transparent") document.documentElement.classList.add("transparent");
if (parseFloat(P.get("fs")) > 0) document.body.style.fontSize = parseFloat(P.get("fs")) + "px";

const $ = id => document.getElementById(id);
let status = {playing:false, placed:0, N:0};   // last status reported by the plot

const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "traitspace") : null;
const send = (cmd, arg) => { if (bc) bc.postMessage({cmd, arg}); };

function render(){
  const done = status.N > 0 && status.placed >= status.N;
  $("bPlay").textContent = status.playing ? "❚❚ Pause" : done ? "↻ Replay" : "▶ Play";
}

if (bc) bc.onmessage = e => {
  if (e.data && e.data.cmd === "status"){ status = e.data.arg; render(); }
};

$("bPlay").addEventListener("click", () => send("setPlay", !status.playing));
$("bReset").addEventListener("click", () => send("reset"));

render();
send("ping");                        // ask the plot for its current status
setTimeout(() => send("ping"), 800); // and again, in case the plot loads after us
})();
</script>
</body>
</html>
