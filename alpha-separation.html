<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Alpha Shape — Sensitivity to Cluster Separation</title>
<style>
  :root{
    --bg: #fdfcfa; --ink: #1c1c1c; --muted: #78716a; --hairline: #e4ded2;
    --accent: #0f766e; --track: #ece7db; --moving: #d97706;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .stage{ display:flex; flex-direction:column; align-items:center; padding: 26px 30px 34px; gap: 24px; }
  .panels{ display:flex; flex-direction:row; gap: 28px; }
  .panel-label{ font-size: 16px; color: var(--muted); letter-spacing: 0.02em; text-align:center; margin-bottom: 6px; }
  .canvas-wrap{ background: #ffffff; border: 1px solid var(--hairline); border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  canvas{ display:block; border-radius: 3px; }
  .legend{ display:flex; gap: 18px; font-size: 16px; color: var(--muted); }
  .legend-item{ display:flex; align-items:center; gap: 6px; }
  .swatch{ width: 8px; height: 8px; border-radius: 50%; display:inline-block; }
  .bar{ width: 16px; height: 0; border-top: 2px solid; display:inline-block; }
  .band{ width: 16px; height: 10px; display:inline-block; }
  .slider-row{ width: 100%; max-width: 780px; display:flex; align-items:center; gap: 12px; }
  input[type="range"]{ flex:1; accent-color: var(--accent); height: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="panels">
    <div>
      <div class="panel-label">Point pattern</div>
      <div class="canvas-wrap"><canvas id="cnvShape"></canvas></div>
    </div>
    <div>
      <div class="panel-label">Functional richness vs. separation</div>
      <div class="canvas-wrap"><canvas id="cnvLine"></canvas></div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="swatch" style="background:var(--ink);"></span>staying species</div>
    <div class="legend-item"><span class="swatch" style="background:var(--moving);"></span>moving species (20%)</div>
  </div>

  <div class="slider-row">
    <input type="range" id="slider" min="0" max="20" value="0" aria-label="Shift of the moving species">
  </div>
</div>

66831, 1.35908947666831, 1.35908947666831, 1.35908947666831], "lo": [1, 0.527384720616499, 0.706254109876458, 0.581908454924273, 0.743724204399183, 0.798959619919286, 0.784703953730154, 0.766283117527646, 0.766283117527646, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061472, 0.729941009061471], "hi": [1, 1.73366078978617, 2.19199321532656, 2.17472925561596, 2.48959271579386, 2.33632933186134, 2.59372477228117, 2.71856280016641, 2.5412596784455, 2.71956537182005, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186, 2.30029052406186]};

  const moving = new Set(D.moving);
  const pointsAt = i => D.P0.map((p, j) => moving.has(j) ? [p[0] + SHIFTS[i], p[1] + SHIFTS[i]] : p);
  const rel = D.frames.map(f => f.area / D.frames[0].area);

  const dpr = window.devicePixelRatio || 1;
  function setup(id, w, h){
    const c = document.getElementById(id), ctx = c.getContext('2d');
    c.width = w*dpr; c.height = h*dpr; c.style.width = w+'px'; c.style.height = h+'px'; ctx.scale(dpr, dpr);
    return ctx;
  }

  const SHAPE_W = 460, SHAPE_H = 460, shapeCtx = setup('cnvShape', SHAPE_W, SHAPE_H);
  // one frame for every Δμ, so the staying species never move on screen
  const allPts = [].concat(...SHIFTS.map((_, i) => pointsAt(i)));
  const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
  const pad = 0.6, span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) + 2*pad;
  const cxm = (Math.max(...xs) + Math.min(...xs))/2, cym = (Math.max(...ys) + Math.min(...ys))/2;
  const sMinX = cxm - span/2, sMinY = cym - span/2;

  function drawShape(i){
    const P = pointsAt(i), tris = D.frames[i].tris;
    shapeCtx.clearRect(0, 0, SHAPE_W, SHAPE_H);
    shapeCtx.fillStyle = 'rgba(15,118,110,0.12)';
    tris.forEach(t => {
      shapeCtx.beginPath();
      t.forEach((v, k) => { const q = toShapePx(P[v]); k ? shapeCtx.lineTo(q.x, q.y) : shapeCtx.moveTo(q.x, q.y); });
      shapeCtx.closePath(); shapeCtx.fill();
    });
    const count = new Map();
    tris.forEach(t => [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]].forEach(([a, b]) => {
      const k = a < b ? a+','+b : b+','+a; count.set(k, (count.get(k) || 0) + 1);
    }));
    shapeCtx.lineWidth = 2; shapeCtx.strokeStyle = '#0f766e'; shapeCtx.lineJoin = 'round';
    count.forEach((c, k) => {
      if (c !== 1) return;
      const [a, b] = k.split(',').map(Number), pa = toShapePx(P[a]), pb = toShapePx(P[b]);
      shapeCtx.beginPath(); shapeCtx.moveTo(pa.x, pa.y); shapeCtx.lineTo(pb.x, pb.y); shapeCtx.stroke();
    });

  }

  const yAll = rel, yMin = Math.min(0.9, Math.min(...yAll)), yMax = Math.max(...yAll) * 1.06;
  const toLinePx = (s, v) => ({x: LML + s/SHIFTS[N-1]*(LINE_W-LML-LMR), y: LINE_H - LMB - (v-yMin)/(yMax-yMin)*(LINE_H-LMT-LMB)});
  function niceTicks(min, max, target){
    const raw = (max - min)/target, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/mag;

    lineCtx.save();

    lineCtx.restore();

    for (let k = 0; k <= i; k++){ const p = toLinePx(SHIFTS[k], rel[k]); k ? lineCtx.lineTo(p.x, p.y) : lineCtx.moveTo(p.x, p.y); }
    lineCtx.lineWidth = 2; lineCtx.strokeStyle = '#0f766e'; lineCtx.stroke();
    const lp = toLinePx(SHIFTS[i], rel[i]);
    lineCtx.beginPath(); lineCtx.arc(lp.x, lp.y, 3.5, 0, Math.PI*2); lineCtx.fillStyle = '#0f766e'; lineCtx.fill();

    lineCtx.fillStyle = '#1c1c1c'; lineCtx.font = '17px -apple-system, sans-serif';
    lineCtx.textAlign = 'center'; lineCtx.textBaseline = 'alphabetic';
    lineCtx.fillText('Shift of moving species, Δμ', (LML+LINE_W-LMR)/2, LINE_H-8);
    lineCtx.save(); lineCtx.translate(18, (LMT+LINE_H-LMB)/2); lineCtx.rotate(-Math.PI/2);
    lineCtx.fillText('Functional richness (× start)', 0, 0); lineCtx.restore();
  }

  // ================= wiring =================
  const slider = document.getElementById('slider');
  function render(i){ drawShape(i); drawLineChart(i); }
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('separation') : null;
  slider.addEventListener('input', () => { render(Number(slider.value)); if (bc) bc.postMessage(Number(slider.value)); });
  if (bc) bc.onmessage = e => { const v = Number(e.data); if (v >= 0 && v < N){ slider.value = v; render(v); } };
  render(0);
  window.separationDemo = {data: D, rel, render};
})();
