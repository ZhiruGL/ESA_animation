<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge Table</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --rule:#d5d9de;
  --bridge:#c2410c; --sliver:#1d9e75;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --rule:#3a4048;
  --bridge:#ff8a4c; --sliver:#5dcaa5;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
/* one SVG, so the table scales as a picture to whatever box it is embedded in (designed for 560 × 160) */
svg{display:block;width:100%;height:100%}
.th{fill:var(--muted);font-size:16px;font-weight:700}
.td{fill:var(--fg);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.td.b{fill:var(--bridge)} .td.s{fill:var(--sliver)}
.rule{stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg id="ov" viewBox="0 0 560 160" preserveAspectRatio="xMidYMid meet"></svg>
<script>
(function(){
"use strict";
/* ============================================================
   Companion table for bridging-triangle.html, to show on its own.

   Circumradius and longest edge of the three bridge triangles (numbered 1–3 from top to bottom, as in
   the figure) and of the thin triangle on the left cluster's left edge (green in the figure).
   Vertices are copied exactly from bridging-triangle.html (window.bridgeTriangle.bridges / .firstOut),
   in the figure's screen units, so the numbers match it.

   Options: theme=dark|auto, bg=transparent
   ============================================================ */
const P = new URLSearchParams(location.search);
const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");

/* same vertices as bridging-triangle.html */
const TRIS = [
  {name:"bridge 1", cls:"b", v:[[331, 202], [469.85500730766415, 228.3492246123013], [466, 245]]},
  {name:"bridge 2", cls:"b", v:[[331, 288], [331, 202], [466, 245]]},
  {name:"bridge 3", cls:"b", v:[[478.4169362707298, 273.6473726581221], [331, 288], [466, 245]]},
  {name:"sliver",   cls:"s", v:[[200, 210], [207, 245], [200, 280]]},
];

const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function circumradius(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
  const a2 = a[0]*a[0]+a[1]*a[1], b2 = b[0]*b[0]+b[1]*b[1], c2 = c[0]*c[0]+c[1]*c[1];
  const x = (a2*(b[1]-c[1]) + b2*(c[1]-a[1]) + c2*(a[1]-b[1])) / d;
  const y = (a2*(c[0]-b[0]) + b2*(a[0]-c[0]) + c2*(b[0]-a[0])) / d;
  return Math.hypot(a[0]-x, a[1]-y);
}
const longestEdge = t => Math.max(dist(t[0], t[1]), dist(t[1], t[2]), dist(t[2], t[0]));

const NS = "http://www.w3.org/2000/svg", ov = document.getElementById("ov");
function text(x, y, cls, str, anchor){
  const e = document.createElementNS(NS, "text");
  e.setAttribute("x", x); e.setAttribute("y", y); e.setAttribute("class", cls);
  if (anchor) e.setAttribute("text-anchor", anchor);
  e.textContent = str; ov.appendChild(e); return e;
}
const C = {x:16, y:34, cols:[250, 345, 440, 540]};          // right edges of the four number columns
TRIS.forEach((t, k) => text(C.cols[k], C.y, "th", t.name, "end"));
{
  const r = document.createElementNS(NS, "line");
  r.setAttribute("x1", C.x); r.setAttribute("x2", C.cols[C.cols.length - 1]); r.setAttribute("y1", C.y + 12); r.setAttribute("y2", C.y + 12);
  r.setAttribute("class", "rule"); ov.appendChild(r);
}
const rows = [
  ["Circumradius", TRIS.map(t => circumradius(...t.v))],
  ["Longest edge", TRIS.map(t => longestEdge(t.v))],
];
rows.forEach(([name, vals], k) => {
  const y = C.y + 50 + k*46;
  text(C.x, y, "td", name);
  vals.forEach((v, j) => text(C.cols[j], y, "td " + TRIS[j].cls, String(Math.round(v)), "end"));
});
window.bridgeTable = {rows};
})();
</script>
</body>
</html>
