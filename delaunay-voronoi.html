.del{fill:var(--fill);stroke:var(--del);stroke-width:2.4;stroke-linejoin:round}

.hull{fill:none;stroke:none}

.cc{fill:none;stroke:#5c5c5c;stroke-width:1.6;stroke-dasharray:6 5}

.lbl.on{opacity:1}

.sw.on .track{fill:var(--vor)}

.sw:focus-visible .track{stroke:var(--ink);stroke-width:2}
.cap{font-size:15px;fill:var(--muted);transition:opacity .3s}

const Q = new URLSearchParams(location.search);
if (Q.get("bg") === "transparent") document.documentElement.classList.add("transparent");
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
function el(tag, a, parent, text){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]);
  if (text != null) e.textContent = text; (parent || svg).appendChild(e); return e; }
const f1 = v => v.toFixed(1);

/* ---- map trait space → the plot area (fixed scale, centred) ---- */
const A = {x:180, y:58, w:600, h:400};
const xs = D.pts.map(p => p[0]), ys = D.pts.map(p => p[1]);
const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
const s = Math.min(A.w/(x1-x0), A.h/(y1-y0)), ox = A.x + (A.w - (x1-x0)*s)/2, oy = A.y + (A.h - (y1-y0)*s)/2;
const P = p => [ox + (p[0]-x0)*s, oy + (y1-p[1])*s];
const path = poly => "M" + poly.map(p => P(p).map(f1).join(",")).join("L") + "Z";

/* ---- Delaunay layer (with the Voronoi tessellation faint underneath) ---- */
const del = el("g", {class:"layer"});
D.tri.forEach(t => el("path", {d:path(t.map(i => D.pts[i])), class:"del"}, del));
D.cells.forEach(c => el("path", {d:path(c), class:"ghost-vor"}, del));
/* ---- Voronoi layer (with the Delaunay triangulation faint underneath) ---- */
const vor = el("g", {class:"layer"});
D.cells.forEach(c => el("path", {d:path(c), class:"vor"}, vor));
D.tri.forEach(t => el("path", {d:path(t.map(i => D.pts[i])), class:"ghost-del"}, vor));
el("path", {d:path(D.hull), class:"hull"});

/* ---- hover a triangle: its circumcircle and centre (= a Voronoi vertex) ---- */
const hiG = el("g", {"pointer-events":"none"});          // must not catch the pointer, or hovering clears itself
const clip = el("clipPath", {id:"plotclip"}, el("defs", {}));
el("rect", {x:0, y:50, width:960, height:447}, clip);
const hover = el("g", {}); 
D.tri.forEach((t, k) => {
  const hit = el("path", {d:path(t.map(i => D.pts[i])), class:"tri-hit"}, hover);
  hit.addEventListener("mouseenter", () => {
    hiG.replaceChildren();
    const [cx, cy] = P(D.cc[k]), r = D.cc[k][2]*s;
    el("circle", {cx:f1(cx), cy:f1(cy), r:f1(r), class:"cc", "clip-path":"url(#plotclip)"}, hiG);
    el("path", {d:path(t.map(i => D.pts[i])), class:"tri-hi"}, hiG);
    el("circle", {cx:f1(cx), cy:f1(cy), r:7, class:"ccpt"}, hiG);
  });
});
hover.addEventListener("mouseleave", () => hiG.replaceChildren());
/* ---- species on top ---- */
const ptsG = el("g", {"pointer-events":"none"});
D.pts.forEach(p => { const [x, y] = P(p); el("circle", {cx:f1(x), cy:f1(y), r:6, fill:"var(--pt)", stroke:"#fff", "stroke-width":1.5}, ptsG); });
svg.appendChild(hiG);                                   // highlight above everything except the switch
svg.appendChild(ptsG);

/* ---- switch (top) and caption (bottom) ---- */
const ll = el("text", {x:430, y:28, "text-anchor":"end", "dominant-baseline":"central", class:"lbl on"}, null, "Delaunay simplices");
const swG = el("g", {class:"sw", role:"switch", tabindex:0, "aria-checked":"false", "aria-label":"Switch between Delaunay simplices and Voronoi tessellation", transform:"translate(453,13)"});
el("rect", {width:54, height:30, rx:15, class:"track"}, swG);
el("circle", {cx:15, cy:15, r:12, class:"knob"}, swG);
const lr = el("text", {x:530, y:28, "dominant-baseline":"central", class:"lbl"}, null, "Voronoi tessellation");
const cap = el("text", {x:480, y:486, "text-anchor":"middle", class:"cap"});
if (Q.get("caption") === "0") cap.style.display = "none";

function set(v){
  swG.classList.toggle("on", v); swG.setAttribute("aria-checked", v);
  ll.classList.toggle("on", !v); lr.classList.toggle("on", v);
  del.style.opacity = v ? 0 : 1; vor.style.opacity = v ? 1 : 0;
  hover.style.display = v ? "none" : ""; hiG.replaceChildren();

}
const toggle = () => set(swG.getAttribute("aria-checked") !== "true");
swG.addEventListener("click", toggle);
swG.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); } });
ll.addEventListener("click", () => set(false)); lr.addEventListener("click", () => set(true));
set(Q.get("state") === "voronoi");
window.delVor = {data:D, set};
