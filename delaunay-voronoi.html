<title>Delaunay and Voronoi</title>
<style>
:root{--ink:#1f2328;--muted:#5c5c5c;--pt:#1f2328;--fill:#f6f5f1;--del:#2563eb;--delfill:#e3ebfc;--vor:#e8590c;--vorfill:#fdebdf}
*{box-sizing:border-box}

 0.16766593756618983]], [[-0.11700975380485266, -0.3087244217732442], [-0.469668185329435, -0.17833056783175405], [-0.5357475476903149, -0.25213749468625524], [-0.43819863550629445, -0.620823325814353], [-0.07884048774999627, -0.5789384152369937], [-0.07372431990106947, -0.5731335321005065]], [[0.41876848993870236, 0.4787976192635891], [0.025570654650917846, 0.709869188115219], [-0.021104851729214863, 0.633783320878749], [0.021814084070658185, 0.14987252939943757], [0.1076216687757916, 0.09746201325673641], [0.3679896004725235, 0.2705526075001954]], [[-0.16160477602172513, 0.14509704895930445], [-0.48632855903520933, 0.45397265683446153], [-0.6382734141889115, 0.18306372640052873], [-0.46769723889617487, -0.16580421739546106]], [[-0.43819863550629445, -0.620823325814353], [-0.45478374319980136, -0.6516397231946608], [-0.24018813136927383, -0.7671331499194094], [-0.0744898038595752, -0.763221222070284], [-0.07884048774999627, -0.5789384152369937]], [[0.9090924767342827, -0.15020068421969496], [0.6708088262870984, -0.15481340815821745], [0.6541757921262326, -0.17736503058362335], [0.7492447506853042, -0.410820484323799], [0.9124642843661049, -0.3243811992092068]]], "hull": [[-0.6693793550303302, -0.5361462964699123], [-0.24018813136927247, -0.7671331499194094], [0.09120852365012196, -0.7593092942211586], [0.9124642843661049, -0.3243811992092075], [0.9057206691024603, 0.023979830769817613], [0.3407014298510691, 0.7208120844456309], [-0.2897484542132304, 0.7108751918258757], [-0.7882156685465197, 0.3523383263651536], [-0.7436702540694515, -0.01700645123277387]]};
const Q = new URLSearchParams(location.search);
if (Q.get("bg") === "transparent") document.documentElement.classList.add("transparent");
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
function el(tag, a, parent, text){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]);
  if (text != null) e.textContent = text; (parent || svg).appendChild(e); return e; }
const f1 = v => v.toFixed(1);

/* ---- map trait space -> plot area (same as the original page) ---- */
const A = {x:180, y:58, w:600, h:400};
const xs = D.pts.map(p => p[0]), ys = D.pts.map(p => p[1]);
const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
const s = Math.min(A.w/(x1-x0), A.h/(y1-y0)), ox = A.x + (A.w - (x1-x0)*s)/2, oy = A.y + (A.h - (y1-y0)*s)/2;
const P = p => [ox + (p[0]-x0)*s, oy + (y1-p[1])*s];
const path = poly => "M" + poly.map(p => P(p).map(f1).join(",")).join("L") + "Z";

/* ---- geometry: one bisector per Delaunay edge ---- */
const ekey = (a, b) => a < b ? a + "_" + b : b + "_" + a;
const edges = new Map();
D.tri.forEach(t => { for (let k = 0; k < 3; k++) { const a = t[k], b = t[(k+1)%3]; edges.set(ekey(a, b), [Math.min(a,b), Math.max(a,b)]); } });
const near = (p, q) => Math.hypot(p[0]-q[0], p[1]-q[1]) < 1e-6;
function clipConvex(m, d, poly){            // parameter range [t0,t1] of line m + t d inside a convex polygon
  let t0 = -Infinity, t1 = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i+1) % poly.length];
    const nx = -(b[1]-a[1]), ny = b[0]-a[0];                       // edge normal
    const sign = Math.sign((poly[(i+2)%poly.length][0]-a[0])*nx + (poly[(i+2)%poly.length][1]-a[1])*ny) || 1;
    const num = ((m[0]-a[0])*nx + (m[1]-a[1])*ny) * sign, den = (d[0]*nx + d[1]*ny) * sign;
    if (Math.abs(den) < 1e-12) { if (num < 0) return null; continue; }
    const t = -num / den;
    if (den > 0) t0 = Math.max(t0, t); else t1 = Math.min(t1, t);
  }
  return t0 <= t1 ? [t0, t1] : null;
}
const BIS = [...edges.values()].map(([i, j]) => {
  const a = D.pts[i], b = D.pts[j], m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
  let d = [-(b[1]-a[1]), b[0]-a[0]]; const n = Math.hypot(...d); d = [d[0]/n, d[1]/n];
  const full = clipConvex(m, d, D.hull) || [0, 0];
  // the Voronoi edge = the boundary shared by the cells of species i and j
  const shared = D.cells[i].filter(p => D.cells[j].some(q => near(p, q)));
  let vor = null;
  if (shared.length >= 2) {
    const ts = shared.map(p => (p[0]-m[0])*d[0] + (p[1]-m[1])*d[1]);
    vor = [Math.min(...ts), Math.max(...ts)];
  }
  // the drawn bisector always starts at the edge midpoint and runs at least as far as the Voronoi piece
  // (for obtuse triangles the Voronoi piece lies beside the midpoint, not across it)
  const span = vor ? [Math.min(0, vor[0]), Math.max(0, vor[1])] : null;
  return { m, d, full, vor, span, dist: Math.hypot(m[0], m[1]) };
});
BIS.sort((p, q) => p.dist - q.dist);                       // draw from the centre outwards

/* ---- layers ---- */
const cellsG = el("g", {opacity:0});
D.cells.forEach(c => el("path", {d:path(c), class:"cellf"}, cellsG));
const delG = el("g", {});
D.tri.forEach(t => el("path", {d:path(t.map(i => D.pts[i])), class:"del"}, delG));
const bisG = el("g", {});
const exts  = BIS.map(b => el("line", {class:"ext", opacity:0}, bisG));   // dashed: midpoint -> Voronoi piece (obtuse cases only)
const lines = BIS.map(b => el("line", {class:"bis", opacity:0}, bisG));   // solid: the Voronoi piece itself
const mids = BIS.map(b => { const [x, y] = P(b.m); return el("circle", {cx:f1(x), cy:f1(y), r:3.2, class:"mid", opacity:0}, bisG); });
const hullV = el("path", {d:path(D.hull), class:"hullv", opacity:0});

/* hover a triangle (step 0 only): circumcircle + circumcentre */
const hiG = el("g", {"pointer-events":"none"});
const clip = el("clipPath", {id:"plotclip"}, el("defs", {}));
el("rect", {x:0, y:50, width:960, height:447}, clip);
const hover = el("g", {});
D.tri.forEach((t, k) => {
  const hit = el("path", {d:path(t.map(i => D.pts[i])), class:"tri-hit"}, hover);
  hit.addEventListener("mouseenter", () => {
    if (step !== 0 || busy) return;
    hiG.replaceChildren();
    const [cx, cy] = P(D.cc[k]), r = D.cc[k][2]*s;
    el("circle", {cx:f1(cx), cy:f1(cy), r:f1(r), class:"cc", "clip-path":"url(#plotclip)"}, hiG);
    el("path", {d:path(t.map(i => D.pts[i])), class:"tri-hi"}, hiG);
    el("circle", {cx:f1(cx), cy:f1(cy), r:7, class:"ccpt"}, hiG);
  });
});
hover.addEventListener("mouseleave", () => hiG.replaceChildren());
svg.appendChild(hiG);
const ptsG = el("g", {"pointer-events":"none"});
D.pts.forEach(p => { const [x, y] = P(p); el("circle", {cx:f1(x), cy:f1(y), r:6, fill:"var(--pt)", stroke:"#fff", "stroke-width":1.5}, ptsG); });

const ttl = el("text", {x:480, y:28, "text-anchor":"middle", "dominant-baseline":"central", class:"ttl"});
const cap = el("text", {x:480, y:486, "text-anchor":"middle", class:"cap"});
if (Q.get("caption") === "0") { ttl.style.display = "none"; cap.style.display = "none"; }
const TEXT = [
  ["Delaunay simplices", "Click to draw the perpendicular bisector of every edge"],
  ["Perpendicular bisectors", "Click to keep only the pieces between neighbouring circumcentres"],
  ["Voronoi tessellation", "Each cell: the trait space closer to one species than to any other"],
];

/* ---- drawing helpers ---- */
function seg(L, k, t0, t1){
  const b = BIS[k];
  if (!(t1 > t0)) { L.setAttribute("visibility", "hidden"); return; }
  L.setAttribute("visibility", "visible");
  const [ax, ay] = P([b.m[0] + t0*b.d[0], b.m[1] + t0*b.d[1]]), [bx, by] = P([b.m[0] + t1*b.d[0], b.m[1] + t1*b.d[1]]);
  L.setAttribute("x1", f1(ax)); L.setAttribute("y1", f1(ay)); L.setAttribute("x2", f1(bx)); L.setAttribute("y2", f1(by));
}
// draw the part of [t0,t1] that lies on the Voronoi piece solid, and the rest (towards the midpoint) dashed
function setLine(k, t0, t1){
  const b = BIS[k], v = b.vor;
  seg(lines[k], k, Math.max(t0, v[0]), Math.min(t1, v[1]));
  if (t0 < v[0]) seg(exts[k], k, t0, Math.min(t1, v[0]));
  else if (t1 > v[1]) seg(exts[k], k, Math.max(t0, v[1]), t1);
  else seg(exts[k], k, 0, 0);
}
const ease = t => t < .5 ? 2*t*t : 1 - (-2*t + 2) ** 2 / 2;
let step = 0, busy = false, run = 0;
function tween(ms, fn){ const id = run; return new Promise(res => { const t0 = performance.now();
  (function f(now){ if (id !== run) return res(false); const t = Math.min(1, (now - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(f) : res(true); })(t0); }); }

/* static states */
function show(k){
  run++; busy = false; step = k; hiG.replaceChildren();
  ttl.textContent = TEXT[k][0]; cap.textContent = TEXT[k][1];
  delG.setAttribute("opacity", k < 2 ? 1 : 0); cellsG.setAttribute("opacity", k === 2 ? 1 : 0); hullV.setAttribute("opacity", k === 2 ? 1 : 0);
  BIS.forEach((b, i) => {
    const on = !!b.vor && k > 0;
    lines[i].setAttribute("opacity", on ? 1 : 0); exts[i].setAttribute("opacity", on && k === 1 ? .85 : 0);
    mids[i].setAttribute("opacity", on && k === 1 ? 1 : 0);
    lines[i].style.strokeWidth = k === 2 ? 2.4 : 1.5;
    if (on) setLine(i, b.span[0], b.span[1]);
  });
}

/* step 0 -> 1: bisectors grow out of each edge midpoint, perpendicular to the edge */
async function toBisectors(){
  busy = true; step = 1; hiG.replaceChildren();
  ttl.textContent = TEXT[1][0]; cap.textContent = TEXT[1][1];
  const n = BIS.length, each = 700, stagger = 2600 / n;
  await tween(each + stagger * n, T => {
    const now = T * (each + stagger * n);
    BIS.forEach((b, i) => {
      if (!b.vor) return;
      const t = Math.max(0, Math.min(1, (now - i * stagger) / each)), e = ease(t);
      mids[i].setAttribute("opacity", t > 0 ? 1 : 0); lines[i].setAttribute("opacity", t > 0 ? 1 : 0); exts[i].setAttribute("opacity", t > 0 ? .85 : 0);
      setLine(i, b.span[0] * e, b.span[1] * e);                // grows out of the edge midpoint
    });
  });
  busy = false;
}
/* step 1 -> 2: drop the dashed extensions and the Delaunay simplices, keep the Voronoi pieces */
async function toVoronoi(){
  busy = true; step = 2;
  ttl.textContent = TEXT[2][0]; cap.textContent = TEXT[2][1];
  await tween(1100, T => {
    const e = ease(T);
    BIS.forEach((b, i) => {
      if (!b.vor) return;
      lines[i].style.strokeWidth = 1.5 + 0.9 * e;
      mids[i].setAttribute("opacity", 1 - e); exts[i].setAttribute("opacity", .85 * (1 - e));
    });
    delG.setAttribute("opacity", 1 - e);
  });
  await tween(700, T => { cellsG.setAttribute("opacity", T); hullV.setAttribute("opacity", T); });
  busy = false;
}
function advance(){
  if (busy) return;
  if (step === 0) toBisectors(); else if (step === 1) toVoronoi(); else show(0);
