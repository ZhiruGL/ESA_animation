<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two-Step Filtering</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --pt:#1f2328; --track:#d0d4d9;
  --paint:#f6caa9; --edge:#de8550;
  --bridge:#c2410c; --bridge-fill:rgba(194,65,12,.18);
  --green:#1d9e75; --green-fill:rgba(29,158,117,.28);
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --pt:#e6e8eb; --track:#3a4048;
  --paint:#7a4e33; --edge:#f0a46f;
  --bridge:#ff8a4c; --bridge-fill:rgba(255,138,76,.25);
  --green:#5dcaa5; --green-fill:rgba(93,202,165,.3);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
/* one SVG (switch included), so everything scales together; designed for 960 × 497 */
svg{display:block;width:100%;height:100%;user-select:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:18px;font-weight:800}
.pt{fill:var(--pt)}
.shape-fill{fill:var(--paint);stroke:var(--paint);stroke-width:.8;stroke-linejoin:round}
.shape-edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.layer{transition:opacity .6s ease}
.bridge{fill:var(--bridge-fill);stroke:var(--bridge);stroke-width:2.5;stroke-linejoin:round}
.green{fill:var(--green-fill);stroke:var(--green);stroke-width:2.5;stroke-linejoin:round}
.gone-b{fill:none;stroke:var(--bridge);stroke-width:1.6;stroke-dasharray:5 4;stroke-linejoin:round}
.gone-g{fill:none;stroke:var(--green);stroke-width:1.6;stroke-dasharray:5 4;stroke-linejoin:round}
.num{fill:var(--bridge);font-size:18px;font-weight:800}
.opt{fill:var(--muted);font-size:17px;font-weight:700;cursor:pointer;transition:fill .3s}
.opt.on{fill:var(--fg)}
.sw{cursor:pointer;outline:none}
.sw .track{fill:var(--track);transition:fill .3s}
.sw.on .track{fill:var(--edge)}
.sw .knob{fill:#fff;transition:transform .3s}
.sw.on .knob{transform:translateX(24px)}
.sw:focus-visible .track{stroke:var(--edge);stroke-width:2}
</style>
</head>

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);

/* ==================== one layer per state ==================== */
function shapeLayer(tris){
  const g = el("g", {class:"layer"});
  const v = tris.map(t => t.map(i => pts[i]));
