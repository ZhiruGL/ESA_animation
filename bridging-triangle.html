<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridging Triangle</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --pt:#1f2328; --track:#d0d4d9;
  --paint:#f6caa9; --edge:#de8550;
  --bridge:#c2410c; --bridge-fill:rgba(194,65,12,.18);
  --green:#1d9e75; --green-fill:rgba(29,158,117,.28);
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --pt:#e6e8eb; --track:#3a4048;
  --paint:#7a4e33; --edge:#f0a46f;
  --bridge:#ff8a4c; --bridge-fill:rgba(255,138,76,.25);
  --green:#5dcaa5; --green-fill:rgba(93,202,165,.3);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
/* one SVG (switch included), so everything scales together; designed for 960 × 497 */
svg{display:block;width:100%;height:100%;user-select:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:18px;font-weight:800}
.pt{fill:var(--pt)}
.shape-fill{fill:var(--paint);stroke:var(--paint);stroke-width:.8;stroke-linejoin:round}
.shape-edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.layer{transition:opacity .6s ease}
.bridge{fill:var(--bridge-fill);stroke:var(--bridge);stroke-width:2.5;stroke-linejoin:round}
.green{fill:var(--green-fill);stroke:var(--green);stroke-width:2.5;stroke-linejoin:round}
.gone-b{fill:none;stroke:var(--bridge);stroke-width:1.6;stroke-dasharray:5 4;stroke-linejoin:round}
.gone-g{fill:none;stroke:var(--green);stroke-width:1.6;stroke-dasharray:5 4;stroke-linejoin:round}
.num{fill:var(--bridge);font-size:18px;font-weight:800}
.opt{fill:var(--muted);font-size:17px;font-weight:700;cursor:pointer;transition:fill .3s}
.opt.on{fill:var(--fg)}
.sw{cursor:pointer;outline:none}
.sw .track{fill:var(--track);transition:fill .3s}
.sw.on .track{fill:var(--edge)}
.sw .knob{fill:#fff;transition:transform .3s}
.sw.on .knob{transform:translateX(24px)}
.sw:focus-visible .track{stroke:var(--edge);stroke-width:2}
</style>
</head>
<body>
<svg id="ov" viewBox="-135 0 960 497" preserveAspectRatio="xMidYMid meet"></svg>
<script>
(function(){
"use strict";
/* ============================================================
   A bridge that only the longest-edge step removes — no outliers.

   Two clusters of 56 species, none of them an outlier: AlphaRichness's k finder picks k = 2.25 and the MST
   rule drops no species at any k from 1.5 to 3. Companion table: bridge-table.html.
     Circumradius only        — prune_step() by circumradius stops at the green triangle (R ≈ 20.9): it is
                                the last triangle covering one of its species. It sets α. The bridge
                                (dark orange) has a smaller circumradius (≈ 20.4), so it is never reached.
     Circumradius + longest edge — prune_two_step(). The bridge has the longer longest edge (≈ 40.5 vs
                                ≈ 39.6), so Step 2 removes it — and only it — before stopping at the green
                                triangle again. Removed triangles are dashed.

   Computed in R with the package's own functions (find_stable_k, find_point_clusters, delaunay_simplices,
   compute_simplex_scores, prune_step, prune_two_step), unchanged; this page only draws the results.

   Options: state=filtered (open on the right), theme=dark|auto, bg=transparent
   Inspect: window.twoStep
   ============================================================ */
const D = {"pts": [[22.0810592818252, 46.0518623647952], [33.2045662607582, 1.24385621210666], [-13.4496153654849, -14.5154720308887], [-12.1274847798268, 32.8159091018316], [51.3865940683536, 11.0723022257657], [48.1879238770939, -21.2499567583288], [-23.8281912324131, 8.42347169327916], [18.1166847675388, -21.4608063432864], [54.813428802063, -3.82194822876483], [6.17465499148804, 16.4427493639838], [6.46352279873801, -41.3667463967225], [-8.87673631541939, 53.5980907174256], [-44.8838683849428, -20.5733910496611], [-42.325019063953, 16.2741334839458], [3.49906973133318, 34.9885801740637], [46.4497853013416, 30.1061415602599], [38.7841584240404, -39.1690112745089], [-19.2507152429208, -48.1378357993203], [-24.6407194373517, 41.8149432804848], [-41.4152209417902, -1.6677831968831], [3.24126922837887, -6.01968712343915], [2.63822681837521, -22.4555144713674], [21.6041847503431, 11.257884919031], [-30.0584508433875, -16.2461861551417], [-36.7931496018668, -38.8923118290911], [-8.20865589417847, -33.6409699218816], [22.1772885323672, -48.4345366500411], [-56.6971966823391, 9.84160065511434], [29.0401440364606, 24.5705198681147], [-23.1067171439316, -30.1293608763967], [-25.0795736241725, 24.2772926772048], [-47.9309949376423, 30.6878933091858], [18.8145364387763, -4.07893009522182], [-56.8386923602036, -7.0236625087629], [-8.26579575327037, 9.06561942481413], [0.839222920112646, -56.992783677191], [169.206994414213, 38.5984695288343], [126.471806186565, -14.2823203937043], [150.95468153549, 58.3260958038724], [148.126995062535, -52.1000187924965], [142.801690749728, 46.802691013104], [127.525555879848, 16.5687416688439], [186.161092671917, 19.1346180484941], [91.689578896317, 8.2716141935787], [154.119281508414, -12.9708473719086], [186.038571173447, 55.2276295306326], [183.687771410203, -27.4197763769156], [122.140219140008, 46.9511166470523], [138.635852564975, -6.77274423194907], [185.369554088572, 1.28239718757762], [105.556168575887, -10.8573888336396], [127.052795552279, -41.7838198780396], [100.011883096485, 35.8942339611679], [172.091865413231, -47.7876412579899], [151.805465313592, 19.0478483985273], [101.757523554927, -22.0079823997948]], "step1": [[25, 17, 35], [49, 54, 42], [29, 17, 24], [29, 25, 17], [31, 13, 27], [36, 38, 45], [36, 45, 42], [36, 54, 42], [40, 38, 47], [40, 41, 54], [40, 41, 47], [40, 36, 54], [40, 36, 38], [28, 0, 15], [48, 41, 54], [7, 26, 16], [23, 29, 24], [2, 29, 25], [2, 23, 29], [9, 28, 22], [18, 3, 11], [50, 43, 55], [50, 43, 41], [44, 39, 53], [44, 46, 53], [44, 49, 46], [44, 49, 54], [44, 48, 54], [52, 41, 47], [52, 43, 41], [10, 25, 35], [10, 26, 35], [10, 7, 26], [4, 28, 15], [4, 8, 43], [32, 7, 20], [32, 9, 20], [32, 9, 22], [12, 23, 24], [6, 2, 23], [14, 9, 3], [14, 0, 11], [14, 3, 11], [14, 28, 0], [14, 9, 28], [37, 48, 41], [37, 50, 41], [37, 44, 48], [37, 44, 51], [37, 51, 55], [37, 50, 55], [21, 10, 25], [21, 10, 7], [21, 7, 20], [21, 2, 20], [21, 2, 25], [1, 28, 22], [1, 4, 28], [1, 32, 22], [1, 4, 8], [1, 32, 7], [19, 6, 13], [19, 6, 23], [19, 27, 33], [19, 13, 27], [19, 12, 33], [19, 12, 23], [30, 6, 13], [30, 31, 13], [30, 18, 31], [30, 18, 3], [34, 2, 20], [34, 6, 2], [34, 9, 20], [34, 9, 3], [34, 30, 3], [34, 30, 6], [5, 7, 16], [5, 1, 7], [5, 1, 8]], "twoStep": [[25, 17, 35], [49, 54, 42], [29, 17, 24], [29, 25, 17], [31, 13, 27], [36, 38, 45], [36, 45, 42], [36, 54, 42], [40, 38, 47], [40, 41, 54], [40, 41, 47], [40, 36, 54], [40, 36, 38], [28, 0, 15], [48, 41, 54], [7, 26, 16], [23, 29, 24], [2, 29, 25], [2, 23, 29], [9, 28, 22], [18, 3, 11], [50, 43, 55], [50, 43, 41], [44, 39, 53], [44, 46, 53], [44, 49, 46], [44, 49, 54], [44, 48, 54], [52, 41, 47], [52, 43, 41], [10, 25, 35], [10, 26, 35], [10, 7, 26], [4, 28, 15], [32, 7, 20], [32, 9, 20], [32, 9, 22], [12, 23, 24], [6, 2, 23], [14, 9, 3], [14, 0, 11], [14, 3, 11], [14, 28, 0], [14, 9, 28], [37, 48, 41], [37, 50, 41], [37, 44, 48], [37, 44, 51], [37, 51, 55], [37, 50, 55], [21, 10, 25], [21, 10, 7], [21, 7, 20], [21, 2, 20], [21, 2, 25], [1, 28, 22], [1, 4, 28], [1, 32, 22], [1, 4, 8], [1, 32, 7], [19, 6, 13], [19, 6, 23], [19, 27, 33], [19, 13, 27], [19, 12, 33], [19, 12, 23], [30, 6, 13], [30, 31, 13], [30, 18, 31], [30, 18, 3], [34, 2, 20], [34, 6, 2], [34, 9, 20], [34, 9, 3], [34, 30, 3], [34, 30, 6], [5, 7, 16], [5, 1, 7], [5, 1, 8]], "bridges": [[4, 8, 43]], "xtri": [[44, 39, 53]], "stop1": 20.708340474971, "stop2": 39.5853451786291};
const P = new URLSearchParams(location.search);
const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");

const NS = "http://www.w3.org/2000/svg", ov = document.getElementById("ov");
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || ov).appendChild(e);
  return e;
}
const f1 = v => v.toFixed(1);
const PLOT0 = {x0:60, x1:640, y0:450, y1:70};
const RAWP = D.pts, PADR = 18;
const xs = RAWP.map(p => p[0]), ys = RAWP.map(p => p[1]);
const rx0 = Math.min(...xs) - PADR, rx1 = Math.max(...xs) + PADR, ry0 = Math.min(...ys) - PADR, ry1 = Math.max(...ys) + PADR;
const SC = Math.min((PLOT0.x1 - PLOT0.x0) / (rx1 - rx0), (PLOT0.y0 - PLOT0.y1) / (ry1 - ry0));
const OXs = PLOT0.x0 + ((PLOT0.x1 - PLOT0.x0) - (rx1 - rx0) * SC) / 2, OYs = PLOT0.y1 + ((PLOT0.y0 - PLOT0.y1) - (ry1 - ry0) * SC) / 2;
const pts = RAWP.map(p => [OXs + (p[0] - rx0) * SC, OYs + (ry1 - p[1]) * SC]);
const PLOT = {x0:60, x1:640, y0:450, y1:70};
const triPath = v => "M" + v.map(p => f1(p[0]) + "," + f1(p[1])).join("L") + "Z";
const key = v => v.map(p => f1(p[0]) + "," + f1(p[1])).sort().join(" ");

/* ==================== axes ==================== */
{
  const g = el("g", {});
  el("path", {d:`M${PLOT.x0},${PLOT.y1-6}V${PLOT.y0}H${PLOT.x1+6}`, class:"axis"}, g);
  el("path", {d:`M${PLOT.x1+12},${PLOT.y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${PLOT.x0},${PLOT.y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(PLOT.x0+PLOT.x1)/2, y:PLOT.y0+30, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${PLOT.x0-22},${(PLOT.y0+PLOT.y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}

/* ==================== one layer per state ==================== */
function shapeLayer(tris){
  const g = el("g", {class:"layer"});
  const v = tris.map(t => t.map(i => pts[i]));
  el("path", {d:v.map(triPath).join(""), class:"shape-fill"}, g);
  const cnt = new Map();
  for (const t of tris) for (let k = 0; k < 3; k++){
    const a = t[k], b = t[(k+1)%3], kk = a < b ? a+","+b : b+","+a;
    cnt.set(kk, (cnt.get(kk) || 0) + 1);
  }
  const bnd = [...cnt].filter(([, c]) => c === 1).map(([k]) => k.split(",").map(Number));
  el("path", {d:bnd.map(([i, j]) => `M${f1(pts[i][0])},${f1(pts[i][1])}L${f1(pts[j][0])},${f1(pts[j][1])}`).join(""), class:"shape-edge"}, g);
  return {g, keys:new Set(v.map(key))};
}
const before = shapeLayer(D.step1), after = shapeLayer(D.twoStep);
// highlighted triangles: solid where the state still has them, dashed where it removed them
const asV = t => t.map(i => pts[i]);
for (const st of [before, after]){
  D.bridges.forEach(t => el("path", {d:triPath(asV(t)), class:st.keys.has(key(asV(t))) ? "bridge" : "gone-b"}, st.g));
  D.xtri.forEach(t => el("path", {d:triPath(asV(t)), class:st.keys.has(key(asV(t))) ? "green" : "gone-g"}, st.g));
}
{
  const g = el("g", {});
  pts.forEach(p => el("circle", {cx:f1(p[0]), cy:f1(p[1]), r:3, class:"pt"}, g));
}
/* ==================== switch ==================== */
const SW_X = 345, SW_Y = 28;
const swG = el("g", {class:"sw", role:"switch", tabindex:0, "aria-checked":"false",
  "aria-label":"Add the longest-edge step", transform:`translate(${SW_X - 26},${SW_Y - 14})`});
el("rect", {width:52, height:28, rx:14, class:"track"}, swG);
el("circle", {cx:14, cy:14, r:11, class:"knob"}, swG);
const optA = el("text", {x:SW_X - 38, y:SW_Y, "text-anchor":"end", "dominant-baseline":"central", class:"opt"});
optA.textContent = "Circumradius only";
const optB = el("text", {x:SW_X + 38, y:SW_Y, "text-anchor":"start", "dominant-baseline":"central", class:"opt"});
optB.textContent = "Circumradius + longest edge";

let filtered = false;
function set(f){
  filtered = !!f;
  swG.classList.toggle("on", filtered); swG.setAttribute("aria-checked", filtered);
  optA.classList.toggle("on", !filtered); optB.classList.toggle("on", filtered);
  before.g.style.opacity = filtered ? 0 : 1; after.g.style.opacity = filtered ? 1 : 0;
}
swG.addEventListener("click", () => set(!filtered));
swG.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); set(!filtered); } });
optA.addEventListener("click", () => set(false));
optB.addEventListener("click", () => set(true));
set(P.get("state") === "filtered");
window.twoStep = {data:D, set, get filtered(){ return filtered; }};
})();
</script>
</body>
</html>
