<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 6 · Alpha value of each cluster</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  #tabs { display: none; gap: 6px; padding: 8px 0 0; }
  #tabs button, #play { font: inherit; font-size: 13px; color: #4d4d4d; background: #fff;
    border: 1px solid #ccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #tabs button.on { background: #4d4d4d; color: #fff; border-color: #4d4d4d; }
  #stage { position: relative; flex: 1; width: 100%; min-height: 0; display: flex;

  #play:hover, #tabs button:hover { border-color: #888; }

<body>
<div id="wrap">
  <div id="tabs"></div>
  <div id="stage"><canvas id="cv"></canvas><button id="play">▶ Play</button></div>
</div>
<script>
"use strict";
/* =====================================================================
   The Six Steps to Find the Characteristic α Value: animated
   STEP = 1..6 shows one step (starting from the end of the previous one);
   STEP = 0 shows all six with tabs and "Play all".
   ===================================================================== */
const STEP = 6;

// ---------- parameters (edit freely) ----------
const K_IQR = 2.5;        // Tukey multiplier for MST gap edges (Q3 + k*IQR)
const MIN_CLUSTER = 3;    // MST clusters with fewer points are excluded
const SPEED = 1;          // global animation speed multiplier
const AUTOPLAY = /[?&]autoplay=1/.test(location.search);

// Trait coordinates digitised from Fig. 3 (135 species)
const P = [[8.919, 8.305], [8.515, 8.223], [9.313, 8.161], [9.693, 8.027], [8.366, 7.792], [9.064, 7.765], [7.891, 7.751], [9.895, 7.666], [9.429, 7.491], [8.177, 7.419], [8.888, 7.401], [7.779, 7.363], [8.475, 7.084], [9.986, 7.081], [8.944, 6.993], [8.078, 6.973], [9.584, 6.89], [7.677, 6.792], [8.531, 6.677], [10.074, 6.676], [8.093, 6.566], [3.364, 6.543], [3.824, 6.542], [8.954, 6.516], [2.721, 6.46], [9.612, 6.44], [4.563, 6.355], [2.184, 6.32], [8.043, 6.148], [3.063, 6.07], [1.502, 6.053], [8.451, 6.018], [3.613, 6.017], [5.417, 5.978], [8.927, 5.959], [9.465, 5.956], [4.955, 5.918], [2.45, 5.906], [4.311, 5.901], [1.918, 5.889], [2.979, 5.62], [5.664, 5.575], [3.457, 5.548], [4.72, 5.501], [3.992, 5.474], [1.158, 5.47], [2.554, 5.404], [2.072, 5.364], [5.286, 5.251], [4.367, 5.222], [1.561, 5.186], [5.932, 5.124], [3.464, 5.078], [2.954, 5.063], [4.867, 5.049], [3.97, 5.015], [0.536, 4.9], [1.19, 4.9], [2.534, 4.888], [6.32, 4.882], [2.099, 4.772], [4.435, 4.775], [5.528, 4.769], [4.893, 4.601], [0.244, 4.517], [1.525, 4.452], [6.438, 4.454], [1.975, 4.338], [5.983, 4.264], [1.061, 4.216], [5.171, 4.191], [0.454, 4.073], [5.644, 3.917], [6.553, 3.885], [1.655, 3.851], [1.024, 3.754], [6.132, 3.753], [0.18, 3.707], [5.093, 3.63], [1.428, 3.358], [0.793, 3.348], [6.241, 3.272], [5.566, 3.203], [0.003, 3.125], [6.69, 3.029], [0.565, 2.936], [5.127, 2.869], [1.407, 2.856], [6.251, 2.789], [5.81, 2.713], [1.137, 2.559], [0.086, 2.554], [0.668, 2.485], [4.99, 2.423], [1.726, 2.383], [6.392, 2.34], [5.413, 2.273], [5.88, 2.201], [1.297, 2.192], [0.38, 2.079], [0.817, 2.02], [4.928, 1.969], [1.892, 1.878], [4.377, 1.797], [6.212, 1.742], [2.409, 1.724], [5.329, 1.695], [1.037, 1.589], [4.85, 1.524], [2.812, 1.517], [0.56, 1.5], [4.067, 1.475], [3.355, 1.448], [5.739, 1.432], [1.448, 1.4], [5.329, 1.2], [1.945, 1.136], [1.039, 1.038], [4.795, 1.006], [2.612, 0.921], [3.86, 0.881], [5.64, 0.872], [3.2, 0.802], [4.297, 0.79], [1.341, 0.699], [1.802, 0.548], [3.589, 0.51], [4.874, 0.499], [5.324, 0.491], [4.051, 0.423], [2.391, 0.41], [2.847, 0.099], [3.712, 0.044], [4.233, 0.001], [3.256, -0.077]];

const COL = { kept: "#9ec5e8", keptLight: "#bbd6ef", removed: "#d6604d", earlier: "#ebebeb",
  pink: "#ee82ee", pt: "#1a1a1a", text: "#4d4d4d", axis: "#333333", hi: "#1f4e79" };

const STEPS_TEXT = [
  ["1  Delaunay simplices", "Calculate Circumradius (R) and", "longest edge (L) of every triangle"],
  ["2  MST gaps", "Edge > Q3 + k * IQR are removed;", "Clusters < 3 points are excluded"],
  ["3  Circumradius filtering", "Largest R removed first; {N3} removed,", "Stopped at R = {R3}"],
  ["4  Edge-length filtering", "Longest L first; {N4} more removed,", "Stopped at L = {L4}"],
  ["5  Cluster refinement", "Steps 3-4 repeated in both clusters,", "ultimately {NC} clusters"],
  ["6  Alpha value of each cluster", "Characteristic α = largest R in each cluster", "Characteristic α values = {ALPHAS}"],
];

// =====================================================================
// GEOMETRY + ALGORITHM (everything below is computed from P)
// =====================================================================
function circumOf(a, b, c) {
  const [ax, ay] = a, [bx, by] = b, [cx, cy] = c;
  const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  const a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
  const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d;
  const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d;
  return { x: ux, y: uy, r2: (ax - ux) ** 2 + (ay - uy) ** 2 };
}

// Bowyer–Watson Delaunay triangulation
function delaunay(pts) {
  const n = pts.length;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const d = Math.max(x1 - x0, y1 - y0) * 50, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const V = pts.concat([[mx - d, my - d], [mx + d, my - d], [mx, my + d]]);
  const mk = (a, b, c) => ({ v: [a, b, c], c: circumOf(V[a], V[b], V[c]) });
  let tris = [mk(n, n + 1, n + 2)];
  for (let i = 0; i < n; i++) {
    const [px, py] = V[i], bad = [], keep = [];
    for (const t of tris) ((px - t.c.x) ** 2 + (py - t.c.y) ** 2 < t.c.r2 ? bad : keep).push(t);
    const ec = new Map();
    for (const t of bad) for (let k = 0; k < 3; k++) {
      const a = t.v[k], b = t.v[(k + 1) % 3], key = a < b ? a + "_" + b : b + "_" + a;
      ec.set(key, ec.has(key) ? null : [a, b]);
    }
    for (const e of ec.values()) if (e) keep.push(mk(e[0], e[1], i));
    tris = keep;
  }
  return tris.filter(t => t.v.every(v => v < n)).map(t => t.v);
}

const dist = (i, j) => Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]);
const ekey = (a, b) => a < b ? a + "_" + b : b + "_" + a;

function quantile7(arr, q) {            // R's default (type 7) quantile
  const s = [...arr].sort((a, b) => a - b), h = (s.length - 1) * q, lo = Math.floor(h);
  return s[lo] + (h - lo) * ((s[Math.min(lo + 1, s.length - 1)]) - s[lo]);
}

function makeUF(n) {
  const p = [...Array(n).keys()];
  const f = x => { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; };
  return { find: f, union: (a, b) => { a = f(a); b = f(b); if (a === b) return false; p[a] = b; return true; } };
}

// Top-down removal: largest key first; hard stop the first time a removal
// would leave a (non-excluded) point with no surviving triangle.
function runRemoval(alive, key, mask, exempt) {
  const cnt = new Array(P.length).fill(0);
  alive.forEach((a, i) => { if (a) for (const v of T[i]) cnt[v]++; });
  const order = T.map((_, i) => i).filter(i => alive[i] && mask[i]).sort((a, b) => key[b] - key[a]);
  const removed = [];
  for (const i of order) {
    const blocker = T[i].find(v => !exempt[v] && cnt[v] <= 1);
    if (blocker !== undefined) return { removed, stop: i, blocker };
    alive[i] = false; removed.push(i);
    for (const v of T[i]) cnt[v]--;
  }
  return { removed, stop: null, blocker: null };
}

function triComponents(alive) {          // clusters = triangles connected through shared vertices
  const uf = makeUF(P.length);
  alive.forEach((a, i) => { if (a) { uf.union(T[i][0], T[i][1]); uf.union(T[i][1], T[i][2]); } });
  const groups = new Map();
  alive.forEach((a, i) => { if (a) { const r = uf.find(T[i][0]); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(i); } });
  return [...groups.values()].sort((a, b) => b.length - a.length);
}

// ---- run the pipeline ----
const T = delaunay(P);
const NT = T.length;
const CC = T.map(t => circumOf(P[t[0]], P[t[1]], P[t[2]]));
const R = CC.map(c => Math.sqrt(c.r2));
const LE = T.map(t => {                  // longest edge of each triangle
  let best = null;
  for (let k = 0; k < 3; k++) { const a = t[k], b = t[(k + 1) % 3], d = dist(a, b); if (!best || d > best.len) best = { a, b, len: d }; }
  return best;
});
const L = LE.map(e => e.len);
const CEN = T.map(t => [(P[t[0]][0] + P[t[1]][0] + P[t[2]][0]) / 3, (P[t[0]][1] + P[t[1]][1] + P[t[2]][1]) / 3]);

// Step 2: MST of the Delaunay graph + Tukey fence on its edge lengths
const EDGES = (() => {
  const m = new Map();
  for (const t of T) for (let k = 0; k < 3; k++) { const a = t[k], b = t[(k + 1) % 3]; m.set(ekey(a, b), [Math.min(a, b), Math.max(a, b)]); }
  return [...m.values()].map(([a, b]) => ({ a, b, len: dist(a, b) })).sort((x, y) => x.len - y.len);
})();
const MST = (() => { const uf = makeUF(P.length); return EDGES.filter(e => uf.union(e.a, e.b)); })();
const mstLen = MST.map(e => e.len);
const Q1 = quantile7(mstLen, .25), Q3 = quantile7(mstLen, .75), FENCE = Q3 + K_IQR * (Q3 - Q1);
const GAPS = MST.filter(e => e.len > FENCE);
const MST_CL = (() => {
  const uf = makeUF(P.length); MST.forEach(e => { if (e.len <= FENCE) uf.union(e.a, e.b); });
  const g = new Map(); P.forEach((_, i) => { const r = uf.find(i); if (!g.has(r)) g.set(r, []); g.get(r).push(i); });
  return [...g.values()].sort((a, b) => b.length - a.length);
})();
const EXEMPT = new Array(P.length).fill(false);
MST_CL.forEach(c => { if (c.length < MIN_CLUSTER) c.forEach(v => EXEMPT[v] = true); });

// Step 3 & 4
const ALL = new Array(NT).fill(true);
const alive3 = new Array(NT).fill(true);
const S3 = runRemoval(alive3, R, ALL, EXEMPT);
const alive4 = alive3.slice();
const S4 = runRemoval(alive4, L, ALL, EXEMPT);

// Step 5: repeat steps 3-4 inside each cluster until nothing more is removed
const CLUSTERS = triComponents(alive4);
const alive5 = alive4.slice();
const S5 = CLUSTERS.map(tris => {
  const mask = new Array(NT).fill(false); tris.forEach(i => mask[i] = true);
  const events = [];
  for (let pass = 0; pass < 50; pass++) {
    const a = runRemoval(alive5, R, mask, EXEMPT); events.push({ kind: "R", ...a });
    const b = runRemoval(alive5, L, mask, EXEMPT); events.push({ kind: "L", ...b });
    if (!a.removed.length && !b.removed.length) break;
  }
  return { tris, events };
});
const FINAL_CL = triComponents(alive5);
// Step 6: characteristic alpha = largest surviving R in each cluster (ordered as in step 5)
const ALPHA = S5.map(c => {
  const alive = c.tris.filter(i => alive5[i]);
  const best = alive.reduce((b, i) => R[i] > R[b] ? i : b, alive[0]);
  return { tri: best, R: R[best] };
});
const removed5 = S5.flatMap(c => c.events.flatMap(e => e.removed));

const f2 = x => x.toFixed(2);
const FILL = {
  N3: S3.removed.length, R3: S3.stop !== null ? f2(R[S3.stop]) : "–",
  N4: S4.removed.length, L4: S4.stop !== null ? f2(L[S4.stop]) : "–",
  NC: FINAL_CL.length, ALPHAS: ALPHA.map(a => f2(a.R)).join(" / "),
};
const TEXT = STEPS_TEXT.map(s => s.map(line => line.replace(/\{(\w+)\}/g, (_, k) => FILL[k])));

// expose for inspection in the console
window.alphaDemo = { P, T, R, L, MST, FENCE, Q1, Q3, GAPS, MST_CL, S3, S4, S5, ALPHA, alive3, alive4, alive5 };
console.log("triangles", NT, "| MST fence", f2(FENCE), "| gaps", GAPS.length,
  "| step3 removed", S3.removed.length, "stop R", FILL.R3, "| step4 removed", S4.removed.length, "stop L", FILL.L4,
  "| step5 removed", removed5.length, "| alphas", FILL.ALPHAS);

// =====================================================================
// DRAWING
// =====================================================================
const W = 820, H = 900;
const XL = [-0.51, 10.71], YL = [-0.42, 8.72];
const PL = 92;                                     // plot left (px)
const SC = (W - PL - 48) / (XL[1] - XL[0]);        // px per trait unit (equal aspect)
const PT = 168, PB = PT + (YL[1] - YL[0]) * SC, PR = PL + (XL[1] - XL[0]) * SC;
const sx = x => PL + (x - XL[0]) * SC, sy = y => PB - (y - YL[0]) * SC;
const FONT = '"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif';

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let state;
function freshState() {
  return {
    step: 1,
    tri: new Array(NT).fill(null),     // fill colour per triangle (null = not drawn)
    triA: new Array(NT).fill(1),       // opacity per triangle
    mstN: 0, mstA: 1,                  // MST edges shown (in Kruskal order) and opacity
    gapA: 0,                           // opacity of the red dashed gap edges
    over: [],                          // overlay objects {draw(ctx,a), a, top}
    ring: [],                          // highlighted points {v, color, a}
    status: "",
  };
}

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")"; };
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;

function triPath(i) {
  const [a, b, c] = T[i];
  ctx.beginPath(); ctx.moveTo(sx(P[a][0]), sy(P[a][1])); ctx.lineTo(sx(P[b][0]), sy(P[b][1])); ctx.lineTo(sx(P[c][0]), sy(P[c][1])); ctx.closePath();
}
function label(text, x, y, opt = {}) {
  ctx.font = (opt.bold ? "bold " : "") + (opt.size || 17) + "px " + FONT;
  ctx.textAlign = opt.align || "left"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,.92)";
  ctx.strokeText(text, x, y); ctx.fillStyle = opt.color || "#222"; ctx.fillText(text, x, y);
}

function draw() {
  const dpr = window.devicePixelRatio || 1, s = cv.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);

  // titles
  const [title, s1, s2] = TEXT[state.step - 1];
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#000"; ctx.font = "bold 25px " + FONT; ctx.fillText(title, 60, 46);
  ctx.fillStyle = COL.text; ctx.font = "22px " + FONT; ctx.fillText(s1, 60, 92); ctx.fillText(s2, 60, 124);

  // plot contents (clipped)
  ctx.save(); ctx.beginPath(); ctx.rect(PL, PT - 6, PR - PL + 30, PB - PT + 6); ctx.clip();
  ctx.lineJoin = "round";
  for (let i = 0; i < NT; i++) {
    if (!state.tri[i]) continue;
    ctx.globalAlpha = state.triA[i];
    triPath(i); ctx.fillStyle = state.tri[i]; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.9; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (state.mstN > 0 && state.mstA > 0) {
    ctx.globalAlpha = state.mstA; ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let k = 0; k < state.mstN; k++) {
      const e = MST[k]; if (e.len > FENCE && state.gapA > 0) continue;
      ctx.moveTo(sx(P[e.a][0]), sy(P[e.a][1])); ctx.lineTo(sx(P[e.b][0]), sy(P[e.b][1]));
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (state.gapA > 0) {
    ctx.globalAlpha = state.gapA; ctx.strokeStyle = COL.removed; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); for (const e of GAPS) { ctx.moveTo(sx(P[e.a][0]), sy(P[e.a][1])); ctx.lineTo(sx(P[e.b][0]), sy(P[e.b][1])); }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  for (const o of state.over) if (!o.top && o.a > 0) { ctx.save(); ctx.globalAlpha = o.a; o.draw(ctx); ctx.restore(); }
  // points
  ctx.fillStyle = COL.pt;
  for (const [x, y] of P) { ctx.beginPath(); ctx.arc(sx(x), sy(y), 4.3, 0, 2 * Math.PI); ctx.fill(); }
  for (const r of state.ring) {
    if (r.a <= 0) continue;
    ctx.globalAlpha = r.a; ctx.strokeStyle = r.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx(P[r.v][0]), sy(P[r.v][1]), r.rad || 10, 0, 2 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const o of state.over) if (o.top && o.a > 0) { ctx.save(); ctx.globalAlpha = o.a; o.draw(ctx); ctx.restore(); }
  ctx.restore();

  // axes
  ctx.strokeStyle = COL.axis; ctx.lineWidth = 1.1; ctx.beginPath();
  ctx.moveTo(PL, PT - 6); ctx.lineTo(PL, PB); ctx.lineTo(PR, PB); ctx.stroke();
  ctx.fillStyle = COL.text; ctx.font = "17px " + FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const x of [0, 2.5, 5, 7.5, 10]) { ctx.beginPath(); ctx.moveTo(sx(x), PB); ctx.lineTo(sx(x), PB + 5); ctx.stroke(); ctx.fillText(x.toFixed(1), sx(x), PB + 9); }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (const y of [0, 2, 4, 6, 8]) { ctx.beginPath(); ctx.moveTo(PL - 5, sy(y)); ctx.lineTo(PL, sy(y)); ctx.stroke(); ctx.fillText(String(y), PL - 9, sy(y)); }
  ctx.fillStyle = "#000"; ctx.font = "21px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillText("Trait 1", (PL + PR) / 2, PB + 34);
  ctx.save(); ctx.translate(PL - 52, (PT + PB) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = "middle"; ctx.fillText("Trait 2", 0, 0); ctx.restore();

  // status line
  if (state.status) {
    ctx.fillStyle = COL.text; ctx.font = "italic 17px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(state.status, (PL + PR) / 2, PB + 84);
  }
  // legend
  const items = [[COL.kept, "= Kept"], [COL.removed, "= Removed"], [COL.earlier, "= Removed in Earlier Steps"]];
  ctx.font = "17px " + FONT; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const gap = 26, sw = 26, widths = items.map(([, t]) => sw + 6 + ctx.measureText(t).width);
  let lx = W / 2 - (widths.reduce((a, b) => a + b) + gap * 2) / 2; const ly = H - 26;
  items.forEach(([c, t], k) => { ctx.fillStyle = c; ctx.fillRect(lx, ly - 10, sw, 20); ctx.fillStyle = COL.text; ctx.fillText(t, lx + sw + 6, ly); lx += widths[k] + gap; });
}

function resize() {
  const stage = document.getElementById("stage"), dpr = window.devicePixelRatio || 1;
  const scale = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  draw();
}

// =====================================================================
// ANIMATION PRIMITIVES
// =====================================================================
let runId = 0;
const CANCEL = Symbol("cancel");
function tween(ms, fn) {
  const id = runId;
  return new Promise((res, rej) => {
    const t0 = performance.now(), dur = Math.max(1, ms / SPEED);
    function frame(now) {
      if (id !== runId) return rej(CANCEL);
      const t = Math.min(1, (now - t0) / dur);
      fn(t); draw();
      t < 1 ? requestAnimationFrame(frame) : res();
    }
    requestAnimationFrame(frame);
  });
}
const wait = ms => tween(ms, () => {});
function overlay(drawFn, top = false) { const o = { draw: drawFn, a: 0, top }; state.over.push(o); return o; }
async function fadeIn(objs, ms = 300) { objs = [].concat(objs); await tween(ms, t => objs.forEach(o => o.a = t)); }
async function fadeOut(objs, ms = 300) { objs = [].concat(objs); await tween(ms, t => objs.forEach(o => o.a = 1 - t)); state.over = state.over.filter(o => !objs.includes(o)); state.ring = state.ring.filter(o => !objs.includes(o)); }
async function recolor(ids, from, to, ms = 600) { await tween(ms, t => { const c = mix(from, to, ease(t)); ids.forEach(i => state.tri[i] = c); }); ids.forEach(i => state.tri[i] = to); }
async function clearOverlays(ms = 300) { const all = state.over.concat(state.ring); if (all.length) await fadeOut(all, ms); state.over = []; state.ring = []; }

// overlay builders
const circleOv = (i, color = "#333", dash = [6, 5]) => overlay(c => {
  c.strokeStyle = color; c.lineWidth = 1.6; c.setLineDash(dash);
  c.beginPath(); c.arc(sx(CC[i].x), sy(CC[i].y), R[i] * SC, 0, 2 * Math.PI); c.stroke(); c.setLineDash([]);
});
const outlineOv = (i, color = COL.hi, w = 2.6) => overlay(c => { triPath(i); c.strokeStyle = color; c.lineWidth = w; c.stroke(); });
const edgeOv = (a, b, color = "#111", w = 3.4) => overlay(c => {
  c.strokeStyle = color; c.lineWidth = w; c.lineCap = "round";
  c.beginPath(); c.moveTo(sx(P[a][0]), sy(P[a][1])); c.lineTo(sx(P[b][0]), sy(P[b][1])); c.stroke();
});
const textOv = (text, x, y, opt) => overlay(() => label(text, x, y, opt), true);
const ringOv = (v, color = COL.removed, rad = 10) => { const r = { v, color, a: 0, rad }; state.ring.push(r); return r; };

function radiusLabelPos(i) {    // put labels just outside the circumcircle, inside the plot
  let x = sx(CC[i].x) + R[i] * SC * 0.72 + 8, y = sy(CC[i].y) - R[i] * SC * 0.72 - 6;
  return [Math.min(Math.max(x, PL + 10), PR - 120), Math.min(Math.max(y, PT + 14), PB - 14)];
}

// =====================================================================
// END STATES (the static panels) – each step starts from the previous one
// =====================================================================
function applyEnd(k) {
  const s = freshState(); s.step = Math.max(1, k);
  if (k >= 1) s.tri.fill(COL.kept);
  if (k === 2) { s.tri.fill(COL.keptLight); s.mstN = MST.length; s.gapA = 1; }
  if (k >= 3) S3.removed.forEach(i => s.tri[i] = k === 3 ? COL.removed : COL.earlier);
  if (k >= 4) S4.removed.forEach(i => s.tri[i] = k === 4 ? COL.removed : COL.earlier);
  if (k >= 5) removed5.forEach(i => s.tri[i] = k === 5 ? COL.removed : COL.earlier);
  if (k >= 6) ALPHA.forEach(a => s.tri[a.tri] = COL.pink);
  return s;
}
function startState(k) { const s = applyEnd(k - 1); s.step = k; s.status = ""; if (k === 1) s.tri.fill(null); return s; }
function finishStep6Overlays() {          // static decorations of panel 6
  ALPHA.forEach((a, k) => { const ov = alphaOverlay(a, k); ov.forEach(o => o.a = 1); });
}

// =====================================================================
// STEP ANIMATIONS
// =====================================================================
const ANIM = {};

ANIM[1] = async () => {
  state.status = "Start: species points in trait space";
  await wait(900);
  // triangles appear in a left-to-right sweep
  state.status = "Delaunay triangulation";
  const order = T.map((_, i) => i).sort((a, b) => CEN[a][0] - CEN[b][0]);
  await tween(2600, t => {
    const n = Math.floor(ease(t) * NT);
    for (let k = 0; k < NT; k++) { const i = order[k]; state.tri[i] = k < n ? COL.kept : null; }
  });
  state.tri.fill(COL.kept);
  state.status = NT + " triangles";
  await wait(700);

  // worked examples: one big (in the hole), one ring triangle, one in the small cluster
  const pick = (fx, fy, maxR) => T.map((_, i) => i).filter(i => R[i] < maxR)
    .sort((a, b) => Math.hypot(CEN[a][0] - fx, CEN[a][1] - fy) - Math.hypot(CEN[b][0] - fx, CEN[b][1] - fy))[0];
  const examples = [pick(3.4, 3.2, 2.2), pick(5.6, 1.2, 1), pick(9.0, 7.2, 1)];
  for (const i of examples) {
    state.status = "Circumradius R and longest edge L of a triangle";
    const ol = outlineOv(i); await fadeIn(ol, 250);
    const circ = overlay(c => {
      c.strokeStyle = "#333"; c.lineWidth = 1.6; c.setLineDash([6, 5]);
      c.beginPath(); c.arc(sx(CC[i].x), sy(CC[i].y), R[i] * SC, 0, 2 * Math.PI * circ.sweep); c.stroke(); c.setLineDash([]);
      if (circ.sweep >= 1) {   // radius line to a vertex
        const v = T[i][0]; c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(sx(CC[i].x), sy(CC[i].y)); c.lineTo(sx(P[v][0]), sy(P[v][1])); c.stroke();
        c.fillStyle = "#333"; c.beginPath(); c.arc(sx(CC[i].x), sy(CC[i].y), 3, 0, 2 * Math.PI); c.fill();
      }
    });
    circ.sweep = 0; circ.a = 1;
    await tween(800, t => circ.sweep = ease(t));
    const v0 = T[i][0], rmx = (sx(CC[i].x) + sx(P[v0][0])) / 2, rmy = (sy(CC[i].y) + sy(P[v0][1])) / 2;
    const tR = textOv("R = " + f2(R[i]), rmx, rmy - 14, { bold: true, align: "center", size: 16 }); await fadeIn(tR, 250);
    await wait(500);
    const le = edgeOv(LE[i].a, LE[i].b); await fadeIn(le, 300);
    const ax = sx(P[LE[i].a][0]), ay = sy(P[LE[i].a][1]), bx = sx(P[LE[i].b][0]), by = sy(P[LE[i].b][1]);
    let nx = -(by - ay), ny = bx - ax; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const mx = (ax + bx) / 2, my = (ay + by) / 2, ccx = sx(CC[i].x), ccy = sy(CC[i].y);
    if ((mx + nx - ccx) ** 2 + (my + ny - ccy) ** 2 < (mx - ccx) ** 2 + (my - ccy) ** 2) { nx = -nx; ny = -ny; }  // point away from circumcentre
    const tL = textOv("L = " + f2(L[i]), mx + nx * 18, my + ny * 18, { bold: true, align: "center", size: 16 }); await fadeIn(tL, 250);
    await wait(1300);
    await clearOverlays(300);
  }
  // compute for every triangle
  const order2 = T.map((_, i) => i).sort((a, b) => CEN[a][0] - CEN[b][0]);
  await tween(2400, t => {
    const n = Math.floor(t * NT);
    state.status = "R and L computed: " + n + " / " + NT;
    for (let k = 0; k < NT; k++) state.tri[order2[k]] = (k < n && k > n - 14) ? mix(COL.kept, COL.hi, .45) : COL.kept;
  });
  state.tri.fill(COL.kept);
  state.status = "R and L stored for all " + NT + " triangles";
  draw();
};

ANIM[2] = async () => {
  state.status = "Minimum spanning tree (MST) of the triangulation";
  await recolor(T.map((_, i) => i), COL.kept, COL.keptLight, 600);
  await tween(3200, t => { state.mstN = Math.floor(ease(t) * MST.length); state.status = "MST: " + state.mstN + " / " + MST.length + " edges (shortest first)"; });
  state.mstN = MST.length; state.status = "MST: " + MST.length + " edges connect all " + P.length + " points";
  await wait(700);

  // inset: MST edge lengths + Tukey fence (lower-right empty corner of the plot)
  const box = { x0: sx(7.45), x1: sx(10.55), y0: sy(2.55), y1: sy(0.05) };
  const lmax = Math.max(...mstLen) * 1.06, ix = v => box.x0 + 14 + (v / lmax) * (box.x1 - box.x0 - 28);
  const jit = mstLen.map((_, k) => ((k * 7919) % 97) / 97 - .5);
  const inset = overlay(c => {
    c.fillStyle = "rgba(255,255,255,.95)"; c.strokeStyle = "#bbb"; c.lineWidth = 1;
    c.fillRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0); c.strokeRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
    const yb = box.y1 - 30, ym = (box.y0 + yb) / 2 + 10;
    c.strokeStyle = "#555"; c.beginPath(); c.moveTo(box.x0 + 14, yb); c.lineTo(box.x1 - 14, yb); c.stroke();
    c.fillStyle = COL.text; c.font = "13px " + FONT; c.textAlign = "center"; c.textBaseline = "top";
    for (let v = 0; v <= lmax; v += 0.5) { c.beginPath(); c.moveTo(ix(v), yb); c.lineTo(ix(v), yb + 4); c.stroke(); c.fillText(v.toFixed(1), ix(v), yb + 6); }
    c.textAlign = "left"; c.textBaseline = "top"; c.fillText("MST edge length", box.x0 + 10, box.y0 + 7);
    mstLen.forEach((v, k) => {
      const out = v > FENCE && inset.fence > .99;
      c.fillStyle = out ? COL.removed : "rgba(26,26,26,.55)";
      c.beginPath(); c.arc(ix(v), ym + jit[k] * 40, out ? 4 : 2.6, 0, 2 * Math.PI); c.fill();
    });
    if (inset.fence > 0) {
      const fx = ix(FENCE), h = (yb - (box.y0 + 26)) * inset.fence;
      c.strokeStyle = COL.removed; c.lineWidth = 2; c.setLineDash([4, 3]);
      c.beginPath(); c.moveTo(fx, yb); c.lineTo(fx, yb - h); c.stroke(); c.setLineDash([]);
      if (inset.fence > .99) { c.fillStyle = COL.removed; c.font = "bold 13px " + FONT; c.fillText("Q3 + k·IQR = " + f2(FENCE), fx + 6, box.y0 + 26); }
    }
  }, true);
  inset.fence = 0;
  await fadeIn(inset, 400);
  state.status = "Tukey fence on MST edge lengths: Q3 + k·IQR, k = " + K_IQR;
  await tween(900, t => inset.fence = ease(t));
  inset.fence = 1; await wait(900);

  // the gap edge(s)
  state.status = GAPS.length + " MST edge" + (GAPS.length === 1 ? "" : "s") + " longer than " + f2(FENCE) + " → removed";
  const gl = GAPS.map(e => edgeOv(e.a, e.b, COL.removed, 5));
  await fadeIn(gl, 300); await wait(250); await fadeOut(gl, 300); await fadeIn(gl, 300);
  await tween(500, t => state.gapA = t);
  await fadeOut(gl, 300);
  const gtxt = GAPS.map(e => { const mx = (P[e.a][0] + P[e.b][0]) / 2, my = (P[e.a][1] + P[e.b][1]) / 2; return textOv(f2(e.len) + " > " + f2(FENCE), sx(mx) + 8, sy(my) - 16, { bold: true, color: COL.removed, size: 16 }); });
  await fadeIn(gtxt, 300); await wait(1200);

  // clusters
  const big = MST_CL.filter(c => c.length >= MIN_CLUSTER), small = MST_CL.filter(c => c.length < MIN_CLUSTER);
  for (let k = 0; k < big.length; k++) {
    state.status = "Cluster " + (k + 1) + ": " + big[k].length + " points (≥ " + MIN_CLUSTER + ", kept)";
    const rings = big[k].map(v => ringOv(v, COL.hi, 8));
    await fadeIn(rings, 300); await wait(700); await fadeOut(rings, 300);
  }
  state.status = big.length + " clusters kept" + (small.length ? ", " + small.length + " cluster(s) < " + MIN_CLUSTER + " points excluded" : "; no cluster has < " + MIN_CLUSTER + " points");
  await clearOverlays(500);
};

async function removalSequence(res, key, keyName, ids, slowN = 5) {
  // animate a removal run produced by runRemoval()
  const n = res.removed.length;
  for (let k = 0; k < n; k++) {
    const i = res.removed[k], slow = k < slowN;
    state.status = "Removed " + (k + 1) + " · " + keyName + " = " + f2(key[i]);
    if (slow) {
      const ovs = [outlineOv(i, "#222", 2)];
      if (keyName === "R" && R[i] < 3.5) ovs.push(circleOv(i, COL.removed));
      if (keyName === "L") ovs.push(edgeOv(LE[i].a, LE[i].b, "#111", 3));
      await fadeIn(ovs, 200);
      await recolor([i], COL.kept, COL.removed, 350);
      await fadeOut(ovs, 200);
    } else {
      const dur = Math.max(45, 260 - k * 9);
      await recolor([i], COL.kept, COL.removed, dur);
    }
  }
  return n;
}
async function showStop(res, keyName, prefix = "") {
  if (res.stop === null) { state.status = prefix + "nothing left to remove"; await wait(800); return; }
  const i = res.stop, ovs = [outlineOv(i, "#222", 2.6)];
  if (keyName === "R") ovs.push(circleOv(i, "#222"));
  else ovs.push(edgeOv(LE[i].a, LE[i].b, "#111", 3.6));
  await fadeIn(ovs, 300);
  const val = keyName === "R" ? R[i] : L[i];
  state.status = prefix + "next " + keyName + " = " + f2(val) + " — removing it would leave a point with no triangle";
  const ring = ringOv(res.blocker, COL.removed, 11);
  await tween(1200, t => ring.a = 0.5 + 0.5 * Math.sin(t * Math.PI * 5));
  ring.a = 1;
  state.status = prefix + "stop at " + keyName + " = " + f2(val);
  await wait(1300);
}

ANIM[3] = async () => {
  state.status = "";
  await tween(600, t => { state.mstA = 1 - t; state.gapA = 1 - t; });
  state.mstN = 0; state.gapA = 0; state.mstA = 1;
  await recolor(T.map((_, i) => i), COL.keptLight, COL.kept, 500);
  state.status = "Triangles sorted by circumradius R, largest first";
  await wait(800);
  await removalSequence(S3, R, "R");
  await showStop(S3, "R");
  await clearOverlays(400);
  state.status = S3.removed.length + " removed, stopped at R = " + FILL.R3;
  draw();
};

ANIM[4] = async () => {
  state.status = "Removed triangles set aside";
  await recolor(S3.removed, COL.removed, COL.earlier, 700);
  state.status = "Remaining triangles sorted by longest edge L, largest first";
  await wait(900);
  await removalSequence(S4, L, "L");
  await showStop(S4, "L");
  await clearOverlays(400);
  state.status = S4.removed.length + " more removed, stopped at L = " + FILL.L4;
  draw();
};

ANIM[5] = async () => {
  state.status = "Remaining triangles form " + CLUSTERS.length + " clusters";
  if (S4.removed.length) await recolor(S4.removed, COL.removed, COL.earlier, 600);
  await wait(500);
  for (let c = 0; c < S5.length; c++) {
    const mine = new Set(S5[c].tris), others = T.map((_, i) => i).filter(i => state.tri[i] === COL.kept && !mine.has(i));
    await tween(400, t => others.forEach(i => state.triA[i] = 1 - .65 * t));
    let pass = 1;
    for (const ev of S5[c].events) {
      const tag = "Cluster " + (c + 1) + " · step " + (ev.kind === "R" ? 3 : 4) + " · ";
      state.status = tag + (ev.kind === "R" ? "largest R first" : "longest L first");
      await wait(500);
      if (ev.removed.length) await removalSequence(ev, ev.kind === "R" ? R : L, ev.kind, null, 3);
      await showStop(ev, ev.kind, tag);
      await clearOverlays(250);
    }
    const nrem = S5[c].events.reduce((s, e) => s + e.removed.length, 0);
    state.status = "Cluster " + (c + 1) + ": " + nrem + " more removed";
    await wait(900);
    await tween(400, t => others.forEach(i => state.triA[i] = .35 + .65 * t));
  }
  state.status = "Ultimately " + FINAL_CL.length + " clusters";
  draw();
};

function alphaOverlay(a, k) {
  const i = a.tri, [cx, cy] = CEN[i];
  const left = cx < 5;
  const lx = sx(cx + (left ? 1.25 : -1.45)), ly = sy(cy + (left ? -2.15 : -0.75));
  const circ = circleOv(i, COL.removed, [4, 4]);
  const lead = overlay(c => {
    c.strokeStyle = COL.pink; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(sx(cx), sy(cy)); c.lineTo(lx - 4, ly - 10); c.stroke();
  });
  const txt = overlay(c => {
    c.font = "26px " + FONT; c.textBaseline = "middle"; c.textAlign = "left";
    const a1 = "α", sub = String(k + 1), rest = " = " + f2(a.R);
    const w1 = c.measureText(a1).width; c.font = "16px " + FONT; const w2 = c.measureText(sub).width;
    c.lineJoin = "round"; c.lineWidth = 5; c.strokeStyle = "rgba(255,255,255,.9)"; c.fillStyle = COL.pink;
    c.font = "26px " + FONT; c.strokeText(a1, lx, ly); c.fillText(a1, lx, ly);
    c.font = "16px " + FONT; c.strokeText(sub, lx + w1, ly + 9); c.fillText(sub, lx + w1, ly + 9);
    c.font = "26px " + FONT; c.strokeText(rest, lx + w1 + w2, ly); c.fillText(rest, lx + w1 + w2, ly);
  }, true);
  return [circ, lead, txt];
}

ANIM[6] = async () => {
  state.status = "";
  await recolor(removed5, COL.removed, COL.earlier, 700);
  for (let k = 0; k < ALPHA.length; k++) {
    const a = ALPHA[k], tris = S5[k].tris.filter(i => alive5[i]).sort((x, y) => R[y] - R[x]);
    state.status = "Cluster " + (k + 1) + ": find the largest surviving R";
    // quick scan from small to large R, landing on the maximum
    const scan = tris.slice(0, 12).reverse();
    for (const i of scan) {
      const o = outlineOv(i, "#222", 2); o.a = 1;
      await wait(i === a.tri ? 0 : 90);
      state.over = state.over.filter(x => x !== o);
    }
    await recolor([a.tri], COL.kept, COL.pink, 500);
    const ovs = alphaOverlay(a, k);
    await fadeIn(ovs, 500);
    state.status = "Cluster " + (k + 1) + ": characteristic α = largest R = " + f2(a.R);
    await wait(1300);
  }
  state.status = "Characteristic α values = " + FILL.ALPHAS;
  draw();
};

// =====================================================================
// CONTROLS
// =====================================================================
const btn = document.getElementById("play");
let current = STEP || 1, playing = false;

function show(k, atEnd = false) {
  runId++; playing = false; current = k;
  state = atEnd ? applyEnd(k) : startState(k);
  if (atEnd) { state.step = k; if (k === 6) finishStep6Overlays(); }
  btn.textContent = atEnd ? "↺ Replay" : "▶ Play";
  document.querySelectorAll("#tabs button[data-k]").forEach(b => b.classList.toggle("on", +b.dataset.k === k));
  draw();
}
async function play(all = false) {
  show(current);
  const id = runId; playing = true; btn.textContent = "■ Stop";
  try {
    for (let k = current; k <= (all ? 6 : current); k++) {
      if (k !== current) { current = k; state = startState(k); document.querySelectorAll("#tabs button[data-k]").forEach(b => b.classList.toggle("on", +b.dataset.k === k)); draw(); await wait(700); }
      await ANIM[k]();
    }
    if (id === runId) { playing = false; btn.textContent = "↺ Replay"; }
  } catch (e) { if (e !== CANCEL) throw e; }
}
btn.onclick = () => { if (playing) show(current, true); else play(STEP === 0 && allMode); };
cv.onclick = () => { if (!playing) play(STEP === 0 && allMode); };
document.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); btn.onclick(); } });

let allMode = false;
if (STEP === 0) {
  const tabs = document.getElementById("tabs"); tabs.style.display = "flex";
  for (let k = 1; k <= 6; k++) { const b = document.createElement("button"); b.textContent = k; b.dataset.k = k; b.onclick = () => { allMode = false; show(k); }; tabs.appendChild(b); }
  const pa = document.createElement("button"); pa.textContent = "▶ Play all 1–6";
  pa.onclick = () => { allMode = true; current = 1; play(true); }; tabs.appendChild(pa);
}
window.addEventListener("resize", resize);
state = startState(current);
show(current);
resize();
if (AUTOPLAY) play(STEP === 0);
</script>
