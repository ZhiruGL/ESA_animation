<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnitude and Variation</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed;
  --pt:#1f2328; --sub:#4b5563; --hull:#2563eb; --hull-fill:rgba(37,99,235,.10); --ghost:#9aa3ad;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31;
  --pt:#e6e8eb; --sub:#b4bcc5; --hull:#60a5fa; --hull-fill:rgba(96,165,250,.14); --ghost:#5b636d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;padding:12px 16px;gap:28px}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.panel.hidden{display:none}
h2{margin:0;font-size:var(--tfs,32px);font-weight:800;letter-spacing:-.01em}
/* subtitle: change size with ?sfs=20 */
.sub{margin:4px 0 6px;font-size:var(--sfs,21px);line-height:1.25;color:var(--sub);font-weight:800;text-align:center;
  min-height:1.25em}  /* both subtitles reserve the same height so the plots stay aligned */
svg{flex:1;min-height:0;width:100%;display:block;user-select:none}

.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.pt{fill:var(--pt);stroke:var(--bg);stroke-width:1.5}
.hull{fill:var(--hull-fill);stroke:var(--hull);stroke-width:2.5;stroke-linejoin:round}
.ghost{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:5 5}
.readout{fill:var(--muted);font-size:var(--rfs,15px);font-weight:700;font-variant-numeric:tabular-nums}
.readout tspan.val{fill:var(--hull)}
</style>
</head>
<body>
  <section class="panel" id="pMag">
    <h2>Magnitude</h2>
    <div class="sub">How much trait space is occupied</div>
    <svg id="svgMag" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Magnitude: hull changes as species move"></svg>
  </section>
  <section class="panel" id="pVar">
    <h2>Variation</h2>
    <div class="sub">How are points distributed</div>
    <svg id="svgVar" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="Variation: same hull, interior species move"></svg>
  </section>

<script>
(function(){
"use strict";
/* ============================================================
   Options
     panel=magnitude | variation | both (default both)
     channel=...   shared with controls.html (default "magvar")
     n, seed, shape, gap — must match traits-to-traitspace.html to get the same points
     speed         animation speed multiplier
     area=0        hide the hull-area readout
     amp           how far interior species wander in Variation (px, default 48)
     afs / tfs / sfs / rfs   axis-label / title / subtitle / readout font size (px)
     theme, bg=transparent
   ============================================================ */
const P = new URLSearchParams(location.search);
const N = Math.max(3, Math.min(100, parseInt(P.get("n")) || 20));
const SEED = parseInt(P.get("seed")) || 7;
const SHAPE = P.get("shape") || "round";
const MIN_GAP = parseFloat(P.get("gap")) || 30;
const SPEED = Math.max(.25, Math.min(4, parseFloat(P.get("speed")) || 1));
const SHOW_AREA = P.get("area") !== "0";

const root = document.documentElement;
const theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "tfs", "rfs", "sfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");
const PANEL = (P.get("panel") || "both").toLowerCase();
if (PANEL.startsWith("mag")) document.getElementById("pVar").classList.add("hidden");
if (PANEL.startsWith("var")) document.getElementById("pMag").classList.add("hidden");

/* ==================== geometry (identical to traits-to-traitspace.html) ==================== */
const W = 480, H = 400, M = {l:44, r:20, t:20, b:44};
const x0 = M.l, x1 = W - M.r, y0 = H - M.b, y1 = M.t;

/* ==================== same point pattern as the trait-space plot ==================== */
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(SEED);
const gauss = () => { const u = 1 - rnd(), v = rnd(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); };
function samplePoint(){
  let u, v;
  if (SHAPE === "square"){ u = .2 + .6*rnd(); v = .2 + .6*rnd(); }
  else if (SHAPE === "gauss"){ u = .5 + .14*gauss(); v = .5 + .14*gauss(); }
  else { const r = .34*Math.sqrt(rnd()), th = 2*Math.PI*rnd(); u = .5 + r*Math.cos(th); v = .5 + r*Math.sin(th); }
  return {u: Math.min(.95, Math.max(.05, u)), v: Math.min(.95, Math.max(.05, v))};
}
const PTS = [];
{
  let gap = MIN_GAP, tries = 0;
  while (PTS.length < N){
    const c = samplePoint();
    const ok = PTS.every(p => Math.hypot((p.u - c.u)*(x1 - x0), (p.v - c.v)*(y0 - y1)) >= gap);
    if (ok){ PTS.push(c); tries = 0; }
    else if (++tries > 2000){ gap *= .95; tries = 0; }
  }
}
const BASE = PTS.map(p => [x0 + p.u*(x1 - x0), y0 - p.v*(y0 - y1)]);   // screen coords

/* ==================== geometry helpers ==================== */
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
// convex hull (Andrew's monotone chain); returns indices into pts
function hullIdx(pts){
  const idx = pts.map((_, i) => i).sort((a, b) => pts[a][0] - pts[b][0] || pts[a][1] - pts[b][1]);
  const lower = [], upper = [];
  for (const i of idx){ while (lower.length >= 2 && cross(pts[lower[lower.length-2]], pts[lower[lower.length-1]], pts[i]) <= 0) lower.pop(); lower.push(i); }
  for (let k = idx.length - 1; k >= 0; k--){ const i = idx[k]; while (upper.length >= 2 && cross(pts[upper[upper.length-2]], pts[upper[upper.length-1]], pts[i]) <= 0) upper.pop(); upper.push(i); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
const polyArea = poly => Math.abs(poly.reduce((s, p, k) => { const q = poly[(k+1) % poly.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
const pathOf = poly => "M" + poly.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
const lerp = (a, b, t) => [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
const centroid = pts => pts.reduce((c, p) => [c[0] + p[0]/pts.length, c[1] + p[1]/pts.length], [0, 0]);

const HULL0 = hullIdx(BASE);                         // hull vertices of the original layout
const HULL0_POLY = HULL0.map(i => BASE[i]);
const AREA0 = polyArea(HULL0_POLY);
const C0 = centroid(BASE);

/* ==================== keyframes ==================== */
// Magnitude: every species moves; the community spreads out, then pulls in, then returns.
const scaleAbout = (pts, sx, sy) => pts.map(p => [C0[0] + (p[0]-C0[0])*sx, C0[1] + (p[1]-C0[1])*sy]);
const MAG_KEYS = [
  BASE,
  scaleAbout(BASE, 1.32, 1.22),   // larger occupied space
  scaleAbout(BASE, 0.62, 0.70),   // smaller occupied space
  BASE
];

// Variation: hull species stay put, so the hull is identical at every moment. Each interior
// species wanders on its own smooth path (its own directions, speeds and phases), so points
// move individually rather than as a group. Paths start at offset 0, so t = 0 is the original layout.
const isHull = new Set(HULL0);
const wrnd = mulberry32(SEED * 7919 + 13);            // separate RNG: doesn't disturb the point pattern
const WANDER_AMP = parseFloat(P.get("amp")) || 48;    // how far species roam (SVG px)
const WANDER = BASE.map((_, i) => isHull.has(i) ? null : Array.from({length:2}, () => {
  const th = 2*Math.PI*wrnd();                       // direction of this component
  return { dx: Math.cos(th), dy: Math.sin(th),
           a: WANDER_AMP * (.45 + .55*wrnd()),        // amplitude
           w: (2*Math.PI) / (3800 + 4200*wrnd()),     // angular speed (period 3.8–8 s)
           ph: 0 };
}));
// keep a point inside the original hull, at least MARGIN px from every edge
const MARGIN = 9;
// orientation of the hull polygon in screen coordinates: +1 if the interior is on the left of each edge
const ORIENT = Math.sign(HULL0_POLY.reduce((acc, p, k) => { const q = HULL0_POLY[(k+1) % HULL0_POLY.length]; return acc + (p[0]*q[1] - q[0]*p[1]); }, 0));
// smallest signed distance from p to the hull's edges (positive = inside)
function insideBy(p){
  let m = Infinity;
  for (let k = 0; k < HULL0_POLY.length; k++){
    const a = HULL0_POLY[k], b = HULL0_POLY[(k+1) % HULL0_POLY.length];
    const d = ORIENT * cross(a, b, p) / Math.hypot(b[0]-a[0], b[1]-a[1]);
    if (d < m) m = d;
  }
  return m;
}
function clampInside(p){
  if (insideBy(p) >= MARGIN) return p;
  let lo = 0, hi = 1;                                 // binary search along the segment toward the centroid
  for (let it = 0; it < 18; it++){
    const mid = (lo + hi) / 2;
    if (insideBy(lerp(p, C0, mid)) >= MARGIN) hi = mid; else lo = mid;
  }
  return lerp(p, C0, hi);
}
function wanderAt(t){
  return BASE.map((p, i) => {
    const comps = WANDER[i];
    if (!comps) return p;                             // hull species: fixed
    let x = p[0], y = p[1];
    for (const c of comps){ const s = c.a * Math.sin(c.w * t + c.ph); x += c.dx * s; y += c.dy * s; }
    return clampInside([x, y]);
  });
}

/* ==================== drawing ==================== */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawAxes(svg){
  const g = el("g", {}, svg);
  el("path", {d:`M${x0},${y1-6}V${y0}H${x1+6}`, class:"axis"}, g);
  el("path", {d:`M${x1+12},${y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${x0},${y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(x0+x1)/2, y:H-10, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${x0-16},${(y0+y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
function makePanel(svgId, ghost){
  const svg = document.getElementById(svgId);
  drawAxes(svg);
  if (ghost) el("path", {d:pathOf(HULL0_POLY), class:"ghost"}, svg);   // reference: original hull
  const hull = el("path", {class:"hull"}, svg);
  const gPts = el("g", {}, svg);
  const dots = BASE.map(() => el("circle", {r:5, class:"pt"}, gPts));
  let readout = null, val = null;
  if (SHOW_AREA){
    readout = el("text", {x:x1, y:y1+4, "text-anchor":"end", class:"readout"}, svg);
    val = el("tspan", {class:"val"}, readout);
    readout.appendChild(document.createTextNode(" of the original hull area"));
  }
  return {
    render(pts){
      const hi = hullIdx(pts), poly = hi.map(i => pts[i]);
      hull.setAttribute("d", pathOf(poly));
      dots.forEach((d, i) => { d.setAttribute("cx", pts[i][0].toFixed(1)); d.setAttribute("cy", pts[i][1].toFixed(1)); });
      if (val) val.textContent = Math.round(100 * polyArea(poly) / AREA0) + "%";
    }
  };
}
const magPanel = makePanel("svgMag", true);
const varPanel = makePanel("svgVar", false);

/* ==================== timeline ==================== */
// Each step: move for MOVE ms, then hold for HOLD ms. Loops while playing.
const MOVE = 1300, HOLD = 900, STEP = MOVE + HOLD;
const NSTEP = MAG_KEYS.length - 1;          // 3 transitions per cycle
const CYCLE = NSTEP * STEP;
const ease = k => k < .5 ? 2*k*k : 1 - (-2*k + 2)**2 / 2;

function poseAt(keys, t){
  const tc = ((t % CYCLE) + CYCLE) % CYCLE;
  const s = Math.floor(tc / STEP), within = tc - s*STEP;
  const k = ease(Math.min(1, within / MOVE));
  const a = keys[s], b = keys[s+1];
  return a.map((p, i) => lerp(p, b[i], k));
}

let t = 0, playing = false, last = 0;
function frame(now){
  if (!playing) return;
  t += (now - last) * SPEED; last = now;
  draw();
  requestAnimationFrame(frame);
}
function draw(){
  magPanel.render(poseAt(MAG_KEYS, t));
  varPanel.render(wanderAt(t));
}
function setPlay(want){
  if (want && !playing){ playing = true; last = performance.now(); requestAnimationFrame(frame); }
  else if (!want && playing){ playing = false; }
  postStatus();
}
function reset(){ playing = false; t = 0; draw(); postStatus(); }

/* ==================== controls.html link ==================== */
// Own channel ("magvar") so this slide never reacts to the trait-space slide's buttons.
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "magvar") : null;
function postStatus(){ if (bc) bc.postMessage({cmd:"status", arg:{playing, placed:0, N:1}}); }
const ACTIONS = { setPlay, reset, ping: postStatus };
if (bc) bc.onmessage = e => { const f = e.data && ACTIONS[e.data.cmd]; if (f) f(e.data.arg); };

/* ==================== init ==================== */
draw(); postStatus();
if (P.get("autoplay") === "1") setPlay(true);
})();
</script>
</body>
</html>
