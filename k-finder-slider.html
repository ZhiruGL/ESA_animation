<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>k Finder Slider</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --grid:#e3e6ea;
  --paint:#f6caa9; --edge:#de8550; --hot:#d9480f; --pt:#1f2328; --mst:#9aa3ad;
  --band:#eef0f3; --track:#d0d4d9;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --grid:#2a3038;
  --paint:#7a4e33; --edge:#f0a46f; --hot:#ff8a4c; --pt:#e6e8eb; --mst:#5b636d;
  --band:#1d232a; --track:#3a4048;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
/* everything (slider, both plots) is one SVG, so it scales as one picture; designed for 960 × 497 */
svg{display:block;width:100%;height:100%;user-select:none;touch-action:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:18px;font-weight:800}
.tick{fill:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tickline{stroke:var(--muted);stroke-width:1}
.mst{stroke:var(--mst);stroke-width:1.4;fill:none}
.gap{stroke:var(--hot);stroke-width:2;stroke-dasharray:5 4;fill:none}
.pt{fill:var(--pt)}
.out{fill:var(--hot);stroke:var(--bg);stroke-width:1.5}
.out-ring{fill:none;stroke:var(--hot);stroke-width:1.5}
.band{fill:var(--band)}
.step{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linejoin:round}
.chosen{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.cur{stroke:var(--hot);stroke-width:2}
.cur-dot{fill:var(--hot);stroke:var(--bg);stroke-width:2}
.note{fill:var(--muted);font-size:13px}
.track{fill:var(--track)}
.fill{fill:var(--hot)}
.knob{fill:#fff;stroke:var(--hot);stroke-width:2.5;cursor:grab}
.knob:active{cursor:grabbing}
.kval{fill:var(--fg);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kval .num{fill:var(--hot)}
.slider-hit{fill:transparent;cursor:pointer}
.slider:focus{outline:none}
.slider:focus-visible .knob{stroke-width:4}
.readout{fill:var(--fg);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>

  const pt = ov.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;

  return K_MIN + (Math.max(SL.x0, Math.min(SL.x1, p.x)) - SL.x0) / (SL.x1 - SL.x0) * (K_MAX - K_MIN);
}
let dragging = false;
slider.addEventListener("pointerdown", ev => { dragging = true; slider.setPointerCapture(ev.pointerId); set(kFromEvent(ev)); slider.focus(); });
slider.addEventListener("pointermove", ev => { if (dragging) set(kFromEvent(ev)); });
slider.addEventListener("pointerup", () => { dragging = false; });
slider.addEventListener("pointercancel", () => { dragging = false; });
slider.addEventListener("keydown", ev => {
  const kv = D.k[cur], big = ev.shiftKey ? 0.1 : STEP;
  const map = {ArrowRight:kv + big, ArrowUp:kv + big, ArrowLeft:kv - big, ArrowDown:kv - big, Home:K_MIN, End:K_MAX};
  if (ev.key in map){ ev.preventDefault(); set(map[ev.key]); }
});
// double-click the slider to jump back to the chosen k
slider.addEventListener("dblclick", () => set(D.chosen));

set(parseFloat(P.get("k")) || D.chosen);
window.kSlider = {data:D, set, get k(){ return D.k[cur]; }};
})();
</script>
