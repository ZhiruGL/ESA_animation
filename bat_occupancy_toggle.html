<title>Bat Occupancy 1500 m</title>
<style>
:root{--ink:#1f1f1f;--muted:#5c5c5c;--paper:#fff;--alpha:#4682b4;--loc:#262626;--locfill:#e2e2e2;--glob:#c26a1b;--globfill:#f6e9da}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:28px 16px 36px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}
h1{font-size:26px;margin:0}
.switch{display:inline-flex;align-items:center;gap:12px;font-weight:600;cursor:pointer;user-select:none;border:0;background:none;font:inherit;color:inherit;padding:0}
.switch .lbl{opacity:.4;transition:opacity .2s}
.switch .lbl.on{opacity:1}
.track{width:54px;height:30px;border-radius:15px;background:var(--loc);position:relative;transition:background .25s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s}
.switch[aria-checked=true] .track{background:var(--glob)}
.switch[aria-checked=true] .track::after{transform:translateX(24px)}
.switch:focus-visible .track{outline:2px solid var(--alpha);outline-offset:2px}
.readout{margin:4px 0 6px}
.readout .v{font-size:34px;font-weight:700}
.readout .eq{color:var(--muted)}
svg{width:100%;height:auto;display:block}
svg .fade{transition:opacity .35s}
.key{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted);margin-top:6px}
.key span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:13px;display:inline-block;border-radius:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
</style></head><body><main>
<div class="top">
  <h1>Occupancy at 1500 m</h1>
  <button class="switch" role="switch" aria-checked="false" id="sw">
    <span class="lbl on" id="ll">Local</span><span class="track"></span><span class="lbl" id="lg">Global</span>
  </button>
</div>
<div class="readout"><span class="v" id="v"></span> <span class="eq" id="eq"></span></div>
<svg id="plot" viewBox="0 0 800 700" role="img" aria-label="Alpha shape of the 1500 m bat community with its local or global convex hull"></svg>
<div class="key">
  <span><i class="sw" style="background:var(--alpha)"></i>α-shape</span>
  <span id="k"></span>
  <span>✕ dropped by the MST rule</span>
</div>
</main>
