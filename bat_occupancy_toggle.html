<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bat Occupancy 1500 m</title>
<style>
:root{--ink:#1f1f1f;--muted:#5c5c5c;--paper:#fff;--alpha:#4682b4;--loc:#262626;--locfill:#e2e2e2;--glob:#c26a1b;--globfill:#f6e9da}
*{box-sizing:border-box}

html.transparent,html.transparent body{background:transparent}
/* one SVG (plot, switch, readout and key), so the whole slide scales as a picture; designed for 960 × 497 */
svg{display:block;width:100%;height:100%;user-select:none}
.fade{transition:opacity .35s}
.title{font-size:26px;font-weight:700;fill:var(--ink)}
.lbl{font-size:18px;font-weight:600;fill:var(--ink);opacity:.4;transition:opacity .2s;cursor:pointer}
.lbl.on{opacity:1}
.sw{cursor:pointer;outline:none}
.sw .track{fill:var(--loc);transition:fill .25s}
.sw.on .track{fill:var(--glob)}
.sw .knob{fill:#fff;transition:transform .25s}
.sw.on .knob{transform:translateX(24px)}
.sw:focus-visible .track{stroke:var(--alpha);stroke-width:2}
.big{font-size:30px;font-weight:700;fill:var(--ink)}
.eq{font-size:17px;fill:var(--muted)}
.key{font-size:15px;fill:var(--muted)}
</style></head><body>
<svg id="plot" viewBox="0 0 960 497" preserveAspectRatio="xMidYMid meet" role="img"

<script>

yroptera tricolor": [-0.20377, -0.10553, "AI"], "Eptesicus brasiliensis": [-0.27048, 0.01548, "AI"], "Eptesicus chiriquinus": [-0.2804, 0.03721, "AI"], "Eptesicus furinalis": [-0.29426, 0.00686, "AI"], "Lasiurus blossevillii": [-0.29293, 0.03292, "AI"], "Lasiurus ega": [-0.27198, 0.04384, "AI"], "Myotis albescens": [-0.28963, -0.00879, "AI"], "Myotis keaysi": [-0.30824, -0.00806, "AI"], "Myotis nigricans": [-0.21955, 0.00974, "AI"], "Myotis oxyotus": [-0.30217, -0.0165, "AI"], "Myotis riparius": [-0.30396, -0.00957, "AI"], "Myotis simus": [-0.30171, 0.00467, "AI"]}, "band": {"n": 26, "alpha": 0.03169, "lhull": 0.11298, "ghull": 0.308778, "species": ["Myotis keaysi", "Dermanura glauca", "Platyrrhinus masu", "Enchisthenes hartii", "Micronycteris megalotis", "Chiroderma salvini", "Anoura caudifer", "Sturnira magna", "Platyrrhinus nigellus", "Carollia brevicauda", "Sturnira lilium", "Myotis riparius", "Mesophylla macconnelli", "Platyrrhinus helleri", "Platyrrhinus infuscus", "Mimon crenulatum", "Lonchophylla thomasi", "Carollia perspicillata", "Sturnira oporaphilum", "Anoura geoffroyi", "Eptesicus furinalis", "Anoura cultrata", "Sturnira erythromos", "Vampyressa melissa", "Platyrrhinus albericoi", "Carollia manu"], "dropped": ["Lonchophylla thomasi"], "tri": [[-0.30396, -0.00957, -0.29426, 0.00686, -0.30824, -0.00806], [0.15234, 0.02584, 0.06936, 0.0759, 0.09804, 0.0954], [0.17587, 0.10241, 0.19813, 0.11429, 0.18318, 0.10286], [0.06224, -0.14027, 0.06781, -0.06225, 0.09098, -0.06426], [0.08417, -0.00624, 0.15234, 0.02584, 0.06936, 0.0759], [0.08417, -0.00624, 0.06936, 0.0759, -0.03918, -0.00617], [0.08417, -0.00624, 0.06781, -0.06225, -0.03918, -0.00617], [0.08417, -0.00624, 0.06781, -0.06225, 0.09098, -0.06426], [0.14973, 0.07509, 0.15234, 0.02584, 0.09804, 0.0954], [0.04866, -0.14351, 0.06781, -0.06225, -0.04531, -0.14414], [0.04866, -0.14351, 0.06224, -0.14027, 0.06781, -0.06225], [0.14644, -0.02347, 0.08417, -0.00624, 0.09098, -0.06426], [0.14644, -0.02347, 0.08417, -0.00624, 0.15234, 0.02584], [0.21071, 0.09438, 0.19581, -0.00982, 0.15234, 0.02584], [0.21071, 0.09438, 0.19813, 0.11429, 0.18318, 0.10286], [0.21071, 0.09438, 0.19813, 0.11429, 0.23548, 0.13013], [0.16843, 0.09301, 0.17587, 0.10241, 0.18318, 0.10286], [0.16843, 0.09301, 0.21071, 0.09438, 0.18318, 0.10286], [0.16843, 0.09301, 0.17587, 0.10241, 0.09804, 0.0954], [0.16843, 0.09301, 0.14973, 0.07509, 0.09804, 0.0954], [0.16843, 0.09301, 0.14973, 0.07509, 0.15234, 0.02584], [0.16843, 0.09301, 0.21071, 0.09438, 0.15234, 0.02584], [0.15588, -0.01804, 0.19581, -0.00982, 0.15234, 0.02584], [0.15454, -0.02921, 0.14644, -0.02347, 0.09098, -0.06426], [0.15454, -0.02921, 0.15588, -0.01804, 0.19581, -0.00982], [0.15108, -0.01934, 0.14644, -0.02347, 0.15234, 0.02584], [0.15108, -0.01934, 0.15588, -0.01804, 0.15234, 0.02584], [0.15108, -0.01934, 0.15454, -0.02921, 0.14644, -0.02347], [0.15108, -0.01934, 0.15454, -0.02921, 0.15588, -0.01804]]}}, P = D.pool, B = D.band, names = Object.keys(P);
const Q = new URLSearchParams(location.search);
if (Q.get("bg") === "transparent") document.documentElement.classList.add("transparent");
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("plot");
function el(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  (parent || svg).appendChild(e); return e;
}

/* ---- plot area (left) ---- */
const PL = {x:16, y:12, w:560, h:473};
const xs = names.map(n=>P[n][0]), ys = names.map(n=>P[n][1]), pad = 0.03;
const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad, y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
const s=Math.min(PL.w/(x1-x0), PL.h/(y1-y0)), ox=PL.x+(PL.w-(x1-x0)*s)/2, oy=PL.y+(PL.h-(y1-y0)*s)/2;
const X=x=>ox+(x-x0)*s, Y=y=>oy+(y1-y)*s;
function hull(pts){const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
 for(const q of p.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
 return lo.slice(0,-1).concat(up.slice(0,-1));}
const poly=pts=>pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
const inBand=new Set(B.species), drop=new Set(B.dropped);

const G = el("g", {class:"fade"});
el("polygon", {points:poly(hull(names.map(n=>[P[n][0],P[n][1]]))), fill:"var(--globfill)", stroke:"var(--glob)", "stroke-width":2, "stroke-dasharray":"7 5"}, G);
for (const n of names) if (!inBand.has(n)) el("title", {}, el("circle", {cx:X(P[n][0]), cy:Y(P[n][1]), r:4.5, fill:"var(--glob)"}, G), n);

el("polygon", {points:poly(hull(B.species.map(n=>[P[n][0],P[n][1]]))), fill:"var(--locfill)", stroke:"var(--loc)", "stroke-width":2, "stroke-dasharray":"7 5"}, L);
for (const t of B.tri) el("polygon", {points:poly([[t[0],t[1]],[t[2],t[3]],[t[4],t[5]]]), fill:"var(--alpha)", stroke:"var(--alpha)", "stroke-width":0.8});

  if (drop.has(n)) el("title", {}, el("path", {d:`M${cx-6},${cy-6}L${cx+6},${cy+6}M${cx-6},${cy+6}L${cx+6},${cy-6}`, stroke:"var(--loc)", "stroke-width":2.2}), n);
  else el("title", {}, el("circle", {cx, cy, r:5, fill:"var(--loc)"}), n); }

/* ---- text column (right) ---- */

el("circle", {cx:15, cy:15, r:12, class:"knob"}, swG);
const lg = el("text", {x:RX+130, y:120, class:"lbl", "dominant-baseline":"central"}, null, "Global");

const big2 = el("text", {x:RX, y:240, class:"big"});
const eq = el("text", {x:RX, y:272, class:"eq"});

const hk1 = el("rect", {x:0, y:-11, width:22, height:13, rx:2, "stroke-width":1.5, "stroke-dasharray":"4 3"}, hullKey);
const hkDot = el("circle", {cx:34, cy:-4.5, r:4.5, fill:"var(--glob)"}, hullKey);
const hkText = el("text", {x:32, y:0, class:"key"}, hullKey);
const dk = el("g", {transform:"translate(0,64)"}, K);
el("path", {d:"M5,-10L17,2M5,2L17,-10", stroke:"var(--loc)", "stroke-width":2.2}, dk);
el("text", {x:32, y:0, class:"key"}, dk, "dropped by the MST rule");

function set(global){
  swG.classList.toggle("on", global); swG.setAttribute("aria-checked", global);
  G.style.opacity = global?1:0; L.style.opacity = global?0:1;
  ll.classList.toggle("on", !global); lg.classList.toggle("on", global);
  const den = global?B.ghull:B.lhull;
  big1.textContent = (global?"Global":"Local") + " occupancy";
  big2.textContent = "= " + (100*B.alpha/den).toFixed(1) + "%";
  eq.textContent = `(${B.alpha.toFixed(3)} ÷ ${den.toFixed(3)})`;
  hk1.setAttribute("fill", global?"var(--globfill)":"var(--locfill)"); hk1.setAttribute("stroke", global?"var(--glob)":"var(--loc)");
  hkDot.style.display = global?"":"none";
  hkText.setAttribute("x", global?46:32);
  hkText.textContent = global ? "regional pool and its hull" : "hull of the 1500 m species";
}
