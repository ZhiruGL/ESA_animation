<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convex Hull to Alpha Shape</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#8a919a; --line:#e8eaed;
  --pt:#1f2328; --hull:#2563eb; --hull-fill:rgba(37,99,235,.10); --ghost:#9aa3ad;
}
:root[data-theme="dark"]{
  --bg:#111418; --fg:#e6e8eb; --muted:#8b939c; --line:#262b31;
  --pt:#e6e8eb; --hull:#60a5fa; --hull-fill:rgba(96,165,250,.14); --ghost:#5b636d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.transparent,html.transparent body{background:transparent}
body{display:flex;flex-direction:column;align-items:center;padding:12px 16px}
svg{flex:1;min-height:0;width:100%;display:block;user-select:none}
.axis{stroke:var(--muted);stroke-width:1.5;fill:none}
.arrow{fill:var(--muted)}
.axis-title{fill:var(--fg);font-size:var(--afs,20px);font-weight:800}
.pt{fill:var(--pt);stroke:var(--bg);stroke-width:1.5}
.shape{fill:var(--hull-fill);fill-rule:evenodd;stroke:var(--hull);stroke-width:2.5;stroke-linejoin:round;transition:opacity 320ms ease}
.shape.off{opacity:0}
.readout{fill:var(--muted);font-size:var(--rfs,15px);font-weight:700;font-variant-numeric:tabular-nums}
.readout tspan.val{fill:var(--hull)}
/* toggle (same instrument as geometric-toggle-alter.html) */
.control{display:flex;align-items:center;gap:10px;margin-top:6px;user-select:none}
.control-label{font-size:var(--cfs,16px);color:var(--muted);letter-spacing:.02em;width:110px;cursor:pointer;transition:color 200ms ease}
.control-label.left{text-align:right}
.control-label.right{text-align:left}
.control-label.active{color:var(--fg);font-weight:600}
.switch{position:relative;width:54px;height:22px;background:var(--line);border-radius:11px;border:1px solid var(--ghost);cursor:pointer;flex:none}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ghost);transition:transform 260ms cubic-bezier(.4,0,.2,1)}
.switch.on .knob{transform:translateX(32px);background:var(--hull)}
.switch:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
</style>
</head>
<body>
  <svg id="svg" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet" aria-label="The evenly spaced community outlined by its convex hull or its alpha shape"></svg>
  <div class="control">
    <span class="control-label left active" id="lHull">Convex hull</span>
    <div class="switch" id="sw" role="switch" aria-checked="false" tabindex="0" aria-label="Convex hull or alpha shape"><div class="knob"></div></div>
    <span class="control-label right" id="lAlpha">α-shape</span>
  </div>

<script>
(function(){
"use strict";
/* ============================================================
   The evenly spaced 20-species community of evenness-divergence.html (its "High evenness" state;
   same points and same alpha shape), outlined by its convex hull or by its alpha shape, switched with a toggle.

   Alpha shape: computed in R with AlphaRichness, unchanged (alpha_richness(); k = 2.29 from
   find_stable_k()), stored below as the kept Delaunay simplices (0-based point indices).
   One cluster, no species left out; 22 of 31 Delaunay simplices kept.
   Readout: outline area as a % of the convex hull area.

   Options
     outline=alpha  start on the alpha shape (default: convex hull)
     area=0         hide the area readout
     afs / rfs / cfs  axis-label / readout / toggle-label font size (px)
     theme=dark|auto, bg=transparent
     channel=...    BroadcastChannel name (default "hullalpha"); message {cmd:"set", arg:true (α-shape) | false (hull)}
   ============================================================ */
const DATA = {"pts":[[253.8,171.1],[207.99,295.17],[177.12,156.67],[258.11,110.15],[241.74,267.64],[292.15,149.89],[129.19,199.52],[218.26,133.96],[169.6,208.12],[330.99,172.14],[292.06,204.09],[197.92,243.35],[365.99,207.98],[376.64,162.17],[248.45,223.19],[192.6,89.95],[213.11,190.74],[284.66,260.57],[326,232.09],[324.77,283.29]],"simp":[[12,9,13],[8,16,11],[7,16,0],[7,3,0],[14,16,0],[14,16,11],[4,14,17],[4,11,1],[4,14,11],[18,12,9],[18,17,19],[5,3,0],[2,8,16],[2,7,16],[2,8,6],[2,7,15],[10,18,9],[10,5,0],[10,5,9],[10,14,0],[10,14,17],[10,18,17]],"k":2.29,"area":23675.8};

const P = new URLSearchParams(location.search);
const root = document.documentElement, theme = P.get("theme");
if (theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) root.dataset.theme = "dark";
if (P.get("bg") === "transparent") root.classList.add("transparent");
for (const k of ["afs", "rfs", "cfs"]) if (parseFloat(P.get(k)) > 0) root.style.setProperty("--" + k, parseFloat(P.get(k)) + "px");

const W = 480, H = 400, M = {l:44, r:20, t:20, b:44};
const x0 = M.l, x1 = W - M.r, y0 = H - M.b, y1 = M.t;
const pts = DATA.pts, f1 = v => v.toFixed(1);
const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
function hullIdx(pts){
  const idx = pts.map((_, i) => i).sort((a, b) => pts[a][0] - pts[b][0] || pts[a][1] - pts[b][1]);
  const lower = [], upper = [];
  for (const i of idx){ while (lower.length >= 2 && cross(pts[lower[lower.length-2]], pts[lower[lower.length-1]], pts[i]) <= 0) lower.pop(); lower.push(i); }
  for (let k = idx.length - 1; k >= 0; k--){ const i = idx[k]; while (upper.length >= 2 && cross(pts[upper[upper.length-2]], pts[upper[upper.length-1]], pts[i]) <= 0) upper.pop(); upper.push(i); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
const polyArea = poly => Math.abs(poly.reduce((s, p, k) => { const q = poly[(k+1) % poly.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
function boundaryEdges(simp){
  const cnt = new Map();
  for (const t of simp) for (const [a, b] of [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]]){
    const k = a < b ? a+","+b : b+","+a; cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  const out = []; cnt.forEach((c, k) => { if (c === 1) out.push(k.split(",").map(Number)); });
  return out;
}
function loopsPath(edges){
  const adj = new Map(), used = new Set(), key = (a, b) => a < b ? a+","+b : b+","+a;
  for (const [a, b] of edges){ (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); }
  let d = "";
  for (const [a0, b0] of edges){
    if (used.has(key(a0, b0))) continue;
    used.add(key(a0, b0));
    const loop = [a0, b0]; let prev = a0, cur = b0;
    while (cur !== a0){
      const next = (adj.get(cur) || []).find(v => v !== prev && !used.has(key(cur, v)));
      if (next === undefined) break;
      used.add(key(cur, next)); loop.push(next); prev = cur; cur = next;
    }
    d += "M" + loop.map(i => f1(pts[i][0]) + "," + f1(pts[i][1])).join("L") + "Z";
  }
  return d;
}
const HULL = hullIdx(pts).map(i => pts[i]);
const HULL_AREA = polyArea(HULL);
const ALPHA_AREA = DATA.simp.reduce((s, t) => s + polyArea(t.map(i => pts[i])), 0);

/* ==================== drawing ==================== */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svg = document.getElementById("svg");
{
  const g = el("g", {}, svg);
  el("path", {d:`M${x0},${y1-6}V${y0}H${x1+6}`, class:"axis"}, g);
  el("path", {d:`M${x1+12},${y0}l-9,-5v10z`, class:"arrow"}, g);
  el("path", {d:`M${x0},${y1-12}l-5,9h10z`, class:"arrow"}, g);
  el("text", {x:(x0+x1)/2, y:H-10, "text-anchor":"middle", class:"axis-title"}, g).textContent = "PC1";
  el("text", {x:0, y:0, "text-anchor":"middle", class:"axis-title",
    transform:`translate(${x0-16},${(y0+y1)/2}) rotate(-90)`}, g).textContent = "PC2";
}
const hullPath = el("path", {d:"M" + HULL.map(p => f1(p[0]) + "," + f1(p[1])).join("L") + "Z", class:"shape"}, svg);
const alphaPath = el("path", {d:loopsPath(boundaryEdges(DATA.simp)), class:"shape off"}, svg);
const gPts = el("g", {}, svg);
pts.forEach(p => el("circle", {cx:f1(p[0]), cy:f1(p[1]), r:5, class:"pt"}, gPts));
let val = null;
if (P.get("area") !== "0"){
  const readout = el("text", {x:x1, y:y1 + 4, "text-anchor":"end", "dominant-baseline":"hanging", class:"readout"}, svg);
  val = el("tspan", {class:"val"}, readout);
  readout.appendChild(document.createTextNode(" of the convex hull area"));
}

/* ==================== toggle ==================== */
const sw = document.getElementById("sw");
let alpha = P.get("outline") === "alpha";
function setAlpha(on){
  alpha = !!on;
  hullPath.classList.toggle("off", alpha);
  alphaPath.classList.toggle("off", !alpha);
  sw.classList.toggle("on", alpha); sw.setAttribute("aria-checked", String(alpha));
  document.getElementById("lHull").classList.toggle("active", !alpha);
  document.getElementById("lAlpha").classList.toggle("active", alpha);
  if (val) val.textContent = Math.round(100 * (alpha ? ALPHA_AREA : HULL_AREA) / HULL_AREA) + "%";
  if (bc) bc.postMessage({cmd:"status", arg:{alpha}});
}
sw.addEventListener("click", () => setAlpha(!alpha));
sw.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); setAlpha(!alpha); } });
document.getElementById("lHull").addEventListener("click", () => setAlpha(false));
document.getElementById("lAlpha").addEventListener("click", () => setAlpha(true));

const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(P.get("channel") || "hullalpha") : null;
if (bc) bc.onmessage = e => { const m = e.data || {}; if (m.cmd === "set") setAlpha(m.arg); if (m.cmd === "ping") bc.postMessage({cmd:"status", arg:{alpha}}); };

setAlpha(alpha);
window.hullAlpha = {DATA, HULL_AREA, ALPHA_AREA, setAlpha};
})();
</script>
</body>
</html>
